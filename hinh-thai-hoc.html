<body>

<a href="index.html#korean" class="back-btn">← Quay lại ENJOY KOREAN</a>

<div class="quiz-container">
    <h1 class="main-title">ÔN TẬP CUỐI KỲ HÌNH THÁI HỌC TIẾNG HÀN</h1>

    <!-- Màn hình chính trắc nghiệm -->
    <div id="menu-box" class="menu-screen">
        <p style="font-size: 1.1rem; color: #cbd5e1; margin-bottom: 25px; font-weight: 400;">Vui lòng chọn chế độ học tập:</p>
        <button class="menu-btn btn-theory" onclick="startMode('theory')">1. Ôn tập Lý thuyết (60 câu)</button>
        <button class="menu-btn btn-practice" onclick="startMode('practice')">2. Ôn tập Bài tập (20 câu)</button>
        <button class="menu-btn btn-exam" onclick="startMode('exam')">3. Kiểm tra (Random 20 câu - 10 phút)</button>
    </div>

    <!-- Màn hình làm bài -->
    <div id="quiz-box" style="display: none;">
        <div class="header">
            <span class="progress-text" id="progress">Câu hỏi 1 / 60</span>
            <span class="score-text" id="score-display">Điểm: 0</span>
            <span class="timer-text" id="timer-display" style="display: none;">Thời gian: 10:00</span>
        </div>
        <div class="question-title" id="question-text">Đang tải câu hỏi...</div>
        <div class="options-container" id="options-box"></div>
        <div class="controls">
            <button class="btn-nav btn-home" onclick="goHome()">🏠 Menu</button>
            <div>
                <button class="btn-nav" id="btn-prev" onclick="prevQuestion()" disabled>← Câu trước</button>
                <button class="btn-nav" id="btn-next" onclick="nextQuestion()">Câu tiếp →</button>
                <button class="btn-nav btn-submit" id="btn-finish" onclick="confirmSubmit()" style="display: none;">Nộp bài</button>
            </div>
        </div>
    </div>
    
    <!-- Màn hình kết quả -->
    <div id="result-box" class="result-screen" style="display: none;">
        <h2 id="result-title">Hoàn thành bài ôn tập!</h2>
        <p id="final-score" style="font-size: 1.2rem; margin: 20px 0;"></p>
        <button class="btn-action btn-theory" onclick="restartMode()">Làm lại chế độ này</button>
        <button class="btn-action btn-home" onclick="goHome()">Về menu trắc nghiệm</button>
        
        <div id="review-section" class="review-container"></div>
    </div>

    <div class="footer-credits">
        Trang web này được thiết kế bởi Thạc sĩ Lương Quốc An (HUFLIT) dựa trên công cụ Gemini
    </div>
</div>

<script>
const theoryData = [
    { q: "문장에서 주어, 목적어, 보어로 쓰이는 단어 부류를 무엇이라고 합니까?", options: ["체언", "용언", "수식언", "독립언"], answer: "체언" },
    { q: "어근 앞에 붙는 접사를 무엇이라고 합니까?", options: ["어미", "어간", "접미사", "접두사"], answer: "접두사" },
    { q: "형태론이 연구하는 대상이 아닌 것을 고르십시오.", options: ["단어", "형태소", "단어 형성", "문장 성분"], answer: "문장 성분" },
    { q: "어휘적인 의미를 가지는 형태소를 무엇이라고 합니까?", options: ["형식형태소", "문법형태소", "실질형태소", "유일형태소"], answer: "실질형태소" },
    { q: "접사를 어근에 대한 작용에 따라 분류할 때, 어근의 품사를 바꾸는 접사를 무엇이라고 합니까?", options: ["접두사", "접미사", "한정적 접사", "지배적 접사"], answer: "지배적 접사" },
    { q: "형식형태소에 속하는 것을 모두 포함한 것을 고르십시오.", options: ["자립형태소 전체", "명사, 대명사, 수사", "동사와 형용사의 어간", "조사, 어미, 접두사, 접미사"], answer: "조사, 어미, 접두사, 접미사" },
    { q: "다음 중 체언에 속하지 않는 것을 고르십시오.", options: ["명사", "조사", "대명사", "수사"], answer: "조사" },
    { q: "특정 단어의 구성 요소로만 쓰이는 형태소를 무엇이라고 합니까?", options: ["이형태", "유일형태소", "자립형태소", "형식형태소"], answer: "유일형태소" },
    { q: "문장에서 홀로 쓰일 수 없는 형태소를 무엇이라고 합니까?", options: ["자립형태소", "의존형태소", "실질형태소", "유일형태소"], answer: "의존형태소" },
    { q: "여러 성분 사이의 관계를 나타내는 단어 부류를 무엇이라고 합니까?", options: ["체언", "관계언", "수식언", "독립언"], answer: "관계언" },
    { q: "재귀대명사에 대한 설명으로 맞는 것을 고르십시오.", options: ["화자 자신을 대신하는 대명사이다.", "청자 자신을 대신하는 대명사이다.", "모르는 대상을 가리키는 대명사이다.", "앞에 나온 체언을 대신하는 주어로 쓰이는 대명사이다."], answer: "앞에 나온 체언을 대신하는 주어로 쓰이는 대명사이다." },
    { q: "접사를 어근과 결합하는 위치에 따라 분류할 때, 어근 뒤에 붙는 접사를 무엇이라고 합니까?", options: ["접두사", "접미사", "지배적 접사", "한정적 접사"], answer: "접미사" },
    { q: "다음 중 능격동사에 대한 설명으로 맞는 것을 고르십시오.", options: ["동작이 주어에만 영향을 미치는 동사이다.", "동작이 목적어에도 영향을 미치는 동사이다.", "자동사와 타동사로 모두 쓰이는 동사이다.", "반드시 목적어와 결합해야 하는 동사이다."], answer: "자동사와 타동사로 모두 쓰이는 동사이다." },
    { q: "미지칭 대명사에 해당하는 것을 고르십시오.", options: ["아무", "자기", "누구", "당신"], answer: "누구" },
    { q: "접두 파생에 대한 설명으로 맞는 것을 고르십시오.", options: ["접두사는 어근의 뒤에 결합한다.", "접두사는 문법적 기능만 더해 준다.", "접두사가 결합하면 항상 품사가 바뀐다.", "접두사가 결합해서 만들어진 파생어의 품사는 어근의 품사와 같다."], answer: "접두사가 결합해서 만들어진 파생어의 품사는 어근의 품사와 같다." },
    { q: "관형사에 대한 설명으로 맞지 않는 것을 고르십시오.", options: ["활용하지 않는다.", "조사와 결합할 수 있다.", "체언 앞에 쓰여 그 체언을 꾸며 준다.", "성상관형사, 수관형사, 지시관형사로 나뉜다."], answer: "조사와 결합할 수 있다." },
    { q: "부사가 여러 개 겹쳐 쓰일 때의 일반적인 순서로 맞는 것을 고르십시오.", options: ["성상부사 → 지시부사 → 부정부사", "지시부사 → 성상부사 → 부정부사", "부정부사 → 지시부사 → 성상부사", "지시부사 → 부정부사 → 성상부사"], answer: "지시부사 → 성상부사 → 부정부사" },
    { q: "부정대명사에 대한 설명으로 맞는 것을 고르십시오.", options: ["청자를 대신하는 대명사이다.", "특정한 사람을 가리키지 않을 때 쓰이는 대명사이다.", "화자로부터의 거리에 따라 선택되는 대명사이다.", "앞에 나온 체언을 대신하는 3인칭 주어 대명사이다."], answer: "특정한 사람을 가리키지 않을 때 쓰이는 대명사이다." },
    { q: "두 단어의 일부를 결합해서 새로운 단어를 만드는 방법을 무엇이라고 합니까?", options: ["두자어 형성", "혼성", "음절 축약", "영파생"], answer: "혼성" },
    { q: "다음 중 보조사에 해당하는 것을 고르십시오.", options: ["이/가", "을/를", "의", "은/는"], answer: "은/는" },
    { q: "감탄사에 대한 설명으로 맞는 것을 고르십시오.", options: ["체언을 꾸며 주는 품사이다.", "용언을 꾸며 주는 품사이다.", "화자의 감정이나 의지를 나타내는 품사이다.", "문장 속에서 다른 성분과의 관계를 나타내는 품사이다."], answer: "화자의 감정이나 의지를 나타내는 품사이다." },

    { q: "‘햇과일’에서 ‘햇-’이 나타내는 의미를 고르십시오.", options: ["아직 덜 익은 것", "당해에 새로 난 것", "크고 튼튼한 것", "색깔이 붉은 것"], answer: "당해에 새로 난 것" },
    { q: "다음 중 문장을 단어 단위로 가장 올바르게 분석한 것은 무엇입니까?\n“오늘은 비가 와서 추워요.”", options: ["오늘 / 은 / 비 / 가 / 와서 / 추워요", "오늘은 / 비가 / 와서 / 추워요", "오늘 / 은 / 비 / 가 / 오 / 아서 / 춥 / 어요", "오늘은 / 비 / 가 / 와서 / 추워요"], answer: "오늘 / 은 / 비 / 가 / 와서 / 추워요" },
    { q: "‘웃음’의 형성 과정으로 맞는 것을 고르십시오.", options: ["웃-(어근) + -음(접사)", "웃음(단일어)", "우-(어근) + -슴(접사)", "웃-(접사) + -음(어근)"], answer: "웃-(어근) + -음(접사)" },
    { q: "‘길러’를 형태소 분석한 결과로 알맞은 것은 무엇입니까?", options: ["길러", "길- + -러", "기르- + -어", "길ㄹ- + -어"], answer: "기르- + -어" },
    { q: "다음 문장에서 자립형태소의 개수를 고르십시오.\n“구름이 걷히고 해가 났다.”", options: ["1", "2", "3", "4"], answer: "2" },
    { q: "단어 ‘돼지고기덮밥’을 직소분석할 때 가장 알맞은 형식을 고르십시오.", options: [
        "돼지고기덮밥\n→ 돼지고기 → 돼지 + 고기\n→ 덮밥 → 덮- + 밥", 
        "돼지고기덮밥\n→ 돼지고기\n→ 덮밥 → 덮- + 밥", 
        "돼지고기덮밥\n→ 돼지\n→ 고기\n→ 덮밥 → 덮- + 밥", 
        "돼지고기덮밥\n→ 돼지고기 → 돼지 + 고기\n→ 덮밥"
    ], answer: "돼지고기덮밥\n→ 돼지고기 → 돼지 + 고기\n→ 덮밥 → 덮- + 밥" }
];

let questions = [];
let currentIdx = 0;
let userAnswers = [];
let currentMode = '';
let timerInterval = null;
let timeLeft = 600;

function shuffle(array) {
    let newArr = JSON.parse(JSON.stringify(array));
    for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
    }
    return newArr;
}

function startMode(mode) {
    currentMode = mode;
    clearInterval(timerInterval);
    document.getElementById('timer-display').style.display = 'none';

    if (mode === 'theory') {
        questions = shuffle(theoryData);
    } else if (mode === 'practice') {
        questions = shuffle(practiceData);
    } else if (mode === 'exam') {
        const combined = [...theoryData, ...practiceData];
        questions = shuffle(combined).slice(0, 20);
        startTimer(600);
    }

    currentIdx = 0;
    userAnswers = new Array(questions.length).fill(null);

    document.getElementById('menu-box').style.display = 'none';
    document.getElementById('quiz-box').style.display = 'block';
    document.getElementById('result-box').style.display = 'none';

    renderQuestion();
}

function startTimer(seconds) {
    timeLeft = seconds;
    const timerDisplay = document.getElementById('timer-display');
    timerDisplay.style.display = 'inline';
    
    updateTimerText();
    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerText();
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            alert("Đã hết thời gian 10 phút! Hệ thống sẽ tự động nộp bài.");
            finishQuiz();
        }
    }, 1000);
}

function updateTimerText() {
    const mins = Math.floor(timeLeft / 60);
    const secs = timeLeft % 60;
    document.getElementById('timer-display').innerText = `Thời gian: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

function renderQuestion() {
    const qData = questions[currentIdx];
    document.getElementById('progress').innerText = `Câu hỏi ${currentIdx + 1} / ${questions.length}`;
    document.getElementById('question-text').innerText = qData.q;
    
    if (currentMode !== 'exam') {
        const correctCount = userAnswers.filter((ans, idx) => ans !== null && ans === questions[idx].answer).length;
        document.getElementById('score-display').innerText = `Điểm: ${correctCount}`;
        document.getElementById('score-display').style.display = 'inline';
    } else {
        document.getElementById('score-display').style.display = 'none';
    }

    const optionsBox = document.getElementById('options-box');
    optionsBox.innerHTML = '';
    const selectedAns = userAnswers[currentIdx];

    qData.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;

        if (currentMode === 'exam') {
            if (selectedAns === opt) btn.classList.add('selected');
            btn.onclick = () => selectOption(opt);
        } else {
            if (selectedAns !== null) {
                btn.disabled = true;
                if (opt === qData.answer) btn.classList.add('correct');
                if (opt === selectedAns && selectedAns !== qData.answer) btn.classList.add('wrong');
            } else {
                btn.onclick = () => selectOption(opt);
            }
        }

        optionsBox.appendChild(btn);
    });

    document.getElementById('btn-prev').disabled = currentIdx === 0;
    
    if (currentIdx === questions.length - 1) {
        document.getElementById('btn-next').style.display = 'none';
        document.getElementById('btn-finish').style.display = 'inline-block';
    } else {
        document.getElementById('btn-next').style.display = 'inline-block';
        document.getElementById('btn-finish').style.display = 'none';
    }
}

function selectOption(opt) {
    userAnswers[currentIdx] = opt;
    renderQuestion();
}

function prevQuestion() {
    if (currentIdx > 0) {
        currentIdx--;
        renderQuestion();
    }
}

function nextQuestion() {
    if (currentIdx < questions.length - 1) {
        currentIdx++;
        renderQuestion();
    }
}

function confirmSubmit() {
    const unanswered = userAnswers.filter(ans => ans === null).length;
    if (unanswered > 0 && currentMode === 'exam') {
        if (!confirm(`Bạn còn ${unanswered} câu chưa trả lời. Bạn có chắc chắn muốn nộp bài?`)) {
            return;
        }
    }
    finishQuiz();
}

function finishQuiz() {
    clearInterval(timerInterval);
    document.getElementById('quiz-box').style.display = 'none';
    document.getElementById('result-box').style.display = 'block';
    
    const correctCount = userAnswers.filter((ans, idx) => ans === questions[idx].answer).length;
    const percentage = Math.round((correctCount / questions.length) * 100);
    
    document.getElementById('result-title').innerText = currentMode === 'exam' ? 'Kết Quả Bài Kiểm Tra' : 'Hoàn thành bài ôn tập!';
    document.getElementById('final-score').innerHTML = 
        `Bạn trả lời đúng <strong>${correctCount}</strong> / <strong>${questions.length}</strong> câu.<br>Tỷ lệ đúng: <strong>${percentage}%</strong>`;

    const reviewBox = document.getElementById('review-section');
    reviewBox.innerHTML = '<h3 style="text-align:center; color:#38bdf8; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 8px;">Chi tiết bài làm</h3>';
    
    questions.forEach((q, idx) => {
        const uAns = userAnswers[idx];
        const isCorrect = uAns === q.answer;
        
        const item = document.createElement('div');
        item.className = `review-item ${isCorrect ? 'status-correct' : 'status-wrong'}`;
        
        item.innerHTML = `
            <div class="review-q">Câu ${idx + 1}: ${q.q}</div>
            <div class="review-ans" style="color: ${isCorrect ? '#22c55e' : '#f43f5e'};">
                Lựa chọn của bạn: <strong>${uAns !== null ? uAns : 'Chưa chọn'}</strong> ${isCorrect ? '✓' : '✗'}
            </div>
            ${!isCorrect ? `<div class="review-ans" style="color: #22c55e;">Đáp án đúng: <strong>${q.answer}</strong></div>` : ''}
        `;
        reviewBox.appendChild(item);
    });
}

function restartMode() {
    startMode(currentMode);
}

function goHome() {
    clearInterval(timerInterval);
    document.getElementById('quiz-box').style.display = 'none';
    document.getElementById('result-box').style.display = 'none';
    document.getElementById('menu-box').style.display = 'block';
}
</script>
