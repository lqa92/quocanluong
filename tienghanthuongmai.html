<script>
const LESSONS = [{"key": "b1", "tab": "Bài 1. Cung và cầu", "mid": "Bài 1. Cung và cầu", "short": "Bài 1", "ko": "수요와 공급", "eyebrow": "Bài 1 · Cung và cầu", "qs": [{"n": 1, "p": "재화를 사고자 하는 욕구를 무엇이라고 하는가?", "o": ["공급", "수요", "균형", "생산"], "a": 1, "e": "Cầu (수요) là mong muốn mua hàng hóa. Mong muốn bán hàng hóa là cung (공급).", "star": false, "img": null}, {"n": 2, "p": "다음 빈칸에 들어갈 말로 알맞은 것은?<div class=\"quote\">“수요와 공급을 결정하는 가장 중요한 요인은 (　　　)이다.”</div>", "o": ["소득", "광고", "가격", "인구"], "a": 2, "e": "Yếu tố quan trọng nhất quyết định cả cầu và cung là giá cả (가격).", "star": false, "img": null}, {"n": 3, "p": "다음 중 경제학에서 말하는 ‘수요’가 있는 경우는?", "o": ["A씨는 아이폰을 사고 싶지만 돈이 부족하다.", "A씨는 돈은 있지만 아이폰을 사고 싶지 않다.", "A씨는 자신의 아이폰을 다른 사람에게 팔고 싶다.", "A씨는 아이폰을 사고 싶고 살 돈도 충분하다."], "a": 3, "e": "Cầu trong kinh tế học cần đủ hai điều kiện: <b>muốn mua</b> và <b>có khả năng chi trả</b>. ① muốn nhưng không có tiền, ② có tiền nhưng không muốn, ③ là mong muốn bán (thuộc về cung).", "star": false, "img": null}, {"n": 4, "p": "수요 법칙에 대한 설명으로 옳은 것은?", "o": ["가격이 오르면 수요량이 감소한다.", "가격이 오르면 수요량도 증가한다.", "가격과 수요량은 관계가 없다.", "가격이 내리면 수요량이 감소한다."], "a": 0, "e": "Quy luật cầu: giá và lượng cầu quan hệ <b>nghịch chiều</b> — giá tăng thì lượng cầu giảm, giá giảm thì lượng cầu tăng.", "star": false, "img": null}, {"n": 5, "p": "수요 곡선의 일반적인 모양으로 알맞은 것은?", "o": ["오른쪽 위로 올라가는 모양", "오른쪽 아래로 내려오는 모양", "가로로 평평한 모양", "세로로 곧은 모양"], "a": 1, "e": "Đường cầu dốc xuống từ trái sang phải (오른쪽 아래로 내려오는 모양) vì giá và lượng cầu quan hệ nghịch. Đường dốc lên là đường cung.", "star": false, "img": null}, {"n": 6, "p": "경제 용어와 그 뜻을 바르게 연결한 것은?<div class=\"tw\"><table class=\"dt\"><tr><th>용어</th><th>뜻</th></tr><tr><td>가. 수요</td><td>A. 재화를 팔고자 하는 욕구</td></tr><tr><td>나. 공급</td><td>B. 수요량과 공급량이 같아질 때의 가격</td></tr><tr><td>다. 균형 가격</td><td>C. 재화를 사고자 하는 욕구</td></tr></table></div>", "o": ["가-A, 나-C, 다-B", "가-B, 나-A, 다-C", "가-C, 나-A, 다-B", "가-C, 나-B, 다-A"], "a": 2, "e": "수요 = mong muốn mua (C); 공급 = mong muốn bán (A); 균형 가격 = mức giá mà tại đó lượng cầu bằng lượng cung (B).", "star": false, "img": null}, {"n": 7, "p": "공급 법칙에 따르면, 가격이 내려가면 공급량은 어떻게 되는가?", "o": ["증가한다.", "변하지 않는다.", "수요량과 같아진다.", "감소한다."], "a": 3, "e": "Quy luật cung: giá và lượng cung quan hệ <b>cùng chiều</b>. Giá giảm thì người bán muốn bán ít hơn → lượng cung giảm.", "star": false, "img": null}, {"n": 8, "p": "공급 함수 Qˢ = a + bP에서 b에 대한 설명으로 옳은 것은?", "o": ["b &lt; 0", "b = 0", "b &gt; 0", "b는 항상 1이다."], "a": 2, "e": "Đường cung dốc lên (giá tăng thì lượng cung tăng) nên hệ số b &gt; 0. Ngược lại, hàm cầu có b &lt; 0.", "star": false, "img": null}, {"n": 9, "p": "다음 빈칸 (가), (나)에 들어갈 말로 알맞은 것은?<div class=\"quote\">“수요량이 공급량보다 많은 상태를 (가), 공급량이 수요량보다 많은 상태를 (나)라고 한다.”</div>", "o": ["(가) 초과 수요 – (나) 초과 공급", "(가) 초과 공급 – (나) 초과 수요", "(가) 균형 – (나) 불균형", "(가) 수요 증가 – (나) 공급 증가"], "a": 0, "e": "Lượng cầu &gt; lượng cung → dư cầu (초과 수요). Lượng cung &gt; lượng cầu → dư cung (초과 공급).", "star": false, "img": null}, {"n": 10, "p": "균형점에 대한 설명으로 옳은 것은?", "o": ["수요량이 공급량보다 많은 점이다.", "수요 곡선과 공급 곡선이 만나는 점이다.", "가격이 가장 높은 점이다.", "거래량이 0인 점이다."], "a": 1, "e": "Điểm cân bằng là giao điểm của đường cầu và đường cung — tại đó lượng cầu bằng lượng cung.", "star": false, "img": null}, {"n": 11, "p": "[그림]에서 가격이 P₁일 때의 시장 상황과 앞으로의 가격 변화를 바르게 짝지은 것은?", "o": ["초과 수요(b−a) – 가격 상승", "초과 공급(b−a) – 가격 하락", "초과 공급(b−a) – 가격 상승", "균형 상태 – 가격 변화 없음"], "a": 1, "e": "Tại P₁ (cao hơn giá cân bằng P₀): lượng cầu là a, lượng cung là b, a &lt; b → <b>dư cung</b> (b−a). Người bán cạnh tranh hạ giá để bán được hàng → giá giảm dần về P₀.", "star": false, "img": "fig1"}, {"n": 12, "p": "초과 수요가 발생했을 때 시장에서 일어나는 일로 옳지 않은 것은?", "o": ["물건이 부족해진다.", "사려는 소비자들 사이에 경쟁이 생긴다.", "시장 가격이 점차 오른다.", "판매자들이 먼저 팔기 위해 경쟁적으로 값을 내린다."], "a": 3, "e": "Khi dư cầu: hàng bị thiếu, người mua cạnh tranh nhau, giá tăng. \"Người bán đua nhau hạ giá\" là hiện tượng của <b>dư cung</b>, nên ④ sai.", "star": false, "img": null}, {"n": 13, "p": "다음 중 수요 곡선을 오른쪽으로 이동시키는 요인이 아닌 것은?", "o": ["소득 증가", "선호도 상승", "보완재 가격 상승", "대체재 가격 상승"], "a": 2, "e": "Giá hàng bổ sung tăng → người ta mua ít hàng này hơn → cầu giảm → đường cầu dịch sang <b>trái</b>. Ba yếu tố còn lại đều làm đường cầu dịch sang phải.", "star": false, "img": null}, {"n": 14, "p": "수요와 공급에 대한 설명으로 옳지 않은 것은?", "o": ["수요가 있으려면 ‘사고 싶은 마음’과 ‘살 수 있는 능력’이 모두 있어야 한다.", "상품 자체의 가격이 변하면 수요 곡선 자체가 이동한다.", "공급 곡선의 우측 이동은 같은 가격에서 더 많이 공급하려는 것을 뜻한다.", "균형 가격에서는 초과 수요도 초과 공급도 없다."], "a": 1, "e": "② sai: giá của chính hàng hóa thay đổi chỉ làm <b>di chuyển dọc theo</b> đường cầu (thay đổi lượng cầu). Đường cầu chỉ <b>dịch chuyển</b> khi các yếu tố ngoài giá thay đổi (thu nhập, sở thích, giá hàng liên quan…).", "star": true, "img": null}, {"n": 15, "p": "공급 곡선을 오른쪽으로 이동시키는 요인을 〈보기〉에서 모두 고른 것은?<div class=\"box\"><div class=\"box-t\">〈보기〉</div><p>ㄱ. 생산 기술의 발달</p><p>ㄴ. 생산 요소 가격의 상승</p><p>ㄷ. 공급자 수의 증가</p><p>ㄹ. 정부 보조금의 증가</p></div>", "o": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "a": 2, "e": "Công nghệ phát triển (ㄱ), số người bán tăng (ㄷ), trợ cấp tăng (ㄹ) → cung tăng, đường cung dịch phải. Giá yếu tố sản xuất tăng (ㄴ) → chi phí tăng → cung giảm, đường cung dịch trái.", "star": false, "img": null}, {"n": 16, "p": "[그림]과 같은 변화가 나타내는 의미로 가장 알맞은 것은?", "o": ["같은 가격에서 소비자들이 더 많이 사려고 한다.", "가격이 올라서 수요량이 줄었다.", "같은 가격에서 기업들이 더 많이 팔려고 한다.", "소비자들의 구매 능력이 줄었다."], "a": 0, "e": "Đường cầu dịch từ D₁ sang D₂ (sang phải): ở <b>cùng mức giá</b>, người tiêu dùng muốn và có khả năng mua nhiều hơn. ③ mô tả đường cung dịch phải.", "star": false, "img": "fig2"}, {"n": 17, "p": "[그림]에 대한 설명으로 옳은 것을 〈보기〉에서 모두 고른 것은?<div class=\"box\"><div class=\"box-t\">〈보기〉</div><p>ㄱ. A → B는 상품 자체의 가격이 내려서 나타난다.</p><p>ㄴ. A → B는 수요 곡선 자체가 이동한 것이다.</p><p>ㄷ. A → C는 소득이 증가하면 나타날 수 있다.</p><p>ㄹ. A → C는 같은 가격에서 수요량이 30만큼 늘어난 것이다.</p></div>", "o": ["ㄱ, ㄴ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ"], "a": 3, "e": "A → B: giá giảm từ 60 xuống 40, điểm di chuyển <b>dọc theo</b> D₁ → ㄱ đúng, ㄴ sai. A → C: ở cùng giá 60, lượng cầu tăng từ 40 lên 70 (tăng 30) → đường cầu dịch sang phải, có thể do thu nhập tăng → ㄷ, ㄹ đúng.", "star": true, "img": "fig3"}, {"n": 18, "p": "다음 빈칸 (가), (나)에 들어갈 말로 알맞은 것은?<div class=\"quote\">“커피와 설탕처럼 함께 사용하는 재화를 (가), 커피와 차처럼 대신 사용할 수 있는 재화를 (나)라고 한다.”</div>", "o": ["(가) 보완재 – (나) 대체재", "(가) 대체재 – (나) 보완재", "(가) 대체재 – (나) 대체재", "(가) 보완재 – (나) 보완재"], "a": 0, "e": "Hàng dùng kèm nhau (cà phê – đường) là <b>hàng bổ sung</b> (보완재). Hàng dùng thay cho nhau (cà phê – trà) là <b>hàng thay thế</b> (대체재).", "star": false, "img": null}, {"n": 19, "p": "다음 중 공급 곡선을 왼쪽으로 이동시키는 것은?", "o": ["생산 기술이 발달했다.", "공급자의 수가 늘었다.", "원자재 가격이 내렸다.", "판매자들이 앞으로 가격이 크게 오를 것이라고 예상한다."], "a": 3, "e": "Người bán dự đoán giá sắp tăng → giữ hàng lại để bán sau với giá cao → cung hiện tại giảm (dịch trái). ①②③ đều làm đường cung dịch phải.", "star": true, "img": null}, {"n": 20, "p": "다음 빈칸 (가), (나)에 들어갈 말로 알맞은 것은?<div class=\"quote\">“수요 곡선은 오른쪽으로, 공급 곡선은 왼쪽으로 동시에 이동하면 균형 가격은 (가), 균형 거래량은 (나).”</div>", "o": ["(가) 반드시 오른다 – (나) 어떻게 될지 알 수 없다", "(가) 반드시 오른다 – (나) 반드시 늘어난다", "(가) 반드시 내린다 – (나) 어떻게 될지 알 수 없다", "(가) 어떻게 될지 알 수 없다 – (나) 반드시 늘어난다"], "a": 0, "e": "Cầu tăng làm giá tăng, cung giảm cũng làm giá tăng → giá <b>chắc chắn tăng</b>. Còn lượng: cầu tăng làm lượng tăng, cung giảm làm lượng giảm → tùy bên nào dịch nhiều hơn, <b>không xác định</b> được.", "star": true, "img": null}, {"n": 21, "p": "가뭄으로 커피 원두 생산량이 감소했다. 커피 원두 시장의 변화를 바르게 나타낸 그래프는?<div class=\"note\">점선: 이동한 후의 곡선, E₁: 처음 균형점, E₂: 새 균형점</div>", "o": ["IMG:o1", "IMG:o2", "IMG:o3", "IMG:o4"], "a": 3, "e": "Hạn hán làm sản lượng giảm → <b>cung giảm</b> → đường cung dịch trái (S → S') → giá tăng, lượng giảm. Đó là hình ④.", "star": false, "img": null}, {"n": 22, "p": "국민들의 소득이 전반적으로 증가했다. 휴대전화 시장의 변화를 바르게 나타낸 그래프는?<div class=\"note\">점선: 이동한 후의 곡선, E₁: 처음 균형점, E₂: 새 균형점</div>", "o": ["IMG:o1", "IMG:o2", "IMG:o3", "IMG:o4"], "a": 0, "e": "Thu nhập tăng → <b>cầu</b> điện thoại <b>tăng</b> → đường cầu dịch phải (D → D') → giá và lượng đều tăng. Đó là hình ①.", "star": false, "img": null}, {"n": 23, "p": "새로운 기술이 개발되어 휴대전화 생산비가 줄었다. 휴대전화 시장의 변화를 바르게 나타낸 그래프는?<div class=\"note\">점선: 이동한 후의 곡선, E₁: 처음 균형점, E₂: 새 균형점</div>", "o": ["IMG:o1", "IMG:o2", "IMG:o3", "IMG:o4"], "a": 2, "e": "Chi phí sản xuất giảm → <b>cung tăng</b> → đường cung dịch phải → giá giảm, lượng tăng. Đó là hình ③.", "star": false, "img": null}, {"n": 24, "p": "휴대전화 통화 요금이 크게 올랐다. 휴대전화 시장의 변화를 바르게 나타낸 그래프는?<div class=\"note\">점선: 이동한 후의 곡선, E₁: 처음 균형점, E₂: 새 균형점</div>", "o": ["IMG:o1", "IMG:o2", "IMG:o3", "IMG:o4"], "a": 1, "e": "Cước gọi là <b>hàng bổ sung</b> của điện thoại. Giá hàng bổ sung tăng → cầu điện thoại giảm → đường cầu dịch trái → giá và lượng đều giảm. Đó là hình ②.", "star": false, "img": null}, {"n": 25, "p": "다음 신문 기사 제목의 의미로 가장 알맞은 것은?<div class=\"quote\">“배추 생산 과잉, 농민들 한숨”</div>", "o": ["배추의 생산량이 부족하여 농민들이 실망했다.", "배추 농사가 잘 되어 농민들이 희망에 차 있다.", "배추가 적게 생산되어 농민들의 기대감이 낮아졌다.", "배추가 필요 이상으로 생산되어 농민들이 힘들어한다."], "a": 3, "e": "“과잉” = dư thừa, nhiều hơn mức cần; “한숨” = thở dài (khó khăn, buồn). → Cải thảo được sản xuất quá nhiều khiến nông dân khốn đốn.", "star": false, "img": null}, {"n": 26, "p": "“배추 생산 과잉, 농민들 한숨”이라는 상황에서 배추 시장에 대한 설명으로 옳은 것은?", "o": ["초과 공급이 생겨 배추 가격이 내려간다.", "초과 수요가 생겨 배추 가격이 올라간다.", "초과 공급이 생겨 배추 가격이 올라간다.", "초과 수요가 생겨 배추 가격이 내려간다."], "a": 0, "e": "Sản xuất dư thừa → lượng cung &gt; lượng cầu → <b>dư cung</b> → giá cải thảo giảm. Vì giá giảm nên nông dân “thở dài”.", "star": false, "img": null}, {"n": 27, "p": "2020년 설 연휴 직후 코로나19가 퍼지면서 마스크 가격이 크게 올랐다. 가장 큰 원인은?", "o": ["마스크의 공급이 크게 늘었다.", "마스크의 수요가 갑자기 크게 늘었다.", "마스크의 수요가 크게 줄었다.", "마스크 생산 기술이 발달했다."], "a": 1, "e": "Covid-19 lan rộng → nhu cầu khẩu trang <b>tăng đột biến</b> (đường cầu dịch phải) → dư cầu → giá tăng vọt.", "star": false, "img": null}, {"n": 28, "p": "2020년 초 크게 올랐던 마스크 가격이 이후 다시 내려간 원인으로 알맞은 것을 〈보기〉에서 모두 고른 것은?<div class=\"box\"><div class=\"box-t\">〈보기〉</div><p>ㄱ. 마스크를 만드는 공장이 늘어났다.</p><p>ㄴ. 정부가 마스크 생산을 지원했다.</p><p>ㄷ. 사람들이 마스크를 더 많이 사고 싶어 했다.</p><p>ㄹ. 해외에서 마스크 수입이 늘었다.</p></div>", "o": ["ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ, ㄹ"], "a": 2, "e": "ㄱ, ㄴ, ㄹ đều làm <b>cung tăng</b> (đường cung dịch phải) → giá giảm. ㄷ làm cầu tăng → giá tăng, nên không phải nguyên nhân giá giảm.", "star": false, "img": null}, {"n": 29, "p": "베트남의 설(뗏) 기간에 많은 식당이 가격을 올리지만 손님은 여전히 많다. 그 이유로 가장 알맞은 것은?", "o": ["설 기간에는 수요 법칙이 적용되지 않기 때문이다.", "정부가 식당 가격을 정해 주기 때문이다.", "외식 수요는 크게 늘고, 문을 여는 식당은 줄어 공급이 감소하기 때문이다.", "식당들의 요리 기술이 발달했기 때문이다."], "a": 2, "e": "Dịp Tết, nhu cầu ăn ngoài tăng mạnh (cầu dịch phải), trong khi nhiều quán nghỉ Tết (cung dịch trái) → giá cân bằng mới cao hơn nhưng vẫn có nhiều khách. Quy luật cầu vẫn đúng, chỉ là cả hai đường đều dịch chuyển.", "star": false, "img": null}, {"n": 30, "p": "돼지고기 가격이 크게 올랐다. 이때 소고기 시장에서 일어날 변화로 가장 알맞은 것은?", "o": ["소고기의 수요 곡선이 오른쪽으로 이동한다.", "소고기의 수요 곡선이 왼쪽으로 이동한다.", "소고기의 공급 곡선이 오른쪽으로 이동한다.", "소고기 시장에는 아무 변화가 없다."], "a": 0, "e": "Thịt heo và thịt bò là <b>hàng thay thế</b>. Giá thịt heo tăng → nhiều người chuyển sang mua thịt bò → cầu thịt bò tăng → đường cầu thịt bò dịch phải.", "star": false, "img": null}, {"n": 31, "p": "가뭄으로 커피 원두 가격이 올랐다. 커피 회사 A는 커피 한 잔의 가격은 그대로 두고, 포장 원두 제품의 가격만 크게 올렸다. 그 이유로 가장 알맞은 것은?", "o": ["커피 한 잔에 대한 수요가 갑자기 크게 늘었기 때문이다.", "포장 원두는 원두 값이 원가의 대부분이지만, 커피 한 잔은 원두 값의 비중이 작고 가격을 올리면 손님을 잃을 수 있기 때문이다.", "포장 원두의 공급이 크게 늘었기 때문이다.", "정부가 커피 한 잔의 가격만 통제하기 때문이다."], "a": 1, "e": "Với một ly cà phê, hạt cà phê chỉ chiếm phần nhỏ chi phí (còn sữa, nhân công, mặt bằng…) và có nhiều quán cạnh tranh, tăng giá dễ mất khách. Với cà phê hạt đóng gói, giá hạt chiếm phần lớn giá vốn nên buộc phải tăng giá.", "star": true, "img": null}, {"n": 32, "p": "한 대학교가 공책을 공동 구매하려고 조사해 보니, 학교가 제시한 가격이 높을수록 공책을 공급하겠다는 사람이 많아졌다. 이 현상을 가장 잘 설명하는 것은?", "o": ["수요 법칙", "공급 법칙", "초과 수요", "수요 곡선의 이동"], "a": 1, "e": "Giá càng cao thì càng nhiều người muốn cung cấp → lượng cung tăng theo giá → đây là <b>quy luật cung</b>.", "star": false, "img": null}, {"n": 33, "p": "베트남 정부가 전기나 휘발유 같은 품목의 가격을 직접 관리하는 이유로 가장 알맞은 것은?", "o": ["이 품목들은 시장에서 항상 초과 공급이 생기기 때문이다.", "기업들의 이윤을 늘려 주기 위해서이다.", "이 품목들에는 수요 법칙이 적용되지 않기 때문이다.", "생활 필수품이라 가격이 비정상적으로 오르면 국민 생활에 큰 피해가 생기고, 시장 기능만으로는 해결하기 어렵기 때문이다."], "a": 3, "e": "Điện, xăng là hàng thiết yếu. Nếu giá tăng bất thường sẽ ảnh hưởng lớn đến đời sống người dân, và cơ chế thị trường (“bàn tay vô hình”) khó tự điều chỉnh kịp → Nhà nước trực tiếp can thiệp, quản lý giá.", "star": false, "img": null}, {"n": 34, "p": "“다음 달에 쌀 가격이 크게 오를 것”이라는 뉴스가 나왔다. 이번 달 쌀 시장의 변화로 가장 알맞은 것은?", "o": ["수요 증가, 공급 감소 → 가격 상승", "수요 감소, 공급 증가 → 가격 하락", "수요 증가, 공급 증가 → 가격 변화 없음", "수요 감소, 공급 감소 → 거래량 증가"], "a": 0, "e": "Người mua muốn mua ngay trước khi giá lên (cầu tăng); người bán muốn giữ hàng để tháng sau bán giá cao (cung giảm). Cả hai đều đẩy giá tháng này tăng lên.", "star": true, "img": null}, {"n": 35, "p": "다음 상황과 그 결과를 연결한 것으로 옳지 않은 것은?", "o": ["전기차 배터리 가격 하락 → 전기차 공급 곡선 우측 이동", "커피 가격 상승 → 설탕 수요 곡선 좌측 이동", "라면 가격 하락으로 라면 수요량 증가 → 라면 수요 곡선 우측 이동", "망고 농장 수 증가 → 망고 공급 곡선 우측 이동"], "a": 2, "e": "③ sai: giá mì giảm làm lượng cầu mì tăng là <b>di chuyển dọc theo</b> đường cầu, không phải đường cầu dịch phải. (② đúng vì cà phê và đường là hàng bổ sung.)", "star": true, "img": null}, {"n": 36, "p": "어떤 빵의 수요 함수가 Qᴰ = 150 − 4P일 때, 가격이 25원이면 수요량은? (P: 가격(원), Q: 수량(개))", "o": ["25개", "40개", "50개", "75개"], "a": 2, "e": "Thay P = 25: Qᴰ = 150 − 4 × 25 = 150 − 100 = <b>50</b> (cái).", "star": false, "img": null}, {"n": 37, "p": "우산의 공급 함수가 Qˢ = 10 + 3P일 때, 가격이 15원이면 공급량은? (P: 가격(원), Q: 수량(개))", "o": ["45개", "55개", "60개", "65개"], "a": 1, "e": "Thay P = 15: Qˢ = 10 + 3 × 15 = 10 + 45 = <b>55</b> (cái).", "star": false, "img": null}, {"n": 38, "p": "떡볶이 시장의 수요 함수와 공급 함수가 다음과 같을 때, 균형 가격은? (P: 가격(원), Q: 수량(인분))<div class=\"formula\">Qᴰ = 90 − 2P　　Qˢ = 3P − 10</div>", "o": ["10원", "15원", "20원", "25원"], "a": 2, "e": "Cân bằng khi Qᴰ = Qˢ: 90 − 2P = 3P − 10 → 100 = 5P → <b>P = 20</b> (원). (Khi đó Q = 50.)", "star": false, "img": null}, {"n": 39, "p": "볼펜 시장의 수요 함수와 공급 함수가 다음과 같을 때, 균형 거래량은? (P: 가격(원), Q: 수량(개))<div class=\"formula\">Qᴰ = 200 − 5P　　Qˢ = 20 + 4P</div>", "o": ["60개", "80개", "90개", "100개"], "a": 3, "e": "200 − 5P = 20 + 4P → 180 = 9P → P = 20. Thay vào: Q = 200 − 5 × 20 = <b>100</b> (cái).", "star": false, "img": null}, {"n": 40, "p": "생수 시장의 수요 함수와 공급 함수가 다음과 같다. 가격이 10원일 때의 시장 상황으로 옳은 것은? (P: 가격(원), Q: 수량(병))<div class=\"formula\">Qᴰ = 100 − 4P　　Qˢ = 10 + 2P</div>", "o": ["초과 수요 30병", "초과 공급 30병", "초과 수요 20병", "균형 상태"], "a": 0, "e": "Tại P = 10: Qᴰ = 100 − 40 = 60, Qˢ = 10 + 20 = 30 → Qᴰ &gt; Qˢ → <b>dư cầu 30 chai</b>.", "star": false, "img": null}, {"n": 41, "p": "아이스크림 시장의 수요 함수와 공급 함수가 다음과 같다. 가격이 45원일 때의 시장 상황으로 옳은 것은? (P: 가격(원), Q: 수량(개))<div class=\"formula\">Qᴰ = 70 − P　　Qˢ = 2P − 20</div>", "o": ["초과 수요 45개", "초과 공급 25개", "초과 수요 25개", "초과 공급 45개"], "a": 3, "e": "Tại P = 45: Qᴰ = 70 − 45 = 25, Qˢ = 90 − 20 = 70 → Qˢ &gt; Qᴰ → <b>dư cung 70 − 25 = 45 cái</b>.", "star": false, "img": null}, {"n": 42, "p": "다음은 김밥 시장의 가격별 수요량과 공급량이다. 균형 가격과 균형 거래량은?<div class=\"tw\"><table class=\"dt\"><tr><th>가격(원)</th><th>1,000</th><th>1,500</th><th>2,000</th><th>2,500</th><th>3,000</th></tr><tr><th>수요량(줄)</th><td>800</td><td>700</td><td>600</td><td>500</td><td>400</td></tr><tr><th>공급량(줄)</th><td>200</td><td>400</td><td>600</td><td>800</td><td>1,000</td></tr></table></div>", "o": ["1,500원, 700줄", "2,000원, 600줄", "2,000원, 800줄", "2,500원, 500줄"], "a": 1, "e": "Tìm cột có lượng cầu = lượng cung: tại 2.000 원 cả hai đều là 600 → giá cân bằng <b>2.000 원</b>, lượng cân bằng <b>600 cuộn</b>.", "star": false, "img": null}, {"n": 43, "p": "다음은 우유 시장의 가격별 수요량과 공급량이다. 가격이 600원일 때의 시장 상황으로 옳은 것은?<div class=\"tw\"><table class=\"dt\"><tr><th>가격(원)</th><th>400</th><th>600</th><th>800</th><th>1,000</th><th>1,200</th></tr><tr><th>수요량(개)</th><td>1,300</td><td>1,100</td><td>900</td><td>700</td><td>500</td></tr><tr><th>공급량(개)</th><td>100</td><td>300</td><td>500</td><td>700</td><td>900</td></tr></table></div>", "o": ["초과 수요 800개", "초과 공급 800개", "초과 수요 1,100개", "초과 공급 300개"], "a": 0, "e": "Tại 600 원: lượng cầu 1.100, lượng cung 300 → <b>dư cầu 1.100 − 300 = 800</b>.", "star": false, "img": null}, {"n": 44, "p": "[그림]은 귤 시장을 나타낸 것이다. 가격이 80원일 때의 시장 상황과 앞으로의 가격 변화를 바르게 짝지은 것은?", "o": ["초과 수요 40kg – 가격 상승", "초과 공급 40kg – 가격 상승", "초과 공급 40kg – 가격 하락", "초과 공급 60kg – 가격 하락"], "a": 2, "e": "Đọc đồ thị tại giá 80: lượng cầu 20kg, lượng cung 60kg → <b>dư cung 40kg</b> → người bán hạ giá → giá giảm dần về mức cân bằng 60 원.", "star": false, "img": "q44"}, {"n": 45, "p": "영화 티켓이 8,000원일 때 하루 수요량은 500장이었다. 인기 배우가 출연한다는 소식에 모든 가격에서 수요량이 30% 증가했다. 가격이 8,000원일 때 새로운 수요량은?", "o": ["530장", "600장", "630장", "650장"], "a": 3, "e": "Tăng 30%: 500 × 1,3 = 500 + 150 = <b>650</b> (vé).", "star": false, "img": null}, {"n": 46, "p": "자전거 시장의 수요 함수는 Qᴰ = 300 − 2P, 공급 함수는 Qˢ = 3P − 200이다. 건강 열풍으로 모든 가격에서 수요량이 50대씩 늘었다. 가격이 처음 균형 가격에 그대로 머문다면 시장에서 어떤 일이 일어나는가? (P: 가격(만 원), Q: 수량(대))", "o": ["초과 수요 50대가 생겨 가격이 오른다.", "초과 공급 50대가 생겨 가격이 내린다.", "초과 수요 150대가 생겨 가격이 오른다.", "균형 상태이므로 가격은 변하지 않는다."], "a": 0, "e": "Cân bằng ban đầu: 300 − 2P = 3P − 200 → P = 100 (Q = 100). Cầu mới: Qᴰ = 350 − 2P. Tại P = 100: Qᴰ = 150, Qˢ = 100 → <b>dư cầu 50 chiếc</b> → giá tăng.", "star": true, "img": null}, {"n": 47, "p": "[그림]은 텀블러 시장의 수요 곡선이 D₁에서 D₂로 이동한 모습이다. 새로운 균형 가격은?", "o": ["15,000원", "20,000원", "25,000원", "30,000원"], "a": 2, "e": "Đọc đồ thị: D₂ cắt S tại giá 25 (nghìn 원), lượng 60 → <b>25.000 원</b>. Kiểm tra: D₂: Q = 160 − 4P, S: Q = 4P − 40 → 160 − 4P = 4P − 40 → P = 25.", "star": false, "img": "q47"}, {"n": 48, "p": "다음은 사과의 가격별 수요량이다. 이를 수요 함수로 바르게 나타낸 것은?<div class=\"tw\"><table class=\"dt\"><tr><th>가격(원)</th><th>10</th><th>20</th><th>30</th><th>40</th></tr><tr><th>수요량(개)</th><td>160</td><td>120</td><td>80</td><td>40</td></tr></table></div>", "o": ["Qᴰ = 160 − 4P", "Qᴰ = 200 − 4P", "Qᴰ = 200 + 4P", "Qᴰ = 240 − 2P"], "a": 1, "e": "Giá tăng 10 thì lượng cầu giảm 40 → b = −40 ÷ 10 = −4. Thay P = 10, Q = 160: a − 40 = 160 → a = 200 → <b>Qᴰ = 200 − 4P</b>.", "star": false, "img": null}, {"n": 49, "p": "콜라 시장의 수요 함수는 Qᴰ = 60 − P, 공급 함수는 Qˢ = 2P이다. 무더위로 모든 가격에서 수요량이 30개씩 늘었다. 새로운 균형 가격과 균형 거래량은? (P: 가격(원), Q: 수량(개))", "o": ["P = 30원, Q = 60개", "P = 20원, Q = 40개", "P = 30원, Q = 70개", "P = 25원, Q = 65개"], "a": 0, "e": "Cầu mới: Qᴰ = 90 − P. Cân bằng: 90 − P = 2P → 3P = 90 → <b>P = 30, Q = 60</b>. (② là cân bằng cũ trước khi cầu tăng.)", "star": true, "img": null}, {"n": 50, "p": "감자 시장의 수요 함수는 Qᴰ = 140 − 3P, 공급 함수는 Qˢ = 40 + 2P이다. 풍년으로 모든 가격에서 공급량이 25개씩 늘었다. 처음 균형과 비교한 변화로 옳은 것은? (P: 가격(원), Q: 수량(개))", "o": ["가격 5원 상승, 거래량 15개 감소", "가격 5원 하락, 거래량 25개 증가", "가격은 그대로, 거래량 25개 증가", "가격 5원 하락, 거래량 15개 증가"], "a": 3, "e": "Ban đầu: 140 − 3P = 40 + 2P → P = 20, Q = 80. Sau khi cung tăng: Qˢ = 65 + 2P → 140 − 3P = 65 + 2P → P = 15, Q = 95. → <b>Giá giảm 5, lượng tăng 15</b>. (Lượng không tăng đủ 25 vì giá giảm làm lượng cung giảm bớt.)", "star": true, "img": null}]}, {"key": "b2", "tab": "Bài 2. Hành vi người tiêu dùng (소비자 선택)", "mid": "Bài 2. Người tiêu dùng", "short": "Bài 2", "ko": "소비자 선택", "eyebrow": "Bài 2 · Hành vi người tiêu dùng", "qs": [{"n": 1, "p": "소비자가 재화나 서비스를 소비하면서 얻는 만족감을 무엇이라고 하는가?", "o": ["효용", "수요", "예산", "가격"], "a": 0, "e": "Hữu dụng (효용) là mức độ thỏa mãn mà người tiêu dùng nhận được khi tiêu dùng hàng hóa, dịch vụ.", "star": false, "img": null}, {"n": 2, "p": "다음 빈칸에 들어갈 말로 알맞은 것은?<div class=\"quote\">“소비량이 늘어날수록 추가로 얻는 한계 효용이 점차 감소하는 것을 (　　　)이라고 한다.”</div>", "o": ["수요 법칙", "공급 법칙", "한계 효용 체감의 법칙", "효용 극대화의 원칙"], "a": 2, "e": "Tiêu dùng càng nhiều thì phần thỏa mãn tăng thêm (hữu dụng biên) càng giảm → đó là <b>quy luật hữu dụng biên giảm dần</b> (한계 효용 체감의 법칙).", "star": false, "img": null}, {"n": 3, "p": "총효용(TU)에 대한 설명으로 옳은 것은?", "o": ["같은 양을 소비하면 누구나 같은 총효용을 얻는다.", "일정 기간 동안 재화나 서비스를 소비해서 얻는 만족감의 총량이다.", "마지막 한 단위를 소비할 때 추가로 얻는 만족감이다.", "재화의 가격이 높을수록 항상 커진다."], "a": 1, "e": "Tổng hữu dụng là <b>tổng mức thỏa mãn</b> khi tiêu dùng hàng hóa trong một khoảng thời gian. ① sai vì hữu dụng mang tính chủ quan; ③ là định nghĩa của hữu dụng biên; ④ hữu dụng không phụ thuộc vào giá.", "star": false, "img": null}, {"n": 4, "p": "다음 빈칸에 들어갈 말로 알맞은 것은?<div class=\"quote\">“같은 양의 같은 물건이라도 사람에 따라 얻는 만족감이 다를 수 있으므로 총효용은 (　　　) 성격을 가진다.”</div>", "o": ["객관적인", "고정적인", "사회적인", "주관적인"], "a": 3, "e": "Cùng một món hàng, cùng số lượng nhưng mỗi người cảm nhận mức thỏa mãn khác nhau → tổng hữu dụng mang tính <b>chủ quan</b> (주관적).", "star": false, "img": null}, {"n": 5, "p": "경제 용어와 그 뜻을 바르게 연결한 것은?<div class=\"tw\"><table class=\"dt\"><tr><th>용어</th><th>뜻</th></tr><tr><td>가. 총효용</td><td>A. 소득을 모두 사용했을 때 살 수 있는 상품 묶음을 나타낸 선</td></tr><tr><td>나. 한계 효용</td><td>B. 소비를 한 단위 늘릴 때 추가로 얻는 만족도</td></tr><tr><td>다. 예산선</td><td>C. 일정 기간 동안 소비로 얻는 만족감의 총량</td></tr></table></div>", "o": ["가-A, 나-B, 다-C", "가-B, 나-C, 다-A", "가-C, 나-A, 다-B", "가-C, 나-B, 다-A"], "a": 3, "e": "총효용 = tổng mức thỏa mãn (C); 한계 효용 = mức thỏa mãn tăng thêm khi tiêu dùng thêm 1 đơn vị (B); 예산선 = đường biểu thị các giỏ hàng mua được khi tiêu hết thu nhập (A).", "star": false, "img": null}, {"n": 6, "p": "다음 빈칸 (가), (나)에 들어갈 말로 알맞은 것은?<div class=\"quote\">“효용을 측정하는 방법에는 만족도를 (가)해서 표현하는 한계 효용 이론과, 만족도의 (나)를 비교하는 무차별 곡선 이론이 있다.”</div>", "o": ["(가) 수치화 – (나) 순서", "(가) 순서 – (나) 수치화", "(가) 수치화 – (나) 가격", "(가) 가격 – (나) 순서"], "a": 0, "e": "Lý thuyết hữu dụng biên đo mức thỏa mãn bằng <b>con số</b> (수치화). Lý thuyết đường bàng quan chỉ so sánh <b>thứ tự</b> (순서) mức thỏa mãn.", "star": false, "img": null}, {"n": 7, "p": "한계 효용(MU)과 총효용(TU)의 관계로 옳은 것은?", "o": ["MU &gt; 0이면 TU는 감소한다.", "MU = 0이면 TU는 가장 크다(극대).", "MU &lt; 0이면 TU는 증가한다.", "MU를 모두 더해도 TU가 되지 않는다."], "a": 1, "e": "MU &gt; 0 → TU tăng; <b>MU = 0 → TU đạt cực đại</b>; MU &lt; 0 → TU giảm. Cộng tất cả MU lại sẽ được TU.", "star": false, "img": null}, {"n": 8, "p": "한계 효용 체감의 법칙에 따르면 한계 효용 곡선은 일반적으로 어떤 모양인가?", "o": ["오른쪽 위로 올라가는 모양", "가로로 평평한 모양", "오른쪽 아래로 내려가는 모양", "세로로 곧은 모양"], "a": 2, "e": "Tiêu dùng càng nhiều thì MU càng nhỏ → đường hữu dụng biên <b>dốc xuống</b> sang phải.", "star": false, "img": null}, {"n": 9, "p": "다음 빈칸에 들어갈 말로 알맞은 것은?<div class=\"quote\">“무차별 곡선은 소비자에게 (　　　) 만족감을 주는 상품 묶음들을 연결한 곡선이다.”</div>", "o": ["가장 큰", "동일한", "가장 작은", "서로 다른"], "a": 1, "e": "Đường bàng quan nối các giỏ hàng mang lại mức thỏa mãn <b>như nhau</b> (동일한) cho người tiêu dùng.", "star": false, "img": null}, {"n": 10, "p": "무차별 곡선의 특징으로 옳지 않은 것은?", "o": ["원점에서 멀어질수록 소비자의 만족도가 높다.", "흔히 오른쪽 아래로 내려가는 형태를 가진다.", "두 무차별 곡선은 서로 교차할 수 있다.", "같은 곡선 위의 점들은 만족도가 같다."], "a": 2, "e": "③ sai: hai đường bàng quan <b>không bao giờ cắt nhau</b>. Các ý còn lại đều là đặc điểm đúng của đường bàng quan.", "star": false, "img": null}, {"n": 11, "p": "[그림]은 한 소비자의 무차별 곡선이다. 이에 대한 설명으로 옳은 것은?", "o": ["A의 만족도가 가장 높다.", "B가 D보다 만족도가 높다.", "C의 만족도가 가장 낮다.", "B와 D의 만족도는 같다."], "a": 3, "e": "B và D cùng nằm trên U₂ nên mức thỏa mãn bằng nhau. Thứ tự: C (U₃) &gt; B = D (U₂) &gt; A (U₁). Đường càng xa gốc tọa độ thì thỏa mãn càng cao.", "star": false, "img": "c11"}, {"n": 12, "p": "[그림]의 (가), (나)와 같은 무차별 곡선을 가지는 재화의 예를 바르게 짝지은 것은?", "o": ["(가) 1,000원 지폐와 5,000원 지폐 – (나) 왼쪽 장갑과 오른쪽 장갑", "(가) 왼쪽 장갑과 오른쪽 장갑 – (나) 1,000원 지폐와 5,000원 지폐", "(가) 커피와 설탕 – (나) 볼펜과 연필", "(가) 왼쪽 장갑과 오른쪽 장갑 – (나) 왼쪽 운동화와 오른쪽 운동화"], "a": 0, "e": "(가) đường thẳng dốc xuống = <b>hàng thay thế hoàn hảo</b> (vd: tờ 1.000 원 và tờ 5.000 원). (나) hình chữ L = <b>hàng bổ sung hoàn hảo</b> (vd: găng tay trái và găng tay phải).", "star": false, "img": "c12"}, {"n": 13, "p": "주어진 예산과 가격 상황에 맞게 소비자가 구입할 수 있는 재화들의 조합을 무엇이라고 하는가?", "o": ["무차별 곡선", "총효용", "예산 제약", "한계 효용"], "a": 2, "e": "Tập hợp các giỏ hàng người tiêu dùng có thể mua với ngân sách và giá cho trước gọi là <b>ràng buộc ngân sách</b> (예산 제약).", "star": false, "img": null}, {"n": 14, "p": "예산선 식 PₓX + PᵧY = I에서 I가 뜻하는 것은?", "o": ["X재의 가격", "Y재의 수량", "효용", "소득"], "a": 3, "e": "Trong PₓX + PᵧY = I: Pₓ, Pᵧ là giá; X, Y là số lượng; <b>I là thu nhập</b> (Income, 소득).", "star": false, "img": null}, {"n": 15, "p": "소비자의 최적 선택에 대한 설명으로 옳은 것은?", "o": ["예산선 바깥쪽의 점에서 이루어진다.", "가장 낮은 무차별 곡선 위에서 이루어진다.", "예산선과 가장 높은 무차별 곡선이 만나는 접점에서 이루어진다.", "소득과 관계없이 정해진다."], "a": 2, "e": "Lựa chọn tối ưu là <b>điểm tiếp xúc</b> giữa đường ngân sách và đường bàng quan cao nhất có thể đạt tới.", "star": false, "img": null}, {"n": 16, "p": "한계 효용 이론에 대한 설명으로 옳은 것을 〈보기〉에서 모두 고른 것은?<div class=\"box\"><div class=\"box-t\">〈보기〉</div><p>ㄱ. 첫 번째 햄버거보다 두 번째 햄버거에서 얻는 추가 만족감이 더 작다.</p><p>ㄴ. 소비량이 늘면 총효용은 항상 증가한다.</p><p>ㄷ. 한계 효용이 마이너스(−)가 되면 총효용은 감소한다.</p><p>ㄹ. 한계 효용을 모두 더하면 총효용이 된다.</p></div>", "o": ["ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "a": 2, "e": "ㄱ đúng (hữu dụng biên giảm dần), ㄷ đúng, ㄹ đúng. ㄴ sai: khi MU âm thì tổng hữu dụng <b>giảm</b>, nên không phải lúc nào cũng tăng.", "star": true, "img": null}, {"n": 17, "p": "[그림]은 총효용 곡선이다. 옳은 것을 〈보기〉에서 모두 고른 것은?<div class=\"box\"><div class=\"box-t\">〈보기〉</div><p>ㄱ. A점에서 한계 효용은 0보다 크다.</p><p>ㄴ. B점에서 한계 효용은 0이다.</p><p>ㄷ. C점에서 한계 효용은 0보다 크다.</p><p>ㄹ. B점을 지나 소비를 더 늘리면 총효용이 줄어든다.</p></div>", "o": ["ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], "a": 0, "e": "A: TU đang tăng → MU &gt; 0 (ㄱ đúng). B: TU cực đại → MU = 0 (ㄴ đúng). C: TU đang giảm → MU &lt; 0 (ㄷ sai). Qua B mà tiêu dùng thêm thì TU giảm (ㄹ đúng).", "star": true, "img": "c17"}, {"n": 18, "p": "두 무차별 곡선이 서로 교차할 수 없는 이유로 가장 알맞은 것은?", "o": ["소득이 한정되어 있기 때문이다.", "교차하면 만족도가 다른 두 조합이 같은 만족도를 갖게 되어 모순이 생기기 때문이다.", "두 재화의 가격이 서로 다르기 때문이다.", "한계 효용이 항상 0보다 크기 때문이다."], "a": 1, "e": "Nếu hai đường cắt nhau, giao điểm vừa có mức thỏa mãn của đường này vừa của đường kia → hai giỏ hàng có mức thỏa mãn khác nhau lại thành bằng nhau. Đó là <b>mâu thuẫn</b>.", "star": true, "img": null}, {"n": 19, "p": "예산선에 대한 설명으로 옳지 않은 것은?", "o": ["소득을 전부 사용했을 때 살 수 있는 상품 묶음을 나타낸다.", "예산선 위의 모든 점은 드는 돈이 같다.", "예산선 안쪽의 점에서는 소득이 남는다.", "예산선 바깥쪽의 점은 지금 소득으로 살 수 있다."], "a": 3, "e": "④ sai: điểm nằm <b>ngoài</b> đường ngân sách cần nhiều tiền hơn thu nhập nên hiện tại không mua được.", "star": false, "img": null}, {"n": 20, "p": "다음 빈칸 (가), (나)에 들어갈 말로 알맞은 것은? (다른 조건은 같음)<div class=\"quote\">“소득이 늘어나면 예산선은 (가)으로 이동하고, X재의 가격만 오르면 X재를 최대로 살 수 있는 양이 (나).”</div>", "o": ["(가) 바깥쪽 – (나) 줄어든다", "(가) 안쪽 – (나) 줄어든다", "(가) 바깥쪽 – (나) 늘어난다", "(가) 안쪽 – (나) 늘어난다"], "a": 0, "e": "Thu nhập tăng → đường ngân sách dịch song song <b>ra ngoài</b> (바깥쪽). Giá X tăng → lượng X mua tối đa (I/Pₓ) <b>giảm</b>.", "star": true, "img": null}, {"n": 21, "p": "더운 날 운동을 한 후 물을 마셨다. 첫 번째 컵은 아주 시원하고 좋았지만, 다섯 번째 컵은 별로 마시고 싶지 않았다. 이 상황과 가장 관계가 깊은 것은?", "o": ["공급 법칙", "예산 제약", "완전보완재", "한계 효용 체감의 법칙"], "a": 3, "e": "Uống càng nhiều, cốc sau mang lại thỏa mãn tăng thêm ít hơn cốc trước → <b>quy luật hữu dụng biên giảm dần</b>.", "star": false, "img": null}, {"n": 22, "p": "민수는 매운 떡볶이를 아주 좋아하지만, 지영은 매운 음식을 싫어한다. 두 사람이 같은 떡볶이 1인분을 먹었을 때에 대한 설명으로 옳은 것은?", "o": ["두 사람이 얻는 효용은 다를 수 있다.", "두 사람이 얻는 효용은 반드시 같다.", "지영이 얻는 효용이 더 크다.", "떡볶이 가격이 같으므로 효용도 같다."], "a": 0, "e": "Hữu dụng mang tính <b>chủ quan</b>: cùng một suất tteokbokki nhưng người thích cay và người ghét cay nhận được mức thỏa mãn khác nhau.", "star": false, "img": null}, {"n": 23, "p": "무료 피자 행사에서 한 학생이 피자를 먹을 때 얻는 총효용은 다음과 같다. 총효용이 가장 클 때는 몇 조각을 먹었을 때인가?<div class=\"tw\"><table class=\"dt\"><tr><th>피자(조각)</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr><tr><th>총효용</th><td>12</td><td>22</td><td>30</td><td>35</td><td>37</td><td>36</td></tr></table></div>", "o": ["3조각", "4조각", "5조각", "6조각"], "a": 2, "e": "Tổng hữu dụng lớn nhất là <b>37 khi ăn 5 miếng</b>. Miếng thứ 6 có MU = 36 − 37 = −1 nên TU giảm.", "star": false, "img": null}, {"n": 24, "p": "지훈은 커피를 3잔까지는 즐겁게 마시지만, 4번째 잔을 마시면 머리가 아프고 기분이 나빠진다. 4번째 잔의 한계 효용으로 알맞은 것은?", "o": ["0보다 크다.", "0보다 작다.", "0이다.", "총효용과 같다."], "a": 1, "e": "Uống ly thứ 4 làm mức thỏa mãn giảm đi (đau đầu, khó chịu) → <b>MU &lt; 0</b>.", "star": false, "img": null}, {"n": 25, "p": "하린에게 A 회사 생수(X재)와 B 회사 생수(Y재)는 맛과 크기가 완전히 같아서, 어느 것을 마셔도 상관없다. 하린의 무차별 곡선으로 알맞은 것은?", "o": ["IMG:i25a", "IMG:i25b", "IMG:i25c", "IMG:i25d"], "a": 2, "e": "Hai loại nước giống hệt nhau, dùng loại nào cũng được → <b>hàng thay thế hoàn hảo</b> → đường bàng quan là đường thẳng dốc xuống (hình ③).", "star": false, "img": null}, {"n": 26, "p": "텀블러의 몸체(X재)와 뚜껑(Y재)은 항상 1개씩 함께 있어야 사용할 수 있다. 이때의 무차별 곡선으로 알맞은 것은?", "o": ["IMG:i25a", "IMG:i25b", "IMG:i25c", "IMG:i25d"], "a": 0, "e": "Thân và nắp bình luôn phải đi kèm theo tỉ lệ 1:1 → <b>hàng bổ sung hoàn hảo</b> → đường bàng quan hình chữ L (hình ①).", "star": false, "img": null}, {"n": 27, "p": "[그림]에서 점 A(빵 2개, 우유 8개)와 점 B(빵 6개, 우유 3개)는 같은 무차별 곡선 위에 있다. 이 소비자에 대한 설명으로 옳은 것은?", "o": ["A를 B보다 더 좋아한다.", "A와 B를 똑같이 좋아한다.", "B를 A보다 더 좋아한다.", "A와 B는 비교할 수 없다."], "a": 1, "e": "A và B nằm trên <b>cùng một đường bàng quan</b> nên người tiêu dùng thích chúng như nhau.", "star": false, "img": "c27"}, {"n": 28, "p": "[그림]은 한 소비자의 예산선이다. 옳은 것을 〈보기〉에서 모두 고른 것은?<div class=\"box\"><div class=\"box-t\">〈보기〉</div><p>ㄱ. A는 소득이 남는 조합이다.</p><p>ㄴ. B는 소득을 모두 사용하는 조합이다.</p><p>ㄷ. C는 지금 소득으로 살 수 있다.</p><p>ㄹ. 소득이 충분히 늘어나면 C도 살 수 있다.</p></div>", "o": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄹ"], "a": 3, "e": "A nằm trong đường ngân sách → còn dư tiền (ㄱ đúng). B nằm trên đường → tiêu hết thu nhập (ㄴ đúng). C nằm ngoài → hiện chưa mua được (ㄷ sai), nhưng nếu thu nhập tăng đủ thì mua được (ㄹ đúng).", "star": false, "img": "c28"}, {"n": 29, "p": "한 학생이 아르바이트 월급으로 커피와 빵을 산다. 월급이 올랐을 때(커피와 빵의 가격은 그대로) 예산선의 변화로 알맞은 것은?<div class=\"note\">실선: 처음 예산선, 점선: 변화 후 예산선</div>", "o": ["IMG:i29a", "IMG:i29b", "IMG:i29c", "IMG:i29d"], "a": 0, "e": "Lương tăng, giá không đổi → đường ngân sách <b>dịch song song ra ngoài</b> (hình ①).", "star": false, "img": null}, {"n": 30, "p": "한 학생이 용돈으로 커피와 빵을 산다. 빵 가격과 용돈은 그대로이고 커피 가격만 올랐을 때, 예산선의 변화로 알맞은 것은?<div class=\"note\">실선: 처음 예산선, 점선: 변화 후 예산선</div>", "o": ["IMG:i29a", "IMG:i29b", "IMG:i29c", "IMG:i29d"], "a": 2, "e": "Chỉ giá cà phê tăng → lượng cà phê mua tối đa giảm (điểm chặn trên trục cà phê dịch vào trong), còn lượng bánh mì tối đa không đổi → đường ngân sách <b>xoay vào trong</b> quanh điểm trên trục bánh mì (hình ③).", "star": true, "img": null}, {"n": 31, "p": "한 학생이 용돈으로 커피와 빵을 산다. 부모님이 주시는 용돈이 줄었을 때(커피와 빵의 가격은 그대로) 예산선의 변화로 알맞은 것은?<div class=\"note\">실선: 처음 예산선, 점선: 변화 후 예산선</div>", "o": ["IMG:i29a", "IMG:i29b", "IMG:i29c", "IMG:i29d"], "a": 1, "e": "Tiền tiêu vặt giảm, giá không đổi → đường ngân sách <b>dịch song song vào trong</b> (hình ②).", "star": false, "img": null}, {"n": 32, "p": "[그림]에서 이 소비자가 선택할 가장 좋은 점(최적 선택)은?", "o": ["A", "B", "C", "E"], "a": 3, "e": "A nằm trên U₁ thấp hơn; B còn dư tiền; C nằm ngoài đường ngân sách nên không mua được. <b>E là điểm tiếp xúc</b> giữa đường ngân sách và U₂ → lựa chọn tối ưu.", "star": false, "img": "c32"}, {"n": 33, "p": "뷔페 식당에서는 돈을 미리 냈기 때문에 더 먹어도 돈이 들지 않는다. 총효용을 가장 크게 하려면 언제 그만 먹어야 하는가?", "o": ["총효용이 0이 될 때", "한계 효용이 0이 될 때", "한계 효용이 가장 클 때", "첫 번째 접시를 다 먹었을 때"], "a": 1, "e": "Khi MU &gt; 0 thì TU còn tăng; khi <b>MU = 0 thì TU đạt cực đại</b>. Ăn thêm nữa MU &lt; 0 và TU giảm → nên dừng khi MU = 0.", "star": true, "img": null}, {"n": 34, "p": "다음 속담과 가장 관계가 깊은 것은?<div class=\"quote\">“같은 값이면 다홍치마” (같은 가격이면 더 좋은 것을 고른다는 뜻)</div>", "o": ["효용 극대화의 원칙", "한계 효용 체감의 법칙", "완전보완재", "공급 법칙"], "a": 0, "e": "“같은 값이면 다홍치마”: cùng giá thì chọn thứ tốt hơn → chọn phương án mang lại thỏa mãn lớn nhất trong cùng ngân sách = <b>nguyên tắc tối đa hóa hữu dụng</b>.", "star": false, "img": null}, {"n": 35, "p": "다음 상황과 관련 개념을 연결한 것으로 옳지 않은 것은?", "o": ["배가 고플 때 먹는 첫 번째 빵이 가장 맛있다. → 한계 효용 체감의 법칙", "왼쪽 신발만 하나 더 생겨도 만족도가 늘지 않는다. → 완전보완재", "용돈이 줄어서 예전보다 적게 산다. → 예산선이 안쪽으로 이동", "같은 무차별 곡선 위의 두 조합 중 하나를 더 좋아한다. → 무차별 곡선의 특징"], "a": 3, "e": "④ sai: các giỏ hàng trên cùng một đường bàng quan có mức thỏa mãn <b>như nhau</b>, nên không thể thích giỏ này hơn giỏ kia.", "star": true, "img": null}, {"n": 36, "p": "다음은 사과를 먹을 때의 총효용이다. 세 번째 사과의 한계 효용은?<div class=\"tw\"><table class=\"dt\"><tr><th>수량(개)</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><th>총효용</th><td>0</td><td>15</td><td>27</td><td>36</td><td>42</td></tr></table></div>", "o": ["6", "9", "12", "36"], "a": 1, "e": "MU₃ = TU₃ − TU₂ = 36 − 27 = <b>9</b>.", "star": false, "img": null}, {"n": 37, "p": "어떤 소비자가 귤을 먹을 때 한계 효용이 차례대로 20, 16, 12, 8이었다. 귤 4개를 먹었을 때의 총효용은?", "o": ["8", "48", "56", "64"], "a": 2, "e": "TU = tổng các MU = 20 + 16 + 12 + 8 = <b>56</b>.", "star": false, "img": null}, {"n": 38, "p": "다음 표의 빈칸 (가), (나)에 들어갈 숫자로 알맞은 것은?<div class=\"tw\"><table class=\"dt\"><tr><th>수량(개)</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>총효용(TU)</th><td>14</td><td>26</td><td>(가)</td><td>42</td><td>46</td></tr><tr><th>한계 효용(MU)</th><td>14</td><td>12</td><td>9</td><td>(나)</td><td>4</td></tr></table></div>", "o": ["(가) 35 – (나) 7", "(가) 35 – (나) 9", "(가) 33 – (나) 9", "(가) 38 – (나) 4"], "a": 0, "e": "(가) = TU₂ + MU₃ = 26 + 9 = <b>35</b>; (나) = TU₄ − TU₃ = 42 − 35 = <b>7</b>.", "star": false, "img": null}, {"n": 39, "p": "빵을 먹을 때 한계 효용이 다음과 같다. 빵 5개를 먹었을 때의 총효용은?<div class=\"tw\"><table class=\"dt\"><tr><th>수량(개)</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>한계 효용</th><td>9</td><td>6</td><td>3</td><td>0</td><td>−3</td></tr></table></div>", "o": ["12", "15", "18", "21"], "a": 1, "e": "TU = 9 + 6 + 3 + 0 + (−3) = <b>15</b>. Chú ý: quên cộng −3 sẽ ra 18, cộng nhầm thành +3 sẽ ra 21.", "star": false, "img": null}, {"n": 40, "p": "소득이 60,000원이고 떡의 가격은 3,000원, 음료의 가격은 2,000원이다. 소득을 모두 떡을 사는 데 쓴다면 떡을 최대 몇 개 살 수 있는가?", "o": ["20개", "30개", "40개", "60개"], "a": 0, "e": "60.000 ÷ 3.000 = <b>20</b> cái. (30 là số đồ uống mua được nếu chỉ mua đồ uống.)", "star": false, "img": null}, {"n": 41, "p": "소득이 50,000원이고, 공책(X)의 가격은 2,500원, 볼펜(Y)의 가격은 1,000원이다. 예산선 식으로 알맞은 것은?", "o": ["1,000X + 2,500Y = 50,000", "2,500X − 1,000Y = 50,000", "50,000X + 2,500Y = 1,000", "2,500X + 1,000Y = 50,000"], "a": 3, "e": "Dạng PₓX + PᵧY = I → <b>2.500X + 1.000Y = 50.000</b>.", "star": false, "img": null}, {"n": 42, "p": "소득이 30,000원이고, 빵의 가격은 3,000원, 우유의 가격은 1,500원이다. 빵을 4개 사고 남은 돈으로 우유를 최대 몇 개 살 수 있는가?", "o": ["8개", "10개", "12개", "16개"], "a": 2, "e": "Mua 4 bánh mì hết 3.000 × 4 = 12.000 원, còn 18.000 원 → 18.000 ÷ 1.500 = <b>12</b> hộp sữa.", "star": false, "img": null}, {"n": 43, "p": "[그림]은 소득이 90,000원인 소비자의 예산선이다. X재와 Y재의 가격은?", "o": ["X재 6,000원, Y재 3,000원", "X재 3,000원, Y재 6,000원", "X재 3,000원, Y재 3,000원", "X재 2,000원, Y재 6,000원"], "a": 1, "e": "Pₓ = 90.000 ÷ 30 = <b>3.000 원</b>; Pᵧ = 90.000 ÷ 15 = <b>6.000 원</b>.", "star": false, "img": "c43"}, {"n": 44, "p": "소득이 48,000원이고, 도넛(X)의 가격은 2,000원, 주스(Y)의 가격은 3,000원이다. 소득을 남김없이 모두 사용하는 조합 (X, Y)는?", "o": ["(10, 10)", "(15, 5)", "(6, 10)", "(12, 8)"], "a": 3, "e": "2.000 × 12 + 3.000 × 8 = 24.000 + 24.000 = <b>48.000 원</b>. ① tốn 50.000 (vượt), ② 45.000 và ③ 42.000 (còn dư tiền).", "star": false, "img": null}, {"n": 45, "p": "소득이 36,000원이고, X재의 가격은 3,000원, Y재의 가격은 2,000원이다. X재의 가격만 4,000원으로 오르면 어떻게 되는가?", "o": ["X재의 최대 구입량은 3개 줄고, Y재의 최대 구입량은 변하지 않는다.", "X재의 최대 구입량은 3개 줄고, Y재의 최대 구입량도 3개 준다.", "X재의 최대 구입량은 변하지 않고, Y재의 최대 구입량만 준다.", "X재의 최대 구입량은 4개 줄고, Y재의 최대 구입량은 변하지 않는다."], "a": 0, "e": "X tối đa: 36.000 ÷ 3.000 = 12 → 36.000 ÷ 4.000 = 9 (<b>giảm 3</b>). Y tối đa: 36.000 ÷ 2.000 = 18, <b>không đổi</b>.", "star": true, "img": null}, {"n": 46, "p": "수진은 커피 1잔에 항상 설탕 2봉지를 넣어서 마신다(완전보완재). 수진에게 커피 4잔과 설탕 6봉지가 있다면, 만족을 얻으며 마실 수 있는 커피는 최대 몇 잔인가?", "o": ["2잔", "3잔", "4잔", "6잔"], "a": 1, "e": "Mỗi ly cần 2 gói đường: 6 gói chỉ đủ cho <b>3 ly</b>. Ly cà phê thứ 4 không có đường nên không làm tăng thỏa mãn.", "star": true, "img": null}, {"n": 47, "p": "어떤 사람에게 5,000원 지폐 2장과 10,000원 지폐 1장은 만족도가 같다(완전대체재). 이 사람이 5,000원 지폐 6장과 10,000원 지폐 2장을 가지고 있을 때와 같은 만족도를 10,000원 지폐만으로 얻으려면 몇 장이 필요한가?", "o": ["2장", "3장", "4장", "5장"], "a": 3, "e": "6 tờ 5.000 원 = 3 tờ 10.000 원 → tổng cộng 3 + 2 = <b>5 tờ</b> 10.000 원.", "star": false, "img": null}, {"n": 48, "p": "소득이 12,000원이고, 김밥의 가격은 3,000원, 음료의 가격은 1,500원이다. 각 조합의 효용이 다음과 같을 때, 이 소비자의 최적 선택은?<div class=\"tw\"><table class=\"dt\"><tr><th>조합</th><th>가</th><th>나</th><th>다</th><th>라</th></tr><tr><th>김밥(줄)</th><td>2</td><td>4</td><td>3</td><td>1</td></tr><tr><th>음료(개)</th><td>4</td><td>2</td><td>2</td><td>4</td></tr><tr><th>효용</th><td>50</td><td>65</td><td>58</td><td>40</td></tr></table></div>", "o": ["가", "나", "다", "라"], "a": 2, "e": "Chi phí: 가 12.000, 나 15.000 (vượt ngân sách → không mua được), 다 12.000, 라 9.000. Trong các tổ hợp mua được, <b>다 có hữu dụng cao nhất (58)</b>.", "star": true, "img": null}, {"n": 49, "p": "[그림]은 아이스크림을 먹을 때의 한계 효용이다. 4개를 먹었을 때의 총효용은?", "o": ["14", "16", "18", "20"], "a": 3, "e": "TU = tổng MU = 8 + 6 + 4 + 2 = <b>20</b>.", "star": false, "img": "c49"}, {"n": 50, "p": "[그림]은 과자를 먹을 때의 총효용이다. 한계 효용이 0이 되는 것은 몇 번째 과자인가?", "o": ["3번째", "4번째", "5번째", "6번째"], "a": 2, "e": "MU lần lượt là 12, 9, 6, 3, 0, −2. Ở <b>bánh thứ 5</b>, TU từ 30 → 30 không đổi → MU = 0.", "star": false, "img": "c50"}]}, {"key": "b3", "tab": "Bài 3. Thị trường", "mid": "Bài 3. Thị trường", "short": "Bài 3", "ko": "시장과 경제", "eyebrow": "Bài 3 · Thị trường", "qs": [{"n": 1, "p": "다음 빈칸에 들어갈 말로 알맞은 것은?<div class=\"quote\">“경제학에서 시장은 수요와 공급이 만나 거래가 이루어지는 (　　　)를 의미한다.”</div>", "o": ["건물", "기구", "회사", "정부"], "a": 1, "e": "Trong kinh tế học, thị trường không chỉ là một địa điểm mà là <b>cơ chế</b> (기구) nơi cung và cầu gặp nhau để giao dịch diễn ra.", "star": false, "img": null}, {"n": 2, "p": "시장을 나누는 기준과 그 예를 바르게 연결한 것은?<div class=\"tw\"><table class=\"dt\"><tr><th>기준</th><th>예</th></tr><tr><td>가. 상품</td><td>A. 온라인 시장, 오프라인 시장</td></tr><tr><td>나. 인터넷 이용 여부</td><td>B. 완전 경쟁 시장, 불완전 경쟁 시장</td></tr><tr><td>다. 경쟁의 강도(공급자의 수)</td><td>C. 곡물 시장, 증권 시장, 노동 시장</td></tr></table></div>", "o": ["가-A, 나-B, 다-C", "가-B, 나-C, 다-A", "가-C, 나-A, 다-B", "가-C, 나-B, 다-A"], "a": 2, "e": "Theo hàng hóa → thị trường ngũ cốc, chứng khoán, lao động (C). Theo việc dùng internet → thị trường online/offline (A). Theo mức độ cạnh tranh → cạnh tranh hoàn hảo/không hoàn hảo (B).", "star": false, "img": null}, {"n": 3, "p": "다음 중 ‘상품’을 기준으로 나눈 시장이 아닌 것은?", "o": ["곡물 시장", "증권 시장", "노동 시장", "온라인 시장"], "a": 3, "e": "Thị trường online được phân loại theo <b>việc có dùng internet hay không</b>, không phải theo hàng hóa.", "star": false, "img": null}, {"n": 4, "p": "다음 빈칸에 들어갈 말로 알맞은 것은?<div class=\"quote\">“완전 경쟁 시장이란 다수의 (　　　)와 공급자가 모여 거래가 이루어지는 시장을 말한다.”</div>", "o": ["정부", "생산자", "수요자", "독점 기업"], "a": 2, "e": "Thị trường cạnh tranh hoàn hảo là nơi có rất nhiều <b>người mua</b> (수요자) và người bán cùng giao dịch.", "star": false, "img": null}, {"n": 5, "p": "완전 경쟁 시장의 특성이 아닌 것은?", "o": ["다수의 수요자와 공급자", "상품의 동질성", "높은 진입 장벽", "정보의 공유"], "a": 2, "e": "Thị trường cạnh tranh hoàn hảo cho phép gia nhập và rút lui tự do. <b>Rào cản gia nhập cao</b> là đặc điểm của thị trường độc quyền.", "star": false, "img": null}, {"n": 6, "p": "다음 빈칸에 들어갈 말로 알맞은 것은?<div class=\"quote\">“완전 경쟁 시장의 개별 기업은 시장 가격에 아무런 영향을 미치지 못하므로, 시장에서 결정된 가격을 (　　　).”</div>", "o": ["받아들여야 한다", "마음대로 정한다", "크게 올린다", "정부에 신고한다"], "a": 0, "e": "Doanh nghiệp cạnh tranh hoàn hảo không ảnh hưởng được giá thị trường nên phải <b>chấp nhận giá</b> (người chấp nhận giá – price taker).", "star": false, "img": null}, {"n": 7, "p": "완전 경쟁 시장에서 개별 기업의 수요 곡선으로 알맞은 것은?", "o": ["IMG:d3a", "IMG:d3b", "IMG:d3c", "IMG:d3d"], "a": 1, "e": "Doanh nghiệp bán được bao nhiêu tùy ý ở đúng mức giá thị trường → đường cầu của từng doanh nghiệp là <b>đường nằm ngang</b> tại mức giá đó (hình ②).", "star": false, "img": null}, {"n": 8, "p": "완전 경쟁 시장의 ‘상품의 동질성’에 대한 설명으로 옳은 것은?", "o": ["상품마다 품질과 디자인이 모두 다르다.", "시장에서 거래되는 상품의 질이나 모양이 모두 같아 서로 대체할 수 있다.", "한 기업만 그 상품을 만들 수 있다.", "상품의 가격을 정부가 정한다."], "a": 1, "e": "“Tính đồng nhất của hàng hóa”: chất lượng, hình dáng sản phẩm đều như nhau nên có thể <b>thay thế cho nhau</b> hoàn toàn.", "star": false, "img": null}, {"n": 9, "p": "다음 빈칸에 들어갈 말로 알맞은 것은?<div class=\"quote\">“완전 경쟁 시장에서는 시장 참여자들이 가격, 제품의 질 등에 대한 충분하고 완전한 (　　　)를 가져야 한다.”</div>", "o": ["정보", "특허", "자본", "기술력"], "a": 0, "e": "Đây là đặc điểm “<b>chia sẻ thông tin</b>” (정보의 공유): người tham gia có thông tin đầy đủ về giá, chất lượng sản phẩm.", "star": false, "img": null}, {"n": 10, "p": "불완전 경쟁 시장에 대한 설명으로 옳은 것은?", "o": ["수요자와 공급자가 셀 수 없이 많은 시장이다.", "시장 참여자의 수가 제한되거나 상품이 동질적이지 않은 시장이다.", "모든 기업이 시장 가격을 그대로 받아들이는 시장이다.", "누구나 자유롭게 들어오고 나갈 수 있으며 상품이 모두 같은 시장이다."], "a": 1, "e": "Thị trường cạnh tranh không hoàn hảo: số người tham gia bị hạn chế hoặc sản phẩm không đồng nhất. ①③④ đều mô tả thị trường cạnh tranh hoàn hảo.", "star": false, "img": null}, {"n": 11, "p": "다음 중 불완전 경쟁 시장에 속하지 않는 것은?", "o": ["독점 시장", "과점 시장", "독점적 경쟁 시장", "완전 경쟁 시장"], "a": 3, "e": "Thị trường cạnh tranh không hoàn hảo gồm: độc quyền (독점), độc quyền nhóm (과점), cạnh tranh độc quyền (독점적 경쟁). Cạnh tranh hoàn hảo không thuộc nhóm này.", "star": false, "img": null}, {"n": 12, "p": "[그림]의 (가)~(다)와 가장 관계가 깊은 시장을 바르게 연결한 것은? (그림 속 사람: 공급자)", "o": ["(가) 독점 – (나) 과점 – (다) 독점적 경쟁", "(가) 과점 – (나) 독점 – (다) 독점적 경쟁", "(가) 독점 – (나) 독점적 경쟁 – (다) 과점", "(가) 독점적 경쟁 – (나) 과점 – (다) 독점"], "a": 0, "e": "1 người bán = độc quyền (가); vài người bán = độc quyền nhóm (나); rất nhiều người bán = cạnh tranh độc quyền (다).", "star": false, "img": "f3_12"}, {"n": 13, "p": "독점 시장의 특성으로 알맞은 것을 〈보기〉에서 모두 고른 것은?<div class=\"box\"><div class=\"box-t\">〈보기〉</div><p>ㄱ. 특허나 뛰어난 기술력을 가지고 있다.</p><p>ㄴ. 새로운 기업이 쉽게 시장에 들어올 수 있다.</p><p>ㄷ. 가격을 설정하거나 조정하는 힘이 있다.</p><p>ㄹ. 공급자가 단 1명이다.</p></div>", "o": ["ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "a": 2, "e": "Độc quyền: có bằng sáng chế/công nghệ vượt trội (ㄱ), có sức mạnh định giá (ㄷ), chỉ có 1 người bán (ㄹ). ㄴ sai vì rào cản gia nhập thị trường độc quyền rất cao.", "star": false, "img": null}, {"n": 14, "p": "다음 빈칸에 들어갈 말로 알맞은 것은?<div class=\"quote\">“과점 기업의 수요 곡선은 한 점에서 꺾인 모양이어서 (　　　) 수요 곡선이라고 한다.”</div>", "o": ["수평", "굴절", "수직", "우상향"], "a": 1, "e": "Đường cầu của doanh nghiệp độc quyền nhóm bị gãy tại một điểm → gọi là <b>đường cầu gãy</b> (굴절 수요 곡선, kinked demand curve).", "star": false, "img": null}, {"n": 15, "p": "과점 시장에 대한 설명으로 옳지 않은 것은?", "o": ["상품의 공급자가 소수이다.", "기업들이 시장 가격에 상당한 영향력을 가진다.", "기업들 사이의 상호의존성이 높다.", "다른 기업의 반응을 신경 쓰지 않고 마음대로 가격을 내린다."], "a": 3, "e": "④ sai: các doanh nghiệp độc quyền nhóm phụ thuộc lẫn nhau rất nhiều nên luôn phải tính đến phản ứng của đối thủ, ngại tự ý hạ giá hay tăng sản lượng.", "star": false, "img": null}, {"n": 16, "p": "독점적 경쟁 시장의 특성으로 알맞은 것을 〈보기〉에서 모두 고른 것은?<div class=\"box\"><div class=\"box-t\">〈보기〉</div><p>ㄱ. 다수의 공급자가 있다.</p><p>ㄴ. 기업마다 제품을 차별화한다.</p><p>ㄷ. 시장에 들어오거나 나가기가 매우 어렵다.</p><p>ㄹ. 광고, 서비스 등 비가격 경쟁을 한다.</p></div>", "o": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], "a": 1, "e": "Cạnh tranh độc quyền: nhiều người bán (ㄱ), sản phẩm khác biệt (ㄴ), cạnh tranh phi giá như quảng cáo, dịch vụ (ㄹ). ㄷ sai vì việc gia nhập và rút lui là tự do.", "star": true, "img": null}, {"n": 17, "p": "다음은 시장의 종류를 비교한 표이다. ㉠~㉣ 중 옳지 않은 것은?<div class=\"tw\"><table class=\"dt\"><tr><th>구분</th><th>완전 경쟁</th><th>독점</th><th>과점</th><th>독점적 경쟁</th></tr><tr><th>공급자 수</th><td>㉠ 다수</td><td>1명</td><td>㉡ 소수</td><td>다수</td></tr><tr><th>상품</th><td>동질적</td><td>대체재가 거의 없음</td><td>동질적 또는 차별화</td><td>차별화</td></tr><tr><th>가격 결정력</th><td>㉢ 없음</td><td>큼</td><td>상당함</td><td>㉣ 매우 큼</td></tr></table></div>", "o": ["㉠", "㉡", "㉢", "㉣"], "a": 3, "e": "Sai ở ㉣: doanh nghiệp cạnh tranh độc quyền chỉ có sức mạnh định giá <b>hạn chế</b>, không phải “rất lớn”.", "star": true, "img": null}, {"n": 18, "p": "다음 빈칸 (가), (나)에 들어갈 말로 알맞은 것은?<div class=\"quote\">“독점 기업이 가격을 올려도 필수재는 수요량이 (가) 줄어들지만, 사치재는 수요량이 (나) 줄어든다.”</div>", "o": ["(가) 조금 – (나) 많이", "(가) 많이 – (나) 조금", "(가) 많이 – (나) 많이", "(가) 조금 – (나) 조금"], "a": 0, "e": "Hàng thiết yếu thì dù giá tăng vẫn phải mua nên lượng cầu giảm <b>ít</b> (đường cầu dốc). Hàng xa xỉ không mua cũng được nên lượng cầu giảm <b>nhiều</b>.", "star": true, "img": null}, {"n": 19, "p": "독점적 경쟁 시장에서 볼 수 있는 ‘비가격 경쟁’의 예로 알맞지 않은 것은?", "o": ["TV 광고를 한다.", "포장 디자인을 바꾼다.", "배달 서비스를 시작한다.", "가격을 경쟁 기업보다 낮춘다."], "a": 3, "e": "Hạ giá thấp hơn đối thủ là <b>cạnh tranh bằng giá</b>, không phải cạnh tranh phi giá.", "star": false, "img": null}, {"n": 20, "p": "완전 경쟁 시장에서 개별 기업의 수요 곡선이 수평인 이유로 가장 알맞은 것은?", "o": ["기업의 가격 결정력이 크기 때문이다.", "상품이 모두 같고 정보가 공유되어, 조금만 비싸게 팔아도 소비자들이 다른 기업으로 가기 때문이다.", "정부가 모든 상품의 가격을 정하기 때문이다.", "공급자가 1명뿐이기 때문이다."], "a": 1, "e": "Hàng đồng nhất + thông tin minh bạch + nhiều người bán → chỉ cần bán đắt hơn giá thị trường một chút là khách chuyển sang nơi khác (lượng bán = 0). Vì vậy đường cầu nằm ngang.", "star": true, "img": null}, {"n": 21, "p": "하노이의 큰 시장에는 채소를 파는 상인이 셀 수 없이 많고, 채소의 품질도 거의 같다. 이 시장과 가장 가까운 것은?", "o": ["완전 경쟁 시장", "독점 시장", "과점 시장", "독점적 경쟁 시장"], "a": 0, "e": "Rất nhiều người bán + hàng hóa gần như đồng nhất → gần với <b>cạnh tranh hoàn hảo</b>.", "star": false, "img": null}, {"n": 22, "p": "어떤 나라에서는 전기를 공급하는 회사가 국가 회사 하나뿐이다. 이 시장은?", "o": ["완전 경쟁 시장", "과점 시장", "독점 시장", "독점적 경쟁 시장"], "a": 2, "e": "Chỉ có 1 người bán → <b>độc quyền</b>.", "star": false, "img": null}, {"n": 23, "p": "어떤 나라의 이동 통신 서비스는 3개의 큰 회사가 거의 모두 제공한다. 이 시장에 대한 설명으로 옳은 것은?", "o": ["완전 경쟁 시장이므로 각 회사는 가격에 영향을 줄 수 없다.", "독점 시장이므로 한 회사가 가격을 마음대로 정한다.", "과점 시장이므로 각 회사는 다른 회사의 행동을 신경 쓴다.", "독점적 경쟁 시장이므로 진입과 탈퇴가 자유롭다."], "a": 2, "e": "Vài công ty lớn → <b>độc quyền nhóm</b>. Các công ty phụ thuộc lẫn nhau nên luôn để ý hành động của nhau.", "star": false, "img": null}, {"n": 24, "p": "우리 동네에는 미용실이 아주 많은데, 미용실마다 분위기, 스타일, 서비스가 조금씩 다르다. 이 시장은?", "o": ["완전 경쟁 시장", "독점 시장", "과점 시장", "독점적 경쟁 시장"], "a": 3, "e": "Nhiều người bán + dịch vụ khác biệt (không khí, kiểu tóc, phục vụ) → <b>cạnh tranh độc quyền</b>.", "star": false, "img": null}, {"n": 25, "p": "소고기 시장은 완전 경쟁 시장이고, 시장 가격은 1kg당 28만 동이다. 판매자 A씨가 혼자서 가격을 35만 동으로 올리면 어떤 일이 일어나는가?", "o": ["손님들이 다른 가게로 가서 A씨는 소고기를 거의 팔지 못한다.", "A씨의 수입이 크게 늘어난다.", "시장 전체의 소고기 가격이 35만 동으로 오른다.", "손님들은 A씨의 소고기를 더 많이 사려고 한다."], "a": 0, "e": "Hàng đồng nhất, thông tin minh bạch → khách sẽ sang cửa hàng khác bán giá 28만 동, A gần như không bán được.", "star": false, "img": null}, {"n": 26, "p": "외환 시장이 완전 경쟁 시장에 가까운 이유로 가장 알맞은 것은?", "o": ["외환을 파는 사람이 한 명뿐이기 때문이다.", "돈(화폐)은 어디에서 사도 같은 상품이고, 참여자가 많으며 환율 정보가 공개되어 있기 때문이다.", "정부가 외환 시장에 들어가는 것을 막기 때문이다.", "은행마다 파는 달러의 디자인이 다르기 때문이다."], "a": 1, "e": "Tiền tệ mua ở đâu cũng như nhau (hàng đồng nhất), người tham gia đông, thông tin tỷ giá công khai → gần với cạnh tranh hoàn hảo.", "star": false, "img": null}, {"n": 27, "p": "다이아몬드 시장이 완전 경쟁 시장이 아닌 이유로 가장 알맞은 것은?", "o": ["다이아몬드는 크기와 품질이 모두 달라 상품이 동질적이지 않고, 공급자도 소수이기 때문이다.", "다이아몬드를 사려는 사람이 너무 많기 때문이다.", "다이아몬드는 가격이 싸기 때문이다.", "다이아몬드에 대한 정보가 모두 공개되어 있기 때문이다."], "a": 0, "e": "Kim cương khác nhau về kích thước và chất lượng (không đồng nhất), nguồn cung lại tập trung vào vài công ty → không phải cạnh tranh hoàn hảo.", "star": false, "img": null}, {"n": 28, "p": "닭고기 가격이 올라 이익이 많아지자, 새로운 양계 농가들이 쉽게 시장에 들어왔다. 이와 관계가 깊은 완전 경쟁 시장의 특성은?", "o": ["자유로운 진입과 탈퇴", "다수의 수요자와 공급자", "상품의 동질성", "정보의 공유"], "a": 0, "e": "Doanh nghiệp mới dễ dàng tham gia thị trường = đặc điểm <b>gia nhập và rút lui tự do</b>.", "star": false, "img": null}, {"n": 29, "p": "한 회사가 어떤 도시의 수돗물을 혼자 공급한다(독점). 수돗물은 생활 필수재이다. 이 회사의 수요 곡선으로 가장 알맞은 것은?", "o": ["IMG:d3c", "IMG:d3d", "IMG:d3b", "IMG:d3a"], "a": 0, "e": "Độc quyền + hàng thiết yếu → giá tăng thì lượng cầu chỉ giảm chút ít → đường cầu dốc xuống và <b>rất dốc</b> (hình ①).", "star": false, "img": null}, {"n": 30, "p": "자동차 시장에는 큰 회사가 몇 개만 있다. A 자동차 회사의 수요 곡선으로 가장 알맞은 것은?", "o": ["IMG:d3b", "IMG:d3a", "IMG:d3c", "IMG:d3d"], "a": 3, "e": "Thị trường chỉ có vài công ty lớn = độc quyền nhóm → <b>đường cầu gãy</b> (hình ④).", "star": false, "img": null}, {"n": 31, "p": "밀크티 가게는 아주 많지만 가게마다 맛과 브랜드가 다르다. 한 밀크티 가게의 수요 곡선으로 가장 알맞은 것은?", "o": ["IMG:d3d", "IMG:d3c", "IMG:d3a", "IMG:d3b"], "a": 2, "e": "Cạnh tranh độc quyền → sức mạnh định giá hạn chế → đường cầu dốc xuống <b>thoải</b>, nhưng không nằm ngang (hình ③).", "star": false, "img": null}, {"n": 32, "p": "석유 회사 A가 가격을 내리면 경쟁 회사들도 따라서 내리고, 가격을 올리면 경쟁 회사들은 따라 올리지 않는다. 그 결과로 가장 알맞은 것은?", "o": ["A는 가격을 자주 올린다.", "A는 가격을 자주 내린다.", "A는 가격을 잘 바꾸지 않는다.", "A는 시장에서 바로 탈퇴한다."], "a": 2, "e": "Tăng giá thì mất nhiều khách (đối thủ không tăng theo); hạ giá thì đối thủ hạ theo nên khách không tăng bao nhiêu → A <b>ngại thay đổi giá</b> (đường cầu gãy).", "star": true, "img": null}, {"n": 33, "p": "한 밀크티 브랜드가 가격을 5,000동 올렸는데도 손님들이 계속 찾아온다. 그 이유로 가장 알맞은 것은?", "o": ["밀크티 시장이 완전 경쟁 시장이기 때문이다.", "이 브랜드만의 맛과 이미지가 있어 다른 가게와 차별화되었기 때문이다.", "밀크티를 파는 가게가 한 곳뿐이기 때문이다.", "정부가 밀크티 가격을 정했기 때문이다."], "a": 1, "e": "Sản phẩm được <b>khác biệt hóa</b> (hương vị, hình ảnh thương hiệu riêng) → doanh nghiệp cạnh tranh độc quyền có sức mạnh định giá ở mức độ nhất định.", "star": false, "img": null}, {"n": 34, "p": "전기나 수도 같은 산업을 국가가 독점하는 경우가 많은 이유로 가장 알맞은 것은?", "o": ["국가가 많은 이윤을 얻기 위해서이다.", "소비자들이 이 상품을 좋아하지 않기 때문이다.", "이 상품들은 수요가 거의 없기 때문이다.", "큰 설비가 필요하고, 국민 생활에 꼭 필요해 안정적으로 공급해야 하기 때문이다."], "a": 3, "e": "Cần đầu tư thiết bị rất lớn và là hàng thiết yếu → phải cung cấp ổn định với giá hợp lý, nên thường do Nhà nước độc quyền.", "star": true, "img": null}, {"n": 35, "p": "다음 사례와 시장의 종류를 연결한 것으로 옳지 않은 것은?", "o": ["수많은 농가가 같은 품질의 쌀을 판다. → 완전 경쟁 시장", "도시에 지하철 운영 회사가 하나뿐이다. → 독점 시장", "스마트폰 운영 체제를 2~3개 회사가 만든다. → 과점 시장", "수많은 카페가 각자 다른 메뉴와 분위기로 경쟁한다. → 완전 경쟁 시장"], "a": 3, "e": "④ sai: quán cà phê tuy nhiều nhưng sản phẩm khác biệt → <b>cạnh tranh độc quyền</b>, không phải cạnh tranh hoàn hảo.", "star": true, "img": null}, {"n": 36, "p": "완전 경쟁 시장인 쌀 시장의 가격이 1kg당 20,000동이다. 농부 A가 쌀 500kg을 모두 팔았다면 판매 수입은?", "o": ["1,000,000동", "5,000,000동", "10,000,000동", "20,000,000동"], "a": 2, "e": "20.000 × 500 = <b>10.000.000 đồng</b>.", "star": false, "img": null}, {"n": 37, "p": "완전 경쟁 시장에서 빵의 시장 가격은 25,000동이고, 가게 A는 하루에 빵을 100개 판다. A만 가격을 30,000동으로 올리면 A의 하루 판매 수입은 얼마가 되겠는가?", "o": ["0동", "2,500,000동", "3,000,000동", "5,500,000동"], "a": 0, "e": "Trong cạnh tranh hoàn hảo, bán đắt hơn giá thị trường thì khách sang cửa hàng khác hết → lượng bán = 0 → doanh thu <b>0 đồng</b>.", "star": false, "img": null}, {"n": 38, "p": "완전 경쟁 시장인 달걀 시장의 수요 함수와 공급 함수가 다음과 같다. 개별 농가 B가 시장 가격으로 달걀 50판을 판다면 판매 수입은? (P: 가격(천 동), Q: 수량(판))<div class=\"formula\">Qᴰ = 200 − 4P　　Qˢ = 6P − 100</div>", "o": ["1,000,000동", "1,500,000동", "2,000,000동", "4,000,000동"], "a": 1, "e": "Giá thị trường: 200 − 4P = 6P − 100 → P = 30 (nghìn đồng) = 30.000 đồng → 30.000 × 50 = <b>1.500.000 đồng</b>.", "star": true, "img": null}, {"n": 39, "p": "[그림]은 완전 경쟁 시장에서 한 기업의 수요 곡선이다. 이 기업이 상품 200개를 팔면 판매 수입은?", "o": ["15,000동", "215,000동", "300,000동", "3,000,000동"], "a": 3, "e": "Giá 15 nghìn đồng = 15.000 đồng → 15.000 × 200 = <b>3.000.000 đồng</b>.", "star": false, "img": "f3_39"}, {"n": 40, "p": "어떤 나라의 스마트폰 시장 전체 판매량은 2,000만 대이고, A사의 시장 점유율은 40%이다. A사의 판매량은?", "o": ["40만 대", "80만 대", "400만 대", "800만 대"], "a": 3, "e": "2.000만 대 × 40% = <b>800만 대</b> (8 triệu chiếc).", "star": false, "img": null}, {"n": 41, "p": "[그림]의 시장에는 A사, B사, C사 3개 회사만 있다. C사의 점유율과 이 시장의 종류를 바르게 짝지은 것은?", "o": ["25% – 과점 시장", "25% – 독점 시장", "35% – 과점 시장", "35% – 완전 경쟁 시장"], "a": 0, "e": "C: 100 − 45 − 30 = <b>25%</b>. Thị trường chỉ có 3 công ty → <b>độc quyền nhóm</b> (과점).", "star": false, "img": "f3_41"}, {"n": 42, "p": "전기를 독점 공급하는 회사가 전기 요금을 1kWh당 2,000동에서 2,500동으로 올렸다. 전기는 필수재여서 한 가구의 한 달 사용량은 300kWh에서 290kWh로 조금만 줄었다. 이 가구의 새 한 달 전기 요금은?", "o": ["580,000동", "600,000동", "725,000동", "750,000동"], "a": 2, "e": "2.500 × 290 = <b>725.000 đồng</b>.", "star": false, "img": null}, {"n": 43, "p": "[그림]은 과점 시장에 있는 통신 회사 A의 수요 곡선이다. A가 요금을 10만 동에서 11만 동으로 올렸지만 경쟁 회사들은 따라 올리지 않았다. A의 수입은 어떻게 변하는가?", "o": ["1,000만 동 증가", "400만 동 감소", "3,400만 동 감소", "6,600만 동 감소"], "a": 2, "e": "Trước: 10만 × 1.000 người = 1억 동. Sau: 11만 × 600 người = 6.600만 동 → <b>giảm 3.400만 동</b>.", "star": true, "img": "f3_43"}, {"n": 44, "p": "한 밀크티 가게가 가격을 30,000동에서 35,000동으로 올렸더니, 하루 판매량이 200잔에서 180잔으로 줄었다. 하루 판매 수입의 변화는?", "o": ["300,000동 증가", "300,000동 감소", "1,000,000동 증가", "변화 없음"], "a": 0, "e": "Trước: 30.000 × 200 = 6.000.000; sau: 35.000 × 180 = 6.300.000 → <b>tăng 300.000 đồng</b>.", "star": false, "img": null}, {"n": 45, "p": "소고기의 시장 가격은 1kg당 28만 동이다. 판매자 A씨가 35만 동에 팔려고 한다면, A씨의 가격은 시장 가격보다 몇 % 비싼가?", "o": ["7%", "20%", "25%", "35%"], "a": 2, "e": "(35 − 28) ÷ 28 = 7 ÷ 28 = <b>25%</b>.", "star": false, "img": null}, {"n": 46, "p": "한 독점 기업이 두 상품의 가격을 모두 100천 동에서 110천 동으로 올렸다. 그 결과로 옳은 것은?<div class=\"tw\"><table class=\"dt\"><tr><th>상품</th><th>가격 인상 전 판매량</th><th>가격 인상 후 판매량</th></tr><tr><th>가 (필수재)</th><td>1,000개</td><td>980개</td></tr><tr><th>나 (사치재)</th><td>1,000개</td><td>700개</td></tr></table></div>", "o": ["가의 수입은 늘고, 나의 수입은 준다.", "가의 수입은 줄고, 나의 수입은 는다.", "가와 나의 수입이 모두 는다.", "가와 나의 수입이 모두 준다."], "a": 0, "e": "Hàng 가: 100 × 1.000 = 100.000 → 110 × 980 = 107.800 (nghìn đồng) → <b>tăng</b>. Hàng 나: 100.000 → 110 × 700 = 77.000 → <b>giảm</b>.", "star": true, "img": null}, {"n": 47, "p": "완전 경쟁 시장에 기업 100개가 있고, 각 기업은 상품을 50개씩 생산한다. 새로운 기업 20개가 들어와 똑같이 50개씩 생산하면 시장 전체 공급량은?", "o": ["5,000개", "5,020개", "5,500개", "6,000개"], "a": 3, "e": "(100 + 20) × 50 = <b>6.000</b> sản phẩm.", "star": false, "img": null}, {"n": 48, "p": "완전 경쟁 시장에 기업 120개가 있고, 각 기업은 30개씩 생산한다. 손해가 나서 기업의 20%가 시장에서 탈퇴하면 시장 전체 공급량은?", "o": ["720개", "2,880개", "3,000개", "3,600개"], "a": 1, "e": "Còn lại 120 × 80% = 96 doanh nghiệp → 96 × 30 = <b>2.880</b>.", "star": false, "img": null}, {"n": 49, "p": "외환 시장에서 1달러는 25,000동이다. 400달러를 동으로 바꾸면 얼마인가?", "o": ["1,000,000동", "2,500,000동", "4,000,000동", "10,000,000동"], "a": 3, "e": "25.000 × 400 = <b>10.000.000 đồng</b>.", "star": false, "img": null}, {"n": 50, "p": "한 옷 가게의 1년 매출은 5억 동이다. 이 중 60%가 온라인 시장에서 판매되었다면 오프라인 시장의 매출은?", "o": ["1억 동", "2억 동", "3억 동", "5억 동"], "a": 1, "e": "Offline chiếm 100% − 60% = 40% → 5억 × 40% = <b>2억 동</b> (200 triệu đồng).", "star": false, "img": null}]}, {"key": "b4", "tab": "Bài 4. Hành vi người sản xuất", "mid": "Bài 4. Người sản xuất", "short": "Bài 4", "ko": "소득과 분배", "eyebrow": "Bài 4 · Hành vi người sản xuất", "qs": [{"n": 1, "p": "경제학에서 어떤 것을 만들기 위해 필요한 것들을 무엇이라고 하는가?", "o": ["생산 요소", "생산 함수", "한계 생산", "임금"], "a": 0, "e": "Những thứ cần thiết để sản xuất ra sản phẩm gọi là <b>yếu tố sản xuất</b> (생산 요소).", "star": false, "img": null}, {"n": 2, "p": "다음 중 생산 요소의 네 가지 분류에 속하지 않는 것은?", "o": ["노동", "자본", "이윤", "토지"], "a": 2, "e": "Bốn yếu tố sản xuất: lao động, vốn, đất đai, nguyên vật liệu. <b>Lợi nhuận</b> (이윤) là kết quả của sản xuất, không phải yếu tố đầu vào.", "star": false, "img": null}, {"n": 3, "p": "생산 요소와 그 예를 바르게 연결한 것은?<div class=\"tw\"><table class=\"dt\"><tr><th>생산 요소</th><th>예</th></tr><tr><td>가. 노동</td><td>A. 공장 건물과 기계</td></tr><tr><td>나. 자본</td><td>B. 공장을 지을 땅</td></tr><tr><td>다. 토지</td><td>C. 노동자가 일하는 시간과 노력</td></tr></table></div>", "o": ["가-A, 나-B, 다-C", "가-B, 나-C, 다-A", "가-C, 나-A, 다-B", "가-C, 나-B, 다-A"], "a": 2, "e": "Lao động = thời gian, công sức của người lao động (C); vốn = nhà xưởng, máy móc (A); đất đai = mặt bằng để xây nhà máy (B).", "star": false, "img": null}, {"n": 4, "p": "다음 빈칸에 들어갈 말로 알맞은 것은?<div class=\"quote\">“생산 함수는 투입된 (　　　)의 수와 그에 따라 만들어지는 생산량의 관계를 나타낸 것이다.”</div>", "o": ["가격", "소비자", "이윤", "생산 요소"], "a": 3, "e": "Hàm sản xuất Q = f(L, K, M, L) biểu thị quan hệ giữa lượng <b>yếu tố sản xuất</b> đầu vào và sản lượng làm ra.", "star": false, "img": null}, {"n": 5, "p": "노동의 한계 생산(MPL)에 대한 설명으로 옳은 것은?", "o": ["노동자 전체가 만든 생산량이다.", "노동자 1명에게 주는 임금이다.", "노동자가 1명 더 늘어날 때 추가로 늘어나는 생산량이다.", "생산량을 노동자 수로 나눈 값이다."], "a": 2, "e": "MPL = phần sản lượng <b>tăng thêm</b> khi thuê thêm 1 lao động. ① là tổng sản lượng, ④ là sản lượng bình quân.", "star": false, "img": null}, {"n": 6, "p": "다음 빈칸 (가), (나)에 들어갈 말로 알맞은 것은?<div class=\"quote\">“한계 생산물 체감 현상은 단기에서 (가) 등 다른 생산 요소를 일정하게 유지한 상태에서 노동자가 증가할수록 한계 생산이 점차 (나) 현상이다.”</div>", "o": ["(가) 자본 – (나) 감소하는", "(가) 자본 – (나) 증가하는", "(가) 임금 – (나) 감소하는", "(가) 가격 – (나) 증가하는"], "a": 0, "e": "Trong ngắn hạn, giữ cố định <b>vốn</b> và các yếu tố khác, chỉ tăng lao động thì MPL <b>giảm dần</b>.", "star": false, "img": null}, {"n": 7, "p": "한계 생산물 체감 현상이 나타날 때, 생산 함수(생산 곡선)의 모양으로 가장 알맞은 것은?", "o": ["IMG:p4a", "IMG:p4b", "IMG:p4c", "IMG:p4d"], "a": 3, "e": "MPL giảm dần → mỗi lao động thêm vào làm tổng sản lượng tăng ít hơn → đường sản xuất đi lên nhưng <b>thoải dần</b> (hình ④).", "star": false, "img": null}, {"n": 8, "p": "노동의 한계 생산 가치(VMPL)를 구하는 식으로 알맞은 것은? (MPL: 노동의 한계 생산, P: 상품의 시장 가격)", "o": ["VMPL = MPL × P", "VMPL = MPL + P", "VMPL = MPL ÷ P", "VMPL = P − MPL"], "a": 0, "e": "Giá trị sản phẩm biên của lao động: <b>VMPL = MPL × P</b>.", "star": false, "img": null}, {"n": 9, "p": "노동의 한계 생산 가치(VMPL)의 뜻으로 옳은 것은?", "o": ["노동자 1명에게 주는 월급", "기업 전체의 총매출", "추가된 노동자가 만든 생산량을 돈(수입)으로 계산한 값", "상품 1개의 시장 가격"], "a": 2, "e": "VMPL = sản lượng do lao động thêm vào làm ra, quy ra <b>tiền (doanh thu)</b>.", "star": false, "img": null}, {"n": 10, "p": "VMPL과 임금(w)의 관계와 기업의 행동을 바르게 연결한 것은?<div class=\"tw\"><table class=\"dt\"><tr><th>관계</th><th>기업의 행동</th></tr><tr><td>가. VMPL &gt; w</td><td>A. 이윤 극대화</td></tr><tr><td>나. VMPL = w</td><td>B. 추가 고용 중단</td></tr><tr><td>다. VMPL &lt; w</td><td>C. 고용 확대</td></tr></table></div>", "o": ["가-A, 나-B, 다-C", "가-C, 나-A, 다-B", "가-B, 나-A, 다-C", "가-C, 나-B, 다-A"], "a": 1, "e": "VMPL &gt; w → mở rộng tuyển dụng (C); VMPL = w → lợi nhuận tối đa (A); VMPL &lt; w → ngừng tuyển thêm (B).", "star": false, "img": null}, {"n": 11, "p": "다음 빈칸에 들어갈 말로 알맞은 것은?<div class=\"quote\">“한계 이윤(MP) = 노동의 한계 생산 가치(VMPL) (　　　) 임금(w)”</div>", "o": ["+", "×", "÷", "−"], "a": 3, "e": "Lợi nhuận biên = tiền lao động mang lại − tiền trả cho lao động: <b>MP = VMPL − w</b>.", "star": false, "img": null}, {"n": 12, "p": "이윤 극대화가 달성될 때 한계 이윤(MP)은 얼마인가?", "o": ["0보다 크다", "0보다 작다", "임금과 같다", "0"], "a": 3, "e": "Lợi nhuận tối đa khi VMPL = w → MP = VMPL − w = <b>0</b>.", "star": false, "img": null}, {"n": 13, "p": "다음 빈칸에 들어갈 말로 알맞은 것은?<div class=\"quote\">“기업은 VMPL = 임금이 되는 지점까지 고용하므로, 노동의 (　　　)를 나타내는 곡선이 곧 기업의 노동 수요 곡선이다.”</div>", "o": ["총생산량", "평균 생산", "한계 생산 가치", "임금"], "a": 2, "e": "Doanh nghiệp thuê đến khi VMPL = w nên đường <b>giá trị sản phẩm biên</b> (VMPL) chính là đường cầu lao động.", "star": false, "img": null}, {"n": 14, "p": "생산 함수 Q = f(L, K, M, L)에서 K가 뜻하는 생산 요소는?", "o": ["노동", "재료", "토지", "자본"], "a": 3, "e": "L: lao động (Labor), <b>K: vốn (Capital)</b>, M: nguyên liệu (Materials), L: đất đai (Land).", "star": false, "img": null}, {"n": 15, "p": "다음 설명 중 옳지 않은 것은?", "o": ["MPL이 0이면 총생산량이 가장 크다.", "MPL이 0보다 작으면 총생산량이 줄어든다.", "VMPL은 MPL에 상품 가격을 곱한 값이다.", "임금이 VMPL보다 높으면 고용을 늘린다."], "a": 3, "e": "④ sai: khi w &gt; VMPL, tiền trả cho lao động nhiều hơn tiền họ mang lại → phải <b>ngừng</b> tuyển thêm.", "star": false, "img": null}, {"n": 16, "p": "한계 생산물 체감 현상에 대한 설명으로 옳은 것을 〈보기〉에서 모두 고른 것은?<div class=\"box\"><div class=\"box-t\">〈보기〉</div><p>ㄱ. 다른 생산 요소가 일정한 단기에서 나타난다.</p><p>ㄴ. 체감 현상이 나타나면 총생산량이 바로 줄어든다.</p><p>ㄷ. MPL이 줄어들어도 0보다 크면 총생산량은 증가한다.</p><p>ㄹ. 체감 현상 때문에 생산 곡선은 점차 완만해진다.</p></div>", "o": ["ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "a": 2, "e": "ㄱ, ㄷ, ㄹ đúng. ㄴ sai: chỉ MPL giảm, tổng sản lượng vẫn tăng; tổng sản lượng chỉ giảm khi MPL &lt; 0.", "star": true, "img": null}, {"n": 17, "p": "[그림]은 어떤 기업의 노동 수요 곡선과 임금이다. 옳은 것을 〈보기〉에서 모두 고른 것은?<div class=\"box\"><div class=\"box-t\">〈보기〉</div><p>ㄱ. A에서는 노동자를 더 고용하는 것이 좋다.</p><p>ㄴ. B에서 한계 이윤은 0이다.</p><p>ㄷ. C에서는 VMPL이 임금보다 크다.</p><p>ㄹ. 이 기업은 노동자를 4명 고용한다.</p></div>", "o": ["ㄱ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ, ㄹ"], "a": 2, "e": "A: VMPL &gt; w → nên thuê thêm (ㄱ đúng). B: VMPL = w → MP = 0, lợi nhuận tối đa với 4 người (ㄴ, ㄹ đúng). C: VMPL &lt; w (ㄷ sai).", "star": true, "img": "f4_17"}, {"n": 18, "p": "노동 수요 곡선이 오른쪽 아래로 내려가는 모양인 이유로 가장 알맞은 것은?", "o": ["한계 생산물 체감 현상 때문에 노동자가 늘수록 VMPL이 줄어들기 때문이다.", "노동자가 많을수록 임금이 오르기 때문이다.", "상품의 가격이 계속 오르기 때문이다.", "노동자가 늘수록 총생산량이 줄어들기 때문이다."], "a": 0, "e": "MPL giảm dần → VMPL (= MPL × P) cũng giảm khi thuê thêm lao động → đường cầu lao động <b>dốc xuống</b>.", "star": true, "img": null}, {"n": 19, "p": "이윤을 극대화하려는 기업이 노동자를 더 고용할지 결정할 때 비교하는 두 가지는?", "o": ["총생산량과 상품 가격", "노동자 수와 기계 수", "VMPL과 임금", "총매출과 토지 가격"], "a": 2, "e": "So sánh số tiền lao động mang lại (<b>VMPL</b>) với số tiền trả cho lao động (<b>tiền lương</b>).", "star": false, "img": null}, {"n": 20, "p": "다음 빈칸 (가), (나)에 들어갈 말로 알맞은 것은? (다른 조건은 같음)<div class=\"quote\">“상품의 시장 가격(P)이 오르면 같은 MPL에서도 VMPL이 (가), 노동 수요 곡선은 (나)으로 이동한다.”</div>", "o": ["(가) 커지고 – (나) 오른쪽", "(가) 작아지고 – (나) 오른쪽", "(가) 커지고 – (나) 왼쪽", "(가) 작아지고 – (나) 왼쪽"], "a": 0, "e": "VMPL = MPL × P → P tăng thì VMPL <b>tăng</b>; ở cùng mức lương sẽ thuê nhiều hơn → đường cầu lao động dịch sang <b>phải</b>.", "star": true, "img": null}, {"n": 21, "p": "오븐이 1대뿐인 빵집에서 직원을 늘렸더니, 처음에는 빵 생산량이 많이 늘었지만 나중에는 조금밖에 늘지 않았다. 이와 관계가 깊은 것은?", "o": ["한계 생산물 체감 현상", "수요 법칙", "이윤 극대화", "완전 경쟁 시장"], "a": 0, "e": "Vốn (lò nướng) cố định, chỉ tăng lao động → MPL giảm dần (<b>hiện tượng sản phẩm biên giảm dần</b>).", "star": false, "img": null}, {"n": 22, "p": "좁은 주방에 요리사가 너무 많아서 서로 부딪히고, 요리사를 한 명 더 넣었더니 음식 생산량이 오히려 줄었다. 이 요리사의 한계 생산은?", "o": ["0보다 크다", "0이다", "0보다 작다", "총생산량과 같다"], "a": 2, "e": "Thêm 1 đầu bếp mà sản lượng lại giảm → <b>MPL &lt; 0</b>.", "star": false, "img": null}, {"n": 23, "p": "민지는 커피숍을 열려고 한다. 준비한 것과 생산 요소를 바르게 연결한 것은?<div class=\"tw\"><table class=\"dt\"><tr><th>준비한 것</th><th>생산 요소</th></tr><tr><td>가. 가게를 열 땅</td><td>A. 노동</td></tr><tr><td>나. 커피 머신</td><td>B. 재료</td></tr><tr><td>다. 바리스타</td><td>C. 토지</td></tr><tr><td>라. 커피 원두</td><td>D. 자본</td></tr></table></div>", "o": ["가-C, 나-D, 다-A, 라-B", "가-D, 나-C, 다-A, 라-B", "가-C, 나-B, 다-A, 라-D", "가-A, 나-D, 다-C, 라-B"], "a": 0, "e": "Đất mở quán = đất đai (C); máy pha cà phê = vốn (D); barista = lao động (A); hạt cà phê = nguyên liệu (B).", "star": false, "img": null}, {"n": 24, "p": "한 회사에서 새 직원 1명을 뽑으면 하루에 50만 원의 수입(VMPL)이 더 생기고, 직원의 하루 임금은 40만 원이다. 이 회사가 해야 할 일로 알맞은 것은?", "o": ["직원을 뽑지 않는다.", "직원의 임금을 50만 원으로 올린다.", "직원을 1명 줄인다.", "직원을 뽑는다."], "a": 3, "e": "VMPL (50만 원) &gt; w (40만 원) → lợi nhuận biên +10만 원 → nên <b>tuyển thêm</b>.", "star": false, "img": null}, {"n": 25, "p": "한 식당에서 직원 1명을 더 고용하면 하루 VMPL은 30만 원이고, 하루 임금은 35만 원이다. 이에 대한 설명으로 옳은 것은?", "o": ["한계 이윤이 5만 원이므로 고용한다.", "한계 이윤이 −5만 원이므로 고용하지 않는다.", "VMPL이 임금보다 크므로 고용한다.", "이윤이 극대화된 상태이다."], "a": 1, "e": "MP = 30 − 35 = <b>−5만 원</b> &lt; 0 → không thuê thêm.", "star": false, "img": null}, {"n": 26, "p": "정부가 최저 임금을 크게 올렸다. 다른 조건이 같다면 기업의 고용량은 어떻게 되겠는가?", "o": ["늘어난다.", "변하지 않는다.", "두 배가 된다.", "줄어든다."], "a": 3, "e": "Lương tăng → số lao động mà tại đó VMPL = w ít đi → lượng thuê <b>giảm</b> (di chuyển lên trên dọc theo đường cầu lao động).", "star": false, "img": null}, {"n": 27, "p": "한 기업의 노동 수요 곡선으로 가장 알맞은 것은?", "o": ["IMG:l4a", "IMG:l4b", "IMG:l4c", "IMG:l4d"], "a": 2, "e": "Đường cầu lao động = đường VMPL → <b>dốc xuống</b> sang phải (hình ③).", "star": false, "img": null}, {"n": 28, "p": "신발의 시장 가격이 크게 올랐다(임금은 그대로). 신발 공장의 노동 수요 곡선 변화로 알맞은 것은?<div class=\"note\">실선: 처음 곡선, 점선: 변화 후 곡선</div>", "o": ["IMG:s4a", "IMG:s4b", "IMG:s4c", "IMG:s4d"], "a": 3, "e": "Giá giày tăng → cùng MPL nhưng VMPL lớn hơn → cả đường cầu lao động <b>dịch sang phải</b> (hình ④). Hình ② và ③ chỉ là di chuyển dọc theo đường.", "star": true, "img": null}, {"n": 29, "p": "공장의 기계 수는 그대로 두고 노동자만 계속 늘렸더니 한계 생산이 줄어들었다. 그 이유로 가장 알맞은 것은?", "o": ["노동자 1명이 사용할 수 있는 기계가 점점 줄어들기 때문이다.", "노동자가 늘어서 상품 가격이 올랐기 때문이다.", "노동자들의 임금이 줄었기 때문이다.", "기계의 수가 늘었기 때문이다."], "a": 0, "e": "Vốn (máy móc) cố định → mỗi lao động có <b>ít máy hơn</b> để sử dụng → MPL giảm.", "star": false, "img": null}, {"n": 30, "p": "다음은 네 사장님의 말이다. 이윤 극대화의 원리에 맞게 말한 사람은?", "o": ["A: “VMPL이 임금보다 크니까 한 명 더 고용해야지.”", "B: “생산량이 늘어나기만 하면 계속 고용해야지.”", "C: “MPL이 0이 될 때까지 고용해야 이윤이 가장 커.”", "D: “임금이 VMPL보다 높아도 일단 고용해야지.”"], "a": 0, "e": "VMPL &gt; w thì lợi nhuận biên dương → nên thuê thêm. B và C quên mất chi phí tiền lương; D thuê cả khi bị lỗ.", "star": false, "img": null}, {"n": 31, "p": "한 공장에서 6번째 노동자를 고용해도 총생산량이 그대로였다. 이에 대한 설명으로 옳은 것은?", "o": ["6번째 노동자의 MPL은 0이다.", "6번째 노동자의 VMPL은 임금과 같다.", "6번째 노동자를 고용하면 이윤이 늘어난다.", "6번째 노동자의 MPL은 0보다 크다."], "a": 0, "e": "Tổng sản lượng không đổi → <b>MPL = 0</b> → VMPL = 0 &lt; w → thuê thêm chỉ tốn tiền lương, lợi nhuận giảm.", "star": false, "img": null}, {"n": 32, "p": "수박 가격이 크게 떨어졌다. 수박 농장의 노동 시장에서 일어날 일로 가장 알맞은 것은?", "o": ["노동자의 MPL이 커진다.", "VMPL이 커져서 농장은 노동자를 더 고용한다.", "수박 가격과 고용은 관계가 없다.", "VMPL이 줄어들어 농장은 노동자를 덜 고용한다."], "a": 3, "e": "Giá dưa hấu giảm → VMPL giảm → cầu lao động giảm → nông trại thuê <b>ít hơn</b>.", "star": false, "img": null}, {"n": 33, "p": "A 공장과 B 공장의 노동자 MPL과 임금은 같다. 그런데 A 공장의 상품 가격이 B 공장보다 높다. 이에 대한 설명으로 옳은 것은?", "o": ["두 공장의 VMPL은 같다.", "A 공장의 VMPL이 더 커서, A 공장이 노동자를 더 많이 고용할 수 있다.", "B 공장의 VMPL이 더 크다.", "상품 가격은 고용에 영향을 주지 않는다."], "a": 1, "e": "VMPL = MPL × P → A có giá cao hơn nên VMPL lớn hơn → ở cùng mức lương A có thể thuê nhiều hơn.", "star": true, "img": null}, {"n": 34, "p": "한 사장님은 “총생산량이 가장 클 때까지 노동자를 고용하면 이윤도 가장 크다.”라고 생각한다. 이 생각이 틀린 이유로 가장 알맞은 것은?", "o": ["총생산량이 클수록 상품 가격이 오르기 때문이다.", "노동자에게 주는 임금(비용)을 생각하지 않았기 때문이다.", "총생산량은 노동자 수와 관계가 없기 때문이다.", "총생산량이 가장 클 때 MPL이 가장 크기 때문이다."], "a": 1, "e": "Tại tổng sản lượng tối đa (MPL = 0) thì VMPL = 0 &lt; w. Lợi nhuận tối đa ở điểm VMPL = w, tức thuê ít người hơn. Ông chủ đã quên <b>chi phí tiền lương</b>.", "star": true, "img": null}, {"n": 35, "p": "다음 상황과 경제 개념을 연결한 것으로 옳지 않은 것은?", "o": ["직원 1명을 더 뽑아서 늘어난 판매 수입 → VMPL", "노동자 1명이 더 늘어나 추가로 만든 생산량 → MPL", "공장을 짓기 위해 산 땅 → 토지", "생산을 늘리려고 새 기계를 많이 샀다 → 노동"], "a": 3, "e": "④ sai: máy móc là <b>vốn</b> (자본), không phải lao động.", "star": false, "img": null}, {"n": 36, "p": "어떤 공장의 생산 함수가 Q = 50L − 5L²이다. 노동자가 3명(L = 3)일 때 생산량은?", "o": ["95개", "105개", "135개", "150개"], "a": 1, "e": "50 × 3 − 5 × 3² = 150 − 45 = <b>105</b>.", "star": false, "img": null}, {"n": 37, "p": "다음 표에서 3번째 노동자의 한계 생산(MPL)은?<div class=\"tw\"><table class=\"dt\"><tr><th>노동자 수(명)</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>생산량(개)</th><td>0</td><td>30</td><td>55</td><td>75</td><td>90</td><td>100</td></tr></table></div>", "o": ["15개", "20개", "25개", "75개"], "a": 1, "e": "MPL₃ = 75 − 55 = <b>20</b>.", "star": false, "img": null}, {"n": 38, "p": "노동자 1~4번째의 한계 생산이 차례대로 12개, 10개, 8개, 6개이다. 노동자 4명이 만드는 총생산량은?", "o": ["6개", "30개", "36개", "48개"], "a": 2, "e": "Tổng sản lượng = tổng các MPL = 12 + 10 + 8 + 6 = <b>36</b>.", "star": false, "img": null}, {"n": 39, "p": "노동자 1명을 더 고용했을 때 MPL이 15개이고, 상품 1개의 시장 가격이 2만 원이다. 이 노동자의 VMPL은?", "o": ["7.5만 원", "17만 원", "30만 원", "300만 원"], "a": 2, "e": "VMPL = 15 × 2만 = <b>30만 원</b>.", "star": false, "img": null}, {"n": 40, "p": "상품 가격이 5만 원일 때, 다음 표의 빈칸 (가), (나)에 들어갈 숫자로 알맞은 것은?<div class=\"tw\"><table class=\"dt\"><tr><th>노동자 수(명)</th><th>1</th><th>2</th><th>3</th></tr><tr><th>생산량(개)</th><td>20</td><td>36</td><td>(가)</td></tr><tr><th>MPL(개)</th><td>20</td><td>16</td><td>12</td></tr><tr><th>VMPL(만 원)</th><td>100</td><td>(나)</td><td>60</td></tr></table></div>", "o": ["(가) 48 – (나) 80", "(가) 48 – (나) 16", "(가) 44 – (나) 80", "(가) 56 – (나) 60"], "a": 0, "e": "(가) = 36 + 12 = <b>48</b>; (나) = 16 × 5 = <b>80</b>.", "star": false, "img": null}, {"n": 41, "p": "다음은 한 기업의 VMPL이다. 노동자 1명의 임금이 30만 원일 때, 이윤을 극대화하려면 몇 명을 고용해야 하는가?<div class=\"tw\"><table class=\"dt\"><tr><th>노동자 수(명)</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr><tr><th>VMPL(만 원)</th><td>90</td><td>75</td><td>60</td><td>45</td><td>30</td><td>15</td></tr></table></div>", "o": ["3명", "4명", "5명", "6명"], "a": 2, "e": "Thuê đến lao động cuối cùng có VMPL ≥ w: lao động thứ 5 có VMPL = 30 = w → <b>5 người</b>.", "star": false, "img": null}, {"n": 42, "p": "완전 경쟁 시장의 피자 가게는 피자 1판을 2만 원에 팔고, 직원을 시간당 6,000원에 고용한다. 이윤 극대화를 위해 노동의 한계 생산이 얼마가 될 때까지 고용을 늘려야 하는가?", "o": ["시간당 0.3판", "시간당 0.5판", "시간당 3판", "시간당 12판"], "a": 0, "e": "VMPL = P × MPL = w → 20.000 × MPL = 6.000 → <b>MPL = 0,3 판/giờ</b>.", "star": true, "img": null}, {"n": 43, "p": "상품 가격이 5만 원, 임금이 20만 원일 때, 3번째 노동자의 한계 이윤(MP)은?<div class=\"tw\"><table class=\"dt\"><tr><th>노동자 수(명)</th><th>0</th><th>1</th><th>2</th><th>3</th></tr><tr><th>생산량(개)</th><td>0</td><td>10</td><td>18</td><td>24</td></tr></table></div>", "o": ["−10만 원", "10만 원", "30만 원", "40만 원"], "a": 1, "e": "MPL₃ = 24 − 18 = 6 → VMPL = 6 × 5만 = 30만 → MP = 30만 − 20만 = <b>10만 원</b>.", "star": false, "img": null}, {"n": 44, "p": "[그림]은 한 기업의 노동자 수에 따른 VMPL과 임금이다. 이 기업이 이윤을 극대화하려면 몇 명을 고용해야 하는가?", "o": ["3명", "4명", "5명", "6명"], "a": 1, "e": "VMPL = w = 60만 원 tại lao động thứ 4 → thuê <b>4 người</b>.", "star": false, "img": "f4_44"}, {"n": 45, "p": "한 기업의 VMPL이 다음과 같다. 임금이 70만 원에서 40만 원으로 내리면 이 기업의 고용량은 어떻게 변하는가?<div class=\"tw\"><table class=\"dt\"><tr><th>노동자 수(명)</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr><tr><th>VMPL(만 원)</th><td>100</td><td>85</td><td>70</td><td>55</td><td>40</td><td>25</td></tr></table></div>", "o": ["1명 증가", "2명 증가", "2명 감소", "변화 없음"], "a": 1, "e": "w = 70만 → thuê 3 người; w = 40만 → thuê 5 người → <b>tăng 2 người</b>.", "star": true, "img": null}, {"n": 46, "p": "상품 가격은 5만 원, 노동자 1인당 임금은 40만 원이다. 이 기업이 얻을 수 있는 최대 총이윤은?<div class=\"tw\"><table class=\"dt\"><tr><th>노동자 수(명)</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>생산량(개)</th><td>0</td><td>20</td><td>36</td><td>48</td><td>56</td><td>60</td></tr></table></div>", "o": ["100만 원", "120만 원", "140만 원", "300만 원"], "a": 1, "e": "Doanh thu (만 원): 0, 100, 180, 240, 280, 300; chi phí lương: 0, 40, 80, 120, 160, 200 → lợi nhuận: 0, 60, 100, 120, 120, 100 → tối đa <b>120만 원</b>.", "star": true, "img": null}, {"n": 47, "p": "한 기업이 노동자 6명을 1인당 50만 원에 고용해 상품 90개를 만들었다. 상품 가격이 8만 원이라면 총이윤은? (비용은 임금만 있다고 가정)", "o": ["300만 원", "420만 원", "720만 원", "1,020만 원"], "a": 1, "e": "Doanh thu 90 × 8만 = 720만; chi phí 6 × 50만 = 300만 → lợi nhuận <b>420만 원</b>.", "star": false, "img": null}, {"n": 48, "p": "다음 표에서 한계 생산(MPL)이 처음으로 0보다 작아지는 것은 몇 번째 노동자인가?<div class=\"tw\"><table class=\"dt\"><tr><th>노동자 수(명)</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th></tr><tr><th>생산량(개)</th><td>25</td><td>44</td><td>57</td><td>64</td><td>70</td><td>72</td><td>70</td></tr></table></div>", "o": ["4번째", "5번째", "6번째", "7번째"], "a": 3, "e": "MPL lần lượt: 25, 19, 13, 7, 6, 2, −2 → lần đầu âm ở <b>lao động thứ 7</b>.", "star": false, "img": null}, {"n": 49, "p": "[그림]은 한 기업의 노동의 한계 생산이다. 상품 가격이 3만 원, 임금이 36만 원일 때 이윤을 극대화하는 노동자 수는?", "o": ["2명", "3명", "4명", "5명"], "a": 1, "e": "VMPL = MPL × 3만 = 60, 48, 36, 24, 12, 0 (만 원) → VMPL = w = 36만 tại <b>3 người</b>.", "star": false, "img": "f4_49"}, {"n": 50, "p": "5번째 노동자의 MPL은 10개이다. 상품 가격이 2만 원에서 3만 원으로 오르면 5번째 노동자의 VMPL은 어떻게 변하는가?", "o": ["1만 원 증가", "10만 원 증가", "10만 원 감소", "30만 원 증가"], "a": 1, "e": "VMPL: 10 × 2만 = 20만 → 10 × 3만 = 30만 → <b>tăng 10만 원</b>.", "star": false, "img": null}]}];
