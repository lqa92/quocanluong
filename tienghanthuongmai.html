<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trắc nghiệm Kinh tế · Bài 1–2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --paper:#ffffff; --ink:#1d2433; --ink-2:#5b6474; --ink-3:#8a93a3;
  --line:#e6e1d8; --line-2:#d9d2c5;
  --accent:#1f5f8b; --accent-soft:#e7f0f7; --warm:#c8894b; --warm-soft:#f7ede2;
  --ok:#2f7d4f; --ok-soft:#e6f4ec; --no:#c0392b; --no-soft:#fbeaea; --star:#b7791f;
  --radius:14px; --shadow:0 1px 2px rgba(29,36,51,.06),0 6px 24px rgba(29,36,51,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 64px}
header.top{position:sticky;top:0;z-index:10;background:rgba(246,243,238,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:0}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--warm);box-shadow:14px 0 0 var(--accent)}
.brand .t{margin-left:14px}
.spacer{flex:1}
.tabbar{border-top:1px solid var(--line)}
.tabbar .in2{max-width:860px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabbtn{border:0;background:none;padding:10px 12px 9px;font-weight:600;font-size:14px;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tabbtn:hover{color:var(--ink)}
.tabbtn.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabbtn:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.tabbtn .short{display:none}
@media (max-width:760px){.tabbtn .full{display:none}.tabbtn .short{display:inline}.tabbtn{flex:1}}
.modes.one{grid-template-columns:minmax(0,440px)}
.lb{font-size:13px;font-weight:600;color:var(--warm);background:var(--warm-soft);border-radius:8px;padding:3px 10px}

.back{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;text-decoration:none;color:var(--accent);font-weight:600;font-size:14px;border:1.5px solid #a9c6dc;background:var(--accent-soft);border-radius:999px;padding:5px 12px}
.back:hover{background:#d8e7f2}
.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:560px){.back .long{display:none}}
@media (max-width:420px){.brand{display:none}}
body{display:flex;flex-direction:column;min-height:100vh}
main.wrap{flex:1;width:100%}
.foot{text-align:center;color:#000;font-size:13px;padding:20px 16px 28px;border-top:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.pill.timer{font-variant-numeric:tabular-nums;font-size:16px;padding:5px 14px}
.pill.timer.low{color:var(--no);border-color:#e9b5ae;background:var(--no-soft)}
.pill .ok{color:var(--ok)} .pill .no{color:var(--no)}

/* home */
.hero{padding:28px 0 8px}
.eyebrow{font-size:13px;font-weight:600;color:var(--warm);letter-spacing:.06em;text-transform:uppercase}
.hero h1{font-family:"Noto Sans KR","Be Vietnam Pro",sans-serif;font-size:clamp(28px,6vw,40px);line-height:1.2;margin:6px 0 8px;letter-spacing:-.02em}
.hero p{color:var(--ink-2);margin:0;max-width:56ch}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
@media (max-width:640px){.modes{grid-template-columns:1fr}}
.mode{all:unset;cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-2px);border-color:var(--line-2)}
.mode:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mode .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px}
.mode.p .ic{background:var(--accent-soft);color:var(--accent)}
.mode.t .ic{background:var(--warm-soft);color:var(--warm)}
.mode h2{margin:0;font-size:20px}
.mode p{margin:0;color:var(--ink-2);font-size:15px}
.mode ul{margin:4px 0 0;padding-left:18px;color:var(--ink-2);font-size:14px}
.mode .go{margin-top:auto;padding-top:8px;font-weight:600;font-size:15px}
.mode.p .go{color:var(--accent)} .mode.t .go{color:var(--warm)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;color:var(--ink-2);font-size:14px}
.meta span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 12px}

/* progress */
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 16px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.prog.warm i{background:var(--warm)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--ink-2);font-size:14px}

/* question card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
@media (max-width:520px){.card{padding:16px}}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qnum{font-weight:700;font-size:14px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 10px}
.star{font-size:13px;font-weight:600;color:var(--star);background:#fbf3e3;border-radius:8px;padding:3px 10px}
.orig{font-size:13px;color:var(--ink-3)}
.prompt{font-family:"Noto Sans KR","Be Vietnam Pro",sans-serif;font-size:18px;line-height:1.7;font-weight:500;word-break:keep-all}
.prompt .quote{margin:12px 0 4px;padding:10px 14px;border-left:3px solid var(--warm);background:var(--warm-soft);border-radius:0 10px 10px 0;font-weight:400}
.prompt .box{margin:12px 0 4px;border:1px solid var(--line-2);border-radius:10px;padding:10px 14px;font-weight:400;font-size:16px}
.prompt .box p{margin:2px 0}
.prompt .box-t{font-weight:700;font-size:14px;color:var(--ink-2);margin-bottom:4px}
.prompt .formula{margin:12px 0 4px;font-weight:700;background:#f3f5f8;border-radius:10px;padding:10px 14px;letter-spacing:.01em}
.prompt .note{margin-top:8px;font-size:14px;color:var(--ink-2);font-weight:400}
.tw{overflow-x:auto;margin:12px 0 4px}
.dt{border-collapse:collapse;font-size:15px;font-weight:400;min-width:100%}
.dt th,.dt td{border:1px solid var(--line-2);padding:7px 12px;text-align:center;white-space:nowrap}
.dt th{background:#f3f1ec;font-weight:600}
.fig{margin:14px 0 4px;text-align:center}
.fig img{max-width:min(100%,460px);height:auto;border-radius:10px;border:1px solid var(--line)}

/* options */
.opts{display:grid;gap:10px;margin-top:18px}
.opts.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:640px){.opts.g4{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:var(--paper);border:1.5px solid var(--line-2);border-radius:12px;padding:12px 14px;cursor:pointer;font-family:"Noto Sans KR","Be Vietnam Pro",sans-serif;font-size:16px;line-height:1.55;transition:border-color .12s,background .12s;word-break:keep-all}
.opt:hover:not(:disabled){border-color:var(--accent);background:#fafcfe}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .mark{flex:none;font-size:18px;line-height:1.4;color:var(--ink-2)}
.opt.imgopt{flex-direction:column;align-items:center;padding:10px}
.opt.imgopt img{width:100%;height:auto;border-radius:6px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mark{color:var(--accent);font-weight:700}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .mark{color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.opt.wrong .mark{color:var(--no);font-weight:700}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.tag{display:inline-block;font-family:"Be Vietnam Pro",sans-serif;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.tag.ok{background:var(--ok);color:#fff} .tag.no{background:var(--no);color:#fff}

/* feedback */
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid}
.fb.ok{background:var(--ok-soft);border-color:#bfe0cc}
.fb.no{background:var(--no-soft);border-color:#efc4bf}
.fb.neutral{background:#f4f6f9;border-color:var(--line)}
.fb-h{font-weight:700;margin-bottom:4px}
.fb.ok .fb-h{color:var(--ok)} .fb.no .fb-h{color:var(--no)}
.fb-b{font-size:15px;color:var(--ink)}
.fb-b b{font-weight:600}

/* nav */
.nav{display:flex;gap:10px;margin-top:16px}
.btn{border:1.5px solid var(--line-2);background:var(--paper);border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:15px}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:#174c70}
.btn.warm{background:var(--warm);border-color:var(--warm);color:#fff}
.btn.warm:hover:not(:disabled){background:#b07337}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.nav .btn.grow{flex:1}

/* navigator */
.navi{margin-top:18px}
.navi summary{cursor:pointer;color:var(--ink-2);font-size:14px;font-weight:600;list-style:none}
.navi summary::-webkit-details-marker{display:none}
.navi summary::before{content:"▸ ";}
.navi[open] summary::before{content:"▾ ";}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:10px}
@media (max-width:520px){.grid{grid-template-columns:repeat(8,1fr)}}
.cell{border:1.5px solid var(--line-2);background:var(--paper);border-radius:8px;padding:6px 0;font-size:13px;font-weight:600;cursor:pointer;text-align:center;font-variant-numeric:tabular-nums}
.cell.ok{background:var(--ok-soft);border-color:#9fd0b2;color:var(--ok)}
.cell.no{background:var(--no-soft);border-color:#e9aaa3;color:var(--no)}
.cell.done{background:var(--accent-soft);border-color:#a9c6dc;color:var(--accent)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:0}

/* submit area */
.submit{margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;background:var(--paper);border:1px dashed var(--line-2);border-radius:12px;padding:12px 14px}

/* results */
.score{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
@media (max-width:520px){.score{grid-template-columns:1fr;text-align:center;justify-items:center}}
.ring{--p:0;width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--no-soft) 0);display:grid;place-items:center}
.ring>div{width:104px;height:104px;border-radius:50%;background:var(--paper);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-size:34px}
.ring small{display:block;color:var(--ink-2);font-size:13px;margin-top:2px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}
.stat{border-radius:12px;padding:8px 14px;font-weight:600;font-size:15px}
.stat.ok{background:var(--ok-soft);color:var(--ok)} .stat.no{background:var(--no-soft);color:var(--no)} .stat.t{background:#f1f3f6;color:var(--ink-2)}
.tabs{display:flex;gap:6px;margin:26px 0 12px}
.tab{border:1.5px solid var(--line-2);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.review{display:grid;gap:14px}
.review .card{padding:18px}
.timeout{background:var(--no-soft);color:var(--no);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;margin-bottom:12px;display:inline-block}
.kbd{font-size:13px;color:var(--ink-3);margin-top:14px}
.kbd span{border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--paper);font-size:12px}
</style>
</head>

</div>

<main class="wrap" id="app"></main>
<footer class="foot">Ứng dụng được thiết kế bởi ThS. Lương Quốc An (HUFLIT), dựa trên công cụ Claude</footer>

<script>
const LESSONS = [{"key": "b1", "tab": "Bài 1. Cung và cầu", "short": "Bài 1", "ko": "수요와 공급", "eyebrow": "Bài 1 · Cung và cầu", "qs": [{"n": 1, "p": "재화를 사고자 하는 욕구를 무엇이라고 하는가?", "o": ["공급", "수요", "균형", "생산"], "a": 1, "e": "Cầu (수요) là mong muốn mua hàng hóa. Mong muốn bán hàng hóa là cung (공급).", "star": false, "img": null}, {"n": 2, "p": "다음 빈칸에 들어갈 말로 알맞은 것은?<div class=\"quote\">“수요와 공급을 결정하는 가장 중요한 요인은 (　　　)이다.”</div>", "o": ["소득", "광고", "가격", "인구"], "a": 2, "e": "Yếu tố quan trọng nhất quyết định cả cầu và cung là giá cả (가격).", "star": false, "img": null}, {"n": 3, "p": "다음 중 경제학에서 말하는 ‘수요’가 있는 경우는?", "o": ["A씨는 아이폰을 사고 싶지만 돈이 부족하다.", "A씨는 돈은 있지만 아이폰을 사고 싶지 않다.", "A씨는 자신의 아이폰을 다른 사람에게 팔고 싶다.", "A씨는 아이폰을 사고 싶고 살 돈도 충분하다."], "a": 3, "e": "Cầu trong kinh tế học cần đủ hai điều kiện: <b>muốn mua</b> và <b>có khả năng chi trả</b>. ① muốn nhưng không có tiền, ② có tiền nhưng không muốn, ③ là mong muốn bán (thuộc về cung).", "star": false, "img": null}, {"n": 4, "p": "수요 법칙에 대한 설명으로 옳은 것은?", "o": ["가격이 오르면 수요량이 감소한다.", "가격이 오르면 수요량도 증가한다.", "가격과 수요량은 관계가 없다.", "가격이 내리면 수요량이 감소한다."], "a": 0, "e": "Quy luật cầu: giá và lượng cầu quan hệ <b>nghịch chiều</b> — giá tăng thì lượng cầu giảm, giá giảm thì lượng cầu tăng.", "star": false, "img": null}, {"n": 5, "p": "수요 곡선의 일반적인 모양으로 알맞은 것은?", "o": ["오른쪽 위로 올라가는 모양", "오른쪽 아래로 내려오는 모양", "가로로 평평한 모양", "세로로 곧은 모양"], "a": 1, "e": "Đường cầu dốc xuống từ trái sang phải (오른쪽 아래로 내려오는 모양) vì giá và lượng cầu quan hệ nghịch. Đường dốc lên là đường cung.", "star": false, "img": null}, {"n": 6, "p": "경제 용어와 그 뜻을 바르게 연결한 것은?<div class=\"tw\"><table class=\"dt\"><tr><th>용어</th><th>뜻</th></tr><tr><td>가. 수요</td><td>A. 재화를 팔고자 하는 욕구</td></tr><tr><td>나. 공급</td><td>B. 수요량과 공급량이 같아질 때의 가격</td></tr><tr><td>다. 균형 가격</td><td>C. 재화를 사고자 하는 욕구</td></tr></table></div>", "o": ["가-A, 나-C, 다-B", "가-B, 나-A, 다-C", "가-C, 나-A, 다-B", "가-C, 나-B, 다-A"], "a": 2, "e": "수요 = mong muốn mua (C); 공급 = mong muốn bán (A); 균형 가격 = mức giá mà tại đó lượng cầu bằng lượng cung (B).", "star": false, "img": null}, {"n": 7, "p": "공급 법칙에 따르면, 가격이 내려가면 공급량은 어떻게 되는가?", "o": ["증가한다.", "변하지 않는다.", "수요량과 같아진다.", "감소한다."], "a": 3, "e": "Quy luật cung: giá và lượng cung quan hệ <b>cùng chiều</b>. Giá giảm thì người bán muốn bán ít hơn → lượng cung giảm.", "star": false, "img": null}, {"n": 8, "p": "공급 함수 Qˢ = a + bP에서 b에 대한 설명으로 옳은 것은?", "o": ["b &lt; 0", "b = 0", "b &gt; 0", "b는 항상 1이다."], "a": 2, "e": "Đường cung dốc lên (giá tăng thì lượng cung tăng) nên hệ số b &gt; 0. Ngược lại, hàm cầu có b &lt; 0.", "star": false, "img": null}, {"n": 9, "p": "다음 빈칸 (가), (나)에 들어갈 말로 알맞은 것은?<div class=\"quote\">“수요량이 공급량보다 많은 상태를 (가), 공급량이 수요량보다 많은 상태를 (나)라고 한다.”</div>", "o": ["(가) 초과 수요 – (나) 초과 공급", "(가) 초과 공급 – (나) 초과 수요", "(가) 균형 – (나) 불균형", "(가) 수요 증가 – (나) 공급 증가"], "a": 0, "e": "Lượng cầu &gt; lượng cung → dư cầu (초과 수요). Lượng cung &gt; lượng cầu → dư cung (초과 공급).", "star": false, "img": null}, {"n": 10, "p": "균형점에 대한 설명으로 옳은 것은?", "o": ["수요량이 공급량보다 많은 점이다.", "수요 곡선과 공급 곡선이 만나는 점이다.", "가격이 가장 높은 점이다.", "거래량이 0인 점이다."], "a": 1, "e": "Điểm cân bằng là giao điểm của đường cầu và đường cung — tại đó lượng cầu bằng lượng cung.", "star": false, "img": null}, {"n": 11, "p": "[그림]에서 가격이 P₁일 때의 시장 상황과 앞으로의 가격 변화를 바르게 짝지은 것은?", "o": ["초과 수요(b−a) – 가격 상승", "초과 공급(b−a) – 가격 하락", "초과 공급(b−a) – 가격 상승", "균형 상태 – 가격 변화 없음"], "a": 1, "e": "Tại P₁ (cao hơn giá cân bằng P₀): lượng cầu là a, lượng cung là b, a &lt; b → <b>dư cung</b> (b−a). Người bán cạnh tranh hạ giá để bán được hàng → giá giảm dần về P₀.", "star": false, "img": "fig1"}, {"n": 12, "p": "초과 수요가 발생했을 때 시장에서 일어나는 일로 옳지 않은 것은?", "o": ["물건이 부족해진다.", "사려는 소비자들 사이에 경쟁이 생긴다.", "시장 가격이 점차 오른다.", "판매자들이 먼저 팔기 위해 경쟁적으로 값을 내린다."], "a": 3, "e": "Khi dư cầu: hàng bị thiếu, người mua cạnh tranh nhau, giá tăng. \"Người bán đua nhau hạ giá\" là hiện tượng của <b>dư cung</b>, nên ④ sai.", "star": false, "img": null}, {"n": 13, "p": "다음 중 수요 곡선을 오른쪽으로 이동시키는 요인이 아닌 것은?", "o": ["소득 증가", "선호도 상승", "보완재 가격 상승", "대체재 가격 상승"], "a": 2, "e": "Giá hàng bổ sung tăng → người ta mua ít hàng này hơn → cầu giảm → đường cầu dịch sang <b>trái</b>. Ba yếu tố còn lại đều làm đường cầu dịch sang phải.", "star": false, "img": null}, {"n": 14, "p": "수요와 공급에 대한 설명으로 옳지 않은 것은?", "o": ["수요가 있으려면 ‘사고 싶은 마음’과 ‘살 수 있는 능력’이 모두 있어야 한다.", "상품 자체의 가격이 변하면 수요 곡선 자체가 이동한다.", "공급 곡선의 우측 이동은 같은 가격에서 더 많이 공급하려는 것을 뜻한다.", "균형 가격에서는 초과 수요도 초과 공급도 없다."], "a": 1, "e": "② sai: giá của chính hàng hóa thay đổi chỉ làm <b>di chuyển dọc theo</b> đường cầu (thay đổi lượng cầu). Đường cầu chỉ <b>dịch chuyển</b> khi các yếu tố ngoài giá thay đổi (thu nhập, sở thích, giá hàng liên quan…).", "star": true, "img": null}, {"n": 15, "p": "공급 곡선을 오른쪽으로 이동시키는 요인을 〈보기〉에서 모두 고른 것은?<div class=\"box\"><div class=\"box-t\">〈보기〉</div><p>ㄱ. 생산 기술의 발달</p><p>ㄴ. 생산 요소 가격의 상승</p><p>ㄷ. 공급자 수의 증가</p><p>ㄹ. 정부 보조금의 증가</p></div>", "o": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "a": 2, "e": "Công nghệ phát triển (ㄱ), số người bán tăng (ㄷ), trợ cấp tăng (ㄹ) → cung tăng, đường cung dịch phải. Giá yếu tố sản xuất tăng (ㄴ) → chi phí tăng → cung giảm, đường cung dịch trái.", "star": false, "img": null}, {"n": 16, "p": "[그림]과 같은 변화가 나타내는 의미로 가장 알맞은 것은?", "o": ["같은 가격에서 소비자들이 더 많이 사려고 한다.", "가격이 올라서 수요량이 줄었다.", "같은 가격에서 기업들이 더 많이 팔려고 한다.", "소비자들의 구매 능력이 줄었다."], "a": 0, "e": "Đường cầu dịch từ D₁ sang D₂ (sang phải): ở <b>cùng mức giá</b>, người tiêu dùng muốn và có khả năng mua nhiều hơn. ③ mô tả đường cung dịch phải.", "star": false, "img": "fig2"}, {"n": 17, "p": "[그림]에 대한 설명으로 옳은 것을 〈보기〉에서 모두 고른 것은?<div class=\"box\"><div class=\"box-t\">〈보기〉</div><p>ㄱ. A → B는 상품 자체의 가격이 내려서 나타난다.</p><p>ㄴ. A → B는 수요 곡선 자체가 이동한 것이다.</p><p>ㄷ. A → C는 소득이 증가하면 나타날 수 있다.</p><p>ㄹ. A → C는 같은 가격에서 수요량이 30만큼 늘어난 것이다.</p></div>", "o": ["ㄱ, ㄴ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ"], "a": 3, "e": "A → B: giá giảm từ 60 xuống 40, điểm di chuyển <b>dọc theo</b> D₁ → ㄱ đúng, ㄴ sai. A → C: ở cùng giá 60, lượng cầu tăng từ 40 lên 70 (tăng 30) → đường cầu dịch sang phải, có thể do thu nhập tăng → ㄷ, ㄹ đúng.", "star": true, "img": "fig3"}, {"n": 18, "p": "다음 빈칸 (가), (나)에 들어갈 말로 알맞은 것은?<div class=\"quote\">“커피와 설탕처럼 함께 사용하는 재화를 (가), 커피와 차처럼 대신 사용할 수 있는 재화를 (나)라고 한다.”</div>", "o": ["(가) 보완재 – (나) 대체재", "(가) 대체재 – (나) 보완재", "(가) 대체재 – (나) 대체재", "(가) 보완재 – (나) 보완재"], "a": 0, "e": "Hàng dùng kèm nhau (cà phê – đường) là <b>hàng bổ sung</b> (보완재). Hàng dùng thay cho nhau (cà phê – trà) là <b>hàng thay thế</b> (대체재).", "star": false, "img": null}, {"n": 19, "p": "다음 중 공급 곡선을 왼쪽으로 이동시키는 것은?", "o": ["생산 기술이 발달했다.", "공급자의 수가 늘었다.", "원자재 가격이 내렸다.", "판매자들이 앞으로 가격이 크게 오를 것이라고 예상한다."], "a": 3, "e": "Người bán dự đoán giá sắp tăng → giữ hàng lại để bán sau với giá cao → cung hiện tại giảm (dịch trái). ①②③ đều làm đường cung dịch phải.", "star": true, "img": null}, {"n": 20, "p": "다음 빈칸 (가), (나)에 들어갈 말로 알맞은 것은?<div class=\"quote\">“수요 곡선은 오른쪽으로, 공급 곡선은 왼쪽으로 동시에 이동하면 균형 가격은 (가), 균형 거래량은 (나).”</div>", "o": ["(가) 반드시 오른다 – (나) 어떻게 될지 알 수 없다", "(가) 반드시 오른다 – (나) 반드시 늘어난다", "(가) 반드시 내린다 – (나) 어떻게 될지 알 수 없다", "(가) 어떻게 될지 알 수 없다 – (나) 반드시 늘어난다"], "a": 0, "e": "Cầu tăng làm giá tăng, cung giảm cũng làm giá tăng → giá <b>chắc chắn tăng</b>. Còn lượng: cầu tăng làm lượng tăng, cung giảm làm lượng giảm → tùy bên nào dịch nhiều hơn, <b>không xác định</b> được.", "star": true, "img": null}, {"n": 21, "p": "가뭄으로 커피 원두 생산량이 감소했다. 커피 원두 시장의 변화를 바르게 나타낸 그래프는?<div class=\"note\">점선: 이동한 후의 곡선, E₁: 처음 균형점, E₂: 새 균형점</div>", "o": ["IMG:o1", "IMG:o2", "IMG:o3", "IMG:o4"], "a": 3, "e": "Hạn hán làm sản lượng giảm → <b>cung giảm</b> → đường cung dịch trái (S → S') → giá tăng, lượng giảm. Đó là hình ④.", "star": false, "img": null}, {"n": 22, "p": "국민들의 소득이 전반적으로 증가했다. 휴대전화 시장의 변화를 바르게 나타낸 그래프는?<div class=\"note\">점선: 이동한 후의 곡선, E₁: 처음 균형점, E₂: 새 균형점</div>", "o": ["IMG:o1", "IMG:o2", "IMG:o3", "IMG:o4"], "a": 0, "e": "Thu nhập tăng → <b>cầu</b> điện thoại <b>tăng</b> → đường cầu dịch phải (D → D') → giá và lượng đều tăng. Đó là hình ①.", "star": false, "img": null}, {"n": 23, "p": "새로운 기술이 개발되어 휴대전화 생산비가 줄었다. 휴대전화 시장의 변화를 바르게 나타낸 그래프는?<div class=\"note\">점선: 이동한 후의 곡선, E₁: 처음 균형점, E₂: 새 균형점</div>", "o": ["IMG:o1", "IMG:o2", "IMG:o3", "IMG:o4"], "a": 2, "e": "Chi phí sản xuất giảm → <b>cung tăng</b> → đường cung dịch phải → giá giảm, lượng tăng. Đó là hình ③.", "star": false, "img": null}, {"n": 24, "p": "휴대전화 통화 요금이 크게 올랐다. 휴대전화 시장의 변화를 바르게 나타낸 그래프는?<div class=\"note\">점선: 이동한 후의 곡선, E₁: 처음 균형점, E₂: 새 균형점</div>", "o": ["IMG:o1", "IMG:o2", "IMG:o3", "IMG:o4"], "a": 1, "e": "Cước gọi là <b>hàng bổ sung</b> của điện thoại. Giá hàng bổ sung tăng → cầu điện thoại giảm → đường cầu dịch trái → giá và lượng đều giảm. Đó là hình ②.", "star": false, "img": null}, {"n": 25, "p": "다음 신문 기사 제목의 의미로 가장 알맞은 것은?<div class=\"quote\">“배추 생산 과잉, 농민들 한숨”</div>", "o": ["배추의 생산량이 부족하여 농민들이 실망했다.", "배추 농사가 잘 되어 농민들이 희망에 차 있다.", "배추가 적게 생산되어 농민들의 기대감이 낮아졌다.", "배추가 필요 이상으로 생산되어 농민들이 힘들어한다."], "a": 3, "e": "“과잉” = dư thừa, nhiều hơn mức cần; “한숨” = thở dài (khó khăn, buồn). → Cải thảo được sản xuất quá nhiều khiến nông dân khốn đốn.", "star": false, "img": null}, {"n": 26, "p": "“배추 생산 과잉, 농민들 한숨”이라는 상황에서 배추 시장에 대한 설명으로 옳은 것은?", "o": ["초과 공급이 생겨 배추 가격이 내려간다.", "초과 수요가 생겨 배추 가격이 올라간다.", "초과 공급이 생겨 배추 가격이 올라간다.", "초과 수요가 생겨 배추 가격이 내려간다."], "a": 0, "e": "Sản xuất dư thừa → lượng cung &gt; lượng cầu → <b>dư cung</b> → giá cải thảo giảm. Vì giá giảm nên nông dân “thở dài”.", "star": false, "img": null}, {"n": 27, "p": "2020년 설 연휴 직후 코로나19가 퍼지면서 마스크 가격이 크게 올랐다. 가장 큰 원인은?", "o": ["마스크의 공급이 크게 늘었다.", "마스크의 수요가 갑자기 크게 늘었다.", "마스크의 수요가 크게 줄었다.", "마스크 생산 기술이 발달했다."], "a": 1, "e": "Covid-19 lan rộng → nhu cầu khẩu trang <b>tăng đột biến</b> (đường cầu dịch phải) → dư cầu → giá tăng vọt.", "star": false, "img": null}, {"n": 28, "p": "2020년 초 크게 올랐던 마스크 가격이 이후 다시 내려간 원인으로 알맞은 것을 〈보기〉에서 모두 고른 것은?<div class=\"box\"><div class=\"box-t\">〈보기〉</div><p>ㄱ. 마스크를 만드는 공장이 늘어났다.</p><p>ㄴ. 정부가 마스크 생산을 지원했다.</p><p>ㄷ. 사람들이 마스크를 더 많이 사고 싶어 했다.</p><p>ㄹ. 해외에서 마스크 수입이 늘었다.</p></div>", "o": ["ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ, ㄹ"], "a": 2, "e": "ㄱ, ㄴ, ㄹ đều làm <b>cung tăng</b> (đường cung dịch phải) → giá giảm. ㄷ làm cầu tăng → giá tăng, nên không phải nguyên nhân giá giảm.", "star": false, "img": null}, {"n": 29, "p": "베트남의 설(뗏) 기간에 많은 식당이 가격을 올리지만 손님은 여전히 많다. 그 이유로 가장 알맞은 것은?", "o": ["설 기간에는 수요 법칙이 적용되지 않기 때문이다.", "정부가 식당 가격을 정해 주기 때문이다.", "외식 수요는 크게 늘고, 문을 여는 식당은 줄어 공급이 감소하기 때문이다.", "식당들의 요리 기술이 발달했기 때문이다."], "a": 2, "e": "Dịp Tết, nhu cầu ăn ngoài tăng mạnh (cầu dịch phải), trong khi nhiều quán nghỉ Tết (cung dịch trái) → giá cân bằng mới cao hơn nhưng vẫn có nhiều khách. Quy luật cầu vẫn đúng, chỉ là cả hai đường đều dịch chuyển.", "star": false, "img": null}, {"n": 30, "p": "돼지고기 가격이 크게 올랐다. 이때 소고기 시장에서 일어날 변화로 가장 알맞은 것은?", "o": ["소고기의 수요 곡선이 오른쪽으로 이동한다.", "소고기의 수요 곡선이 왼쪽으로 이동한다.", "소고기의 공급 곡선이 오른쪽으로 이동한다.", "소고기 시장에는 아무 변화가 없다."], "a": 0, "e": "Thịt heo và thịt bò là <b>hàng thay thế</b>. Giá thịt heo tăng → nhiều người chuyển sang mua thịt bò → cầu thịt bò tăng → đường cầu thịt bò dịch phải.", "star": false, "img": null}, {"n": 31, "p": "가뭄으로 커피 원두 가격이 올랐다. 커피 회사 A는 커피 한 잔의 가격은 그대로 두고, 포장 원두 제품의 가격만 크게 올렸다. 그 이유로 가장 알맞은 것은?", "o": ["커피 한 잔에 대한 수요가 갑자기 크게 늘었기 때문이다.", "포장 원두는 원두 값이 원가의 대부분이지만, 커피 한 잔은 원두 값의 비중이 작고 가격을 올리면 손님을 잃을 수 있기 때문이다.", "포장 원두의 공급이 크게 늘었기 때문이다.", "정부가 커피 한 잔의 가격만 통제하기 때문이다."], "a": 1, "e": "Với một ly cà phê, hạt cà phê chỉ chiếm phần nhỏ chi phí (còn sữa, nhân công, mặt bằng…) và có nhiều quán cạnh tranh, tăng giá dễ mất khách. Với cà phê hạt đóng gói, giá hạt chiếm phần lớn giá vốn nên buộc phải tăng giá.", "star": true, "img": null}, {"n": 32, "p": "한 대학교가 공책을 공동 구매하려고 조사해 보니, 학교가 제시한 가격이 높을수록 공책을 공급하겠다는 사람이 많아졌다. 이 현상을 가장 잘 설명하는 것은?", "o": ["수요 법칙", "공급 법칙", "초과 수요", "수요 곡선의 이동"], "a": 1, "e": "Giá càng cao thì càng nhiều người muốn cung cấp → lượng cung tăng theo giá → đây là <b>quy luật cung</b>.", "star": false, "img": null}, {"n": 33, "p": "베트남 정부가 전기나 휘발유 같은 품목의 가격을 직접 관리하는 이유로 가장 알맞은 것은?", "o": ["이 품목들은 시장에서 항상 초과 공급이 생기기 때문이다.", "기업들의 이윤을 늘려 주기 위해서이다.", "이 품목들에는 수요 법칙이 적용되지 않기 때문이다.", "생활 필수품이라 가격이 비정상적으로 오르면 국민 생활에 큰 피해가 생기고, 시장 기능만으로는 해결하기 어렵기 때문이다."], "a": 3, "e": "Điện, xăng là hàng thiết yếu. Nếu giá tăng bất thường sẽ ảnh hưởng lớn đến đời sống người dân, và cơ chế thị trường (“bàn tay vô hình”) khó tự điều chỉnh kịp → Nhà nước trực tiếp can thiệp, quản lý giá.", "star": false, "img": null}, {"n": 34, "p": "“다음 달에 쌀 가격이 크게 오를 것”이라는 뉴스가 나왔다. 이번 달 쌀 시장의 변화로 가장 알맞은 것은?", "o": ["수요 증가, 공급 감소 → 가격 상승", "수요 감소, 공급 증가 → 가격 하락", "수요 증가, 공급 증가 → 가격 변화 없음", "수요 감소, 공급 감소 → 거래량 증가"], "a": 0, "e": "Người mua muốn mua ngay trước khi giá lên (cầu tăng); người bán muốn giữ hàng để tháng sau bán giá cao (cung giảm). Cả hai đều đẩy giá tháng này tăng lên.", "star": true, "img": null}, {"n": 35, "p": "다음 상황과 그 결과를 연결한 것으로 옳지 않은 것은?", "o": ["전기차 배터리 가격 하락 → 전기차 공급 곡선 우측 이동", "커피 가격 상승 → 설탕 수요 곡선 좌측 이동", "라면 가격 하락으로 라면 수요량 증가 → 라면 수요 곡선 우측 이동", "망고 농장 수 증가 → 망고 공급 곡선 우측 이동"], "a": 2, "e": "③ sai: giá mì giảm làm lượng cầu mì tăng là <b>di chuyển dọc theo</b> đường cầu, không phải đường cầu dịch phải. (② đúng vì cà phê và đường là hàng bổ sung.)", "star": true, "img": null}, {"n": 36, "p": "어떤 빵의 수요 함수가 Qᴰ = 150 − 4P일 때, 가격이 25원이면 수요량은? (P: 가격(원), Q: 수량(개))", "o": ["25개", "40개", "50개", "75개"], "a": 2, "e": "Thay P = 25: Qᴰ = 150 − 4 × 25 = 150 − 100 = <b>50</b> (cái).", "star": false, "img": null}, {"n": 37, "p": "우산의 공급 함수가 Qˢ = 10 + 3P일 때, 가격이 15원이면 공급량은? (P: 가격(원), Q: 수량(개))", "o": ["45개", "55개", "60개", "65개"], "a": 1, "e": "Thay P = 15: Qˢ = 10 + 3 × 15 = 10 + 45 = <b>55</b> (cái).", "star": false, "img": null}, {"n": 38, "p": "떡볶이 시장의 수요 함수와 공급 함수가 다음과 같을 때, 균형 가격은? (P: 가격(원), Q: 수량(인분))<div class=\"formula\">Qᴰ = 90 − 2P　　Qˢ = 3P − 10</div>", "o": ["10원", "15원", "20원", "25원"], "a": 2, "e": "Cân bằng khi Qᴰ = Qˢ: 90 − 2P = 3P − 10 → 100 = 5P → <b>P = 20</b> (원). (Khi đó Q = 50.)", "star": false, "img": null}, {"n": 39, "p": "볼펜 시장의 수요 함수와 공급 함수가 다음과 같을 때, 균형 거래량은? (P: 가격(원), Q: 수량(개))<div class=\"formula\">Qᴰ = 200 − 5P　　Qˢ = 20 + 4P</div>", "o": ["60개", "80개", "90개", "100개"], "a": 3, "e": "200 − 5P = 20 + 4P → 180 = 9P → P = 20. Thay vào: Q = 200 − 5 × 20 = <b>100</b> (cái).", "star": false, "img": null}, {"n": 40, "p": "생수 시장의 수요 함수와 공급 함수가 다음과 같다. 가격이 10원일 때의 시장 상황으로 옳은 것은? (P: 가격(원), Q: 수량(병))<div class=\"formula\">Qᴰ = 100 − 4P　　Qˢ = 10 + 2P</div>", "o": ["초과 수요 30병", "초과 공급 30병", "초과 수요 20병", "균형 상태"], "a": 0, "e": "Tại P = 10: Qᴰ = 100 − 40 = 60, Qˢ = 10 + 20 = 30 → Qᴰ &gt; Qˢ → <b>dư cầu 30 chai</b>.", "star": false, "img": null}, {"n": 41, "p": "아이스크림 시장의 수요 함수와 공급 함수가 다음과 같다. 가격이 45원일 때의 시장 상황으로 옳은 것은? (P: 가격(원), Q: 수량(개))<div class=\"formula\">Qᴰ = 70 − P　　Qˢ = 2P − 20</div>", "o": ["초과 수요 45개", "초과 공급 25개", "초과 수요 25개", "초과 공급 45개"], "a": 3, "e": "Tại P = 45: Qᴰ = 70 − 45 = 25, Qˢ = 90 − 20 = 70 → Qˢ &gt; Qᴰ → <b>dư cung 70 − 25 = 45 cái</b>.", "star": false, "img": null}, {"n": 42, "p": "다음은 김밥 시장의 가격별 수요량과 공급량이다. 균형 가격과 균형 거래량은?<div class=\"tw\"><table class=\"dt\"><tr><th>가격(원)</th><th>1,000</th><th>1,500</th><th>2,000</th><th>2,500</th><th>3,000</th></tr><tr><th>수요량(줄)</th><td>800</td><td>700</td><td>600</td><td>500</td><td>400</td></tr><tr><th>공급량(줄)</th><td>200</td><td>400</td><td>600</td><td>800</td><td>1,000</td></tr></table></div>", "o": ["1,500원, 700줄", "2,000원, 600줄", "2,000원, 800줄", "2,500원, 500줄"], "a": 1, "e": "Tìm cột có lượng cầu = lượng cung: tại 2.000 원 cả hai đều là 600 → giá cân bằng <b>2.000 원</b>, lượng cân bằng <b>600 cuộn</b>.", "star": false, "img": null}, {"n": 43, "p": "다음은 우유 시장의 가격별 수요량과 공급량이다. 가격이 600원일 때의 시장 상황으로 옳은 것은?<div class=\"tw\"><table class=\"dt\"><tr><th>가격(원)</th><th>400</th><th>600</th><th>800</th><th>1,000</th><th>1,200</th></tr><tr><th>수요량(개)</th><td>1,300</td><td>1,100</td><td>900</td><td>700</td><td>500</td></tr><tr><th>공급량(개)</th><td>100</td><td>300</td><td>500</td><td>700</td><td>900</td></tr></table></div>", "o": ["초과 수요 800개", "초과 공급 800개", "초과 수요 1,100개", "초과 공급 300개"], "a": 0, "e": "Tại 600 원: lượng cầu 1.100, lượng cung 300 → <b>dư cầu 1.100 − 300 = 800</b>.", "star": false, "img": null}, {"n": 44, "p": "[그림]은 귤 시장을 나타낸 것이다. 가격이 80원일 때의 시장 상황과 앞으로의 가격 변화를 바르게 짝지은 것은?", "o": ["초과 수요 40kg – 가격 상승", "초과 공급 40kg – 가격 상승", "초과 공급 40kg – 가격 하락", "초과 공급 60kg – 가격 하락"], "a": 2, "e": "Đọc đồ thị tại giá 80: lượng cầu 20kg, lượng cung 60kg → <b>dư cung 40kg</b> → người bán hạ giá → giá giảm dần về mức cân bằng 60 원.", "star": false, "img": "q44"}, {"n": 45, "p": "영화 티켓이 8,000원일 때 하루 수요량은 500장이었다. 인기 배우가 출연한다는 소식에 모든 가격에서 수요량이 30% 증가했다. 가격이 8,000원일 때 새로운 수요량은?", "o": ["530장", "600장", "630장", "650장"], "a": 3, "e": "Tăng 30%: 500 × 1,3 = 500 + 150 = <b>650</b> (vé).", "star": false, "img": null}, {"n": 46, "p": "자전거 시장의 수요 함수는 Qᴰ = 300 − 2P, 공급 함수는 Qˢ = 3P − 200이다. 건강 열풍으로 모든 가격에서 수요량이 50대씩 늘었다. 가격이 처음 균형 가격에 그대로 머문다면 시장에서 어떤 일이 일어나는가? (P: 가격(만 원), Q: 수량(대))", "o": ["초과 수요 50대가 생겨 가격이 오른다.", "초과 공급 50대가 생겨 가격이 내린다.", "초과 수요 150대가 생겨 가격이 오른다.", "균형 상태이므로 가격은 변하지 않는다."], "a": 0, "e": "Cân bằng ban đầu: 300 − 2P = 3P − 200 → P = 100 (Q = 100). Cầu mới: Qᴰ = 350 − 2P. Tại P = 100: Qᴰ = 150, Qˢ = 100 → <b>dư cầu 50 chiếc</b> → giá tăng.", "star": true, "img": null}, {"n": 47, "p": "[그림]은 텀블러 시장의 수요 곡선이 D₁에서 D₂로 이동한 모습이다. 새로운 균형 가격은?", "o": ["15,000원", "20,000원", "25,000원", "30,000원"], "a": 2, "e": "Đọc đồ thị: D₂ cắt S tại giá 25 (nghìn 원), lượng 60 → <b>25.000 원</b>. Kiểm tra: D₂: Q = 160 − 4P, S: Q = 4P − 40 → 160 − 4P = 4P − 40 → P = 25.", "star": false, "img": "q47"}, {"n": 48, "p": "다음은 사과의 가격별 수요량이다. 이를 수요 함수로 바르게 나타낸 것은?<div class=\"tw\"><table class=\"dt\"><tr><th>가격(원)</th><th>10</th><th>20</th><th>30</th><th>40</th></tr><tr><th>수요량(개)</th><td>160</td><td>120</td><td>80</td><td>40</td></tr></table></div>", "o": ["Qᴰ = 160 − 4P", "Qᴰ = 200 − 4P", "Qᴰ = 200 + 4P", "Qᴰ = 240 − 2P"], "a": 1, "e": "Giá tăng 10 thì lượng cầu giảm 40 → b = −40 ÷ 10 = −4. Thay P = 10, Q = 160: a − 40 = 160 → a = 200 → <b>Qᴰ = 200 − 4P</b>.", "star": false, "img": null}, {"n": 49, "p": "콜라 시장의 수요 함수는 Qᴰ = 60 − P, 공급 함수는 Qˢ = 2P이다. 무더위로 모든 가격에서 수요량이 30개씩 늘었다. 새로운 균형 가격과 균형 거래량은? (P: 가격(원), Q: 수량(개))", "o": ["P = 30원, Q = 60개", "P = 20원, Q = 40개", "P = 30원, Q = 70개", "P = 25원, Q = 65개"], "a": 0, "e": "Cầu mới: Qᴰ = 90 − P. Cân bằng: 90 − P = 2P → 3P = 90 → <b>P = 30, Q = 60</b>. (② là cân bằng cũ trước khi cầu tăng.)", "star": true, "img": null}, {"n": 50, "p": "감자 시장의 수요 함수는 Qᴰ = 140 − 3P, 공급 함수는 Qˢ = 40 + 2P이다. 풍년으로 모든 가격에서 공급량이 25개씩 늘었다. 처음 균형과 비교한 변화로 옳은 것은? (P: 가격(원), Q: 수량(개))", "o": ["가격 5원 상승, 거래량 15개 감소", "가격 5원 하락, 거래량 25개 증가", "가격은 그대로, 거래량 25개 증가", "가격 5원 하락, 거래량 15개 증가"], "a": 3, "e": "Ban đầu: 140 − 3P = 40 + 2P → P = 20, Q = 80. Sau khi cung tăng: Qˢ = 65 + 2P → 140 − 3P = 65 + 2P → P = 15, Q = 95. → <b>Giá giảm 5, lượng tăng 15</b>. (Lượng không tăng đủ 25 vì giá giảm làm lượng cung giảm bớt.)", "star": true, "img": null}]}, {"key": "b2", "tab": "Bài 2. Hành vi người tiêu dùng (소비자 선택)", "short": "Bài 2", "ko": "소비자 선택", "eyebrow": "Bài 2 · Hành vi người tiêu dùng", "qs": [{"n": 1, "p": "소비자가 재화나 서비스를 소비하면서 얻는 만족감을 무엇이라고 하는가?", "o": ["효용", "수요", "예산", "가격"], "a": 0, "e": "Hữu dụng (효용) là mức độ thỏa mãn mà người tiêu dùng nhận được khi tiêu dùng hàng hóa, dịch vụ.", "star": false, "img": null}, {"n": 2, "p": "다음 빈칸에 들어갈 말로 알맞은 것은?<div class=\"quote\">“소비량이 늘어날수록 추가로 얻는 한계 효용이 점차 감소하는 것을 (　　　)이라고 한다.”</div>", "o": ["수요 법칙", "공급 법칙", "한계 효용 체감의 법칙", "효용 극대화의 원칙"], "a": 2, "e": "Tiêu dùng càng nhiều thì phần thỏa mãn tăng thêm (hữu dụng biên) càng giảm → đó là <b>quy luật hữu dụng biên giảm dần</b> (한계 효용 체감의 법칙).", "star": false, "img": null}, {"n": 3, "p": "총효용(TU)에 대한 설명으로 옳은 것은?", "o": ["같은 양을 소비하면 누구나 같은 총효용을 얻는다.", "일정 기간 동안 재화나 서비스를 소비해서 얻는 만족감의 총량이다.", "마지막 한 단위를 소비할 때 추가로 얻는 만족감이다.", "재화의 가격이 높을수록 항상 커진다."], "a": 1, "e": "Tổng hữu dụng là <b>tổng mức thỏa mãn</b> khi tiêu dùng hàng hóa trong một khoảng thời gian. ① sai vì hữu dụng mang tính chủ quan; ③ là định nghĩa của hữu dụng biên; ④ hữu dụng không phụ thuộc vào giá.", "star": false, "img": null}, {"n": 4, "p": "다음 빈칸에 들어갈 말로 알맞은 것은?<div class=\"quote\">“같은 양의 같은 물건이라도 사람에 따라 얻는 만족감이 다를 수 있으므로 총효용은 (　　　) 성격을 가진다.”</div>", "o": ["객관적인", "고정적인", "사회적인", "주관적인"], "a": 3, "e": "Cùng một món hàng, cùng số lượng nhưng mỗi người cảm nhận mức thỏa mãn khác nhau → tổng hữu dụng mang tính <b>chủ quan</b> (주관적).", "star": false, "img": null}, {"n": 5, "p": "경제 용어와 그 뜻을 바르게 연결한 것은?<div class=\"tw\"><table class=\"dt\"><tr><th>용어</th><th>뜻</th></tr><tr><td>가. 총효용</td><td>A. 소득을 모두 사용했을 때 살 수 있는 상품 묶음을 나타낸 선</td></tr><tr><td>나. 한계 효용</td><td>B. 소비를 한 단위 늘릴 때 추가로 얻는 만족도</td></tr><tr><td>다. 예산선</td><td>C. 일정 기간 동안 소비로 얻는 만족감의 총량</td></tr></table></div>", "o": ["가-A, 나-B, 다-C", "가-B, 나-C, 다-A", "가-C, 나-A, 다-B", "가-C, 나-B, 다-A"], "a": 3, "e": "총효용 = tổng mức thỏa mãn (C); 한계 효용 = mức thỏa mãn tăng thêm khi tiêu dùng thêm 1 đơn vị (B); 예산선 = đường biểu thị các giỏ hàng mua được khi tiêu hết thu nhập (A).", "star": false, "img": null}, {"n": 6, "p": "다음 빈칸 (가), (나)에 들어갈 말로 알맞은 것은?<div class=\"quote\">“효용을 측정하는 방법에는 만족도를 (가)해서 표현하는 한계 효용 이론과, 만족도의 (나)를 비교하는 무차별 곡선 이론이 있다.”</div>", "o": ["(가) 수치화 – (나) 순서", "(가) 순서 – (나) 수치화", "(가) 수치화 – (나) 가격", "(가) 가격 – (나) 순서"], "a": 0, "e": "Lý thuyết hữu dụng biên đo mức thỏa mãn bằng <b>con số</b> (수치화). Lý thuyết đường bàng quan chỉ so sánh <b>thứ tự</b> (순서) mức thỏa mãn.", "star": false, "img": null}, {"n": 7, "p": "한계 효용(MU)과 총효용(TU)의 관계로 옳은 것은?", "o": ["MU &gt; 0이면 TU는 감소한다.", "MU = 0이면 TU는 가장 크다(극대).", "MU &lt; 0이면 TU는 증가한다.", "MU를 모두 더해도 TU가 되지 않는다."], "a": 1, "e": "MU &gt; 0 → TU tăng; <b>MU = 0 → TU đạt cực đại</b>; MU &lt; 0 → TU giảm. Cộng tất cả MU lại sẽ được TU.", "star": false, "img": null}, {"n": 8, "p": "한계 효용 체감의 법칙에 따르면 한계 효용 곡선은 일반적으로 어떤 모양인가?", "o": ["오른쪽 위로 올라가는 모양", "가로로 평평한 모양", "오른쪽 아래로 내려가는 모양", "세로로 곧은 모양"], "a": 2, "e": "Tiêu dùng càng nhiều thì MU càng nhỏ → đường hữu dụng biên <b>dốc xuống</b> sang phải.", "star": false, "img": null}, {"n": 9, "p": "다음 빈칸에 들어갈 말로 알맞은 것은?<div class=\"quote\">“무차별 곡선은 소비자에게 (　　　) 만족감을 주는 상품 묶음들을 연결한 곡선이다.”</div>", "o": ["가장 큰", "동일한", "가장 작은", "서로 다른"], "a": 1, "e": "Đường bàng quan nối các giỏ hàng mang lại mức thỏa mãn <b>như nhau</b> (동일한) cho người tiêu dùng.", "star": false, "img": null}, {"n": 10, "p": "무차별 곡선의 특징으로 옳지 않은 것은?", "o": ["원점에서 멀어질수록 소비자의 만족도가 높다.", "흔히 오른쪽 아래로 내려가는 형태를 가진다.", "두 무차별 곡선은 서로 교차할 수 있다.", "같은 곡선 위의 점들은 만족도가 같다."], "a": 2, "e": "③ sai: hai đường bàng quan <b>không bao giờ cắt nhau</b>. Các ý còn lại đều là đặc điểm đúng của đường bàng quan.", "star": false, "img": null}, {"n": 11, "p": "[그림]은 한 소비자의 무차별 곡선이다. 이에 대한 설명으로 옳은 것은?", "o": ["A의 만족도가 가장 높다.", "B가 D보다 만족도가 높다.", "C의 만족도가 가장 낮다.", "B와 D의 만족도는 같다."], "a": 3, "e": "B và D cùng nằm trên U₂ nên mức thỏa mãn bằng nhau. Thứ tự: C (U₃) &gt; B = D (U₂) &gt; A (U₁). Đường càng xa gốc tọa độ thì thỏa mãn càng cao.", "star": false, "img": "c11"}, {"n": 12, "p": "[그림]의 (가), (나)와 같은 무차별 곡선을 가지는 재화의 예를 바르게 짝지은 것은?", "o": ["(가) 1,000원 지폐와 5,000원 지폐 – (나) 왼쪽 장갑과 오른쪽 장갑", "(가) 왼쪽 장갑과 오른쪽 장갑 – (나) 1,000원 지폐와 5,000원 지폐", "(가) 커피와 설탕 – (나) 볼펜과 연필", "(가) 왼쪽 장갑과 오른쪽 장갑 – (나) 왼쪽 운동화와 오른쪽 운동화"], "a": 0, "e": "(가) đường thẳng dốc xuống = <b>hàng thay thế hoàn hảo</b> (vd: tờ 1.000 원 và tờ 5.000 원). (나) hình chữ L = <b>hàng bổ sung hoàn hảo</b> (vd: găng tay trái và găng tay phải).", "star": false, "img": "c12"}, {"n": 13, "p": "주어진 예산과 가격 상황에 맞게 소비자가 구입할 수 있는 재화들의 조합을 무엇이라고 하는가?", "o": ["무차별 곡선", "총효용", "예산 제약", "한계 효용"], "a": 2, "e": "Tập hợp các giỏ hàng người tiêu dùng có thể mua với ngân sách và giá cho trước gọi là <b>ràng buộc ngân sách</b> (예산 제약).", "star": false, "img": null}, {"n": 14, "p": "예산선 식 PₓX + PᵧY = I에서 I가 뜻하는 것은?", "o": ["X재의 가격", "Y재의 수량", "효용", "소득"], "a": 3, "e": "Trong PₓX + PᵧY = I: Pₓ, Pᵧ là giá; X, Y là số lượng; <b>I là thu nhập</b> (Income, 소득).", "star": false, "img": null}, {"n": 15, "p": "소비자의 최적 선택에 대한 설명으로 옳은 것은?", "o": ["예산선 바깥쪽의 점에서 이루어진다.", "가장 낮은 무차별 곡선 위에서 이루어진다.", "예산선과 가장 높은 무차별 곡선이 만나는 접점에서 이루어진다.", "소득과 관계없이 정해진다."], "a": 2, "e": "Lựa chọn tối ưu là <b>điểm tiếp xúc</b> giữa đường ngân sách và đường bàng quan cao nhất có thể đạt tới.", "star": false, "img": null}, {"n": 16, "p": "한계 효용 이론에 대한 설명으로 옳은 것을 〈보기〉에서 모두 고른 것은?<div class=\"box\"><div class=\"box-t\">〈보기〉</div><p>ㄱ. 첫 번째 햄버거보다 두 번째 햄버거에서 얻는 추가 만족감이 더 작다.</p><p>ㄴ. 소비량이 늘면 총효용은 항상 증가한다.</p><p>ㄷ. 한계 효용이 마이너스(−)가 되면 총효용은 감소한다.</p><p>ㄹ. 한계 효용을 모두 더하면 총효용이 된다.</p></div>", "o": ["ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "a": 2, "e": "ㄱ đúng (hữu dụng biên giảm dần), ㄷ đúng, ㄹ đúng. ㄴ sai: khi MU âm thì tổng hữu dụng <b>giảm</b>, nên không phải lúc nào cũng tăng.", "star": true, "img": null}, {"n": 17, "p": "[그림]은 총효용 곡선이다. 옳은 것을 〈보기〉에서 모두 고른 것은?<div class=\"box\"><div class=\"box-t\">〈보기〉</div><p>ㄱ. A점에서 한계 효용은 0보다 크다.</p><p>ㄴ. B점에서 한계 효용은 0이다.</p><p>ㄷ. C점에서 한계 효용은 0보다 크다.</p><p>ㄹ. B점을 지나 소비를 더 늘리면 총효용이 줄어든다.</p></div>", "o": ["ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], "a": 0, "e": "A: TU đang tăng → MU &gt; 0 (ㄱ đúng). B: TU cực đại → MU = 0 (ㄴ đúng). C: TU đang giảm → MU &lt; 0 (ㄷ sai). Qua B mà tiêu dùng thêm thì TU giảm (ㄹ đúng).", "star": true, "img": "c17"}, {"n": 18, "p": "두 무차별 곡선이 서로 교차할 수 없는 이유로 가장 알맞은 것은?", "o": ["소득이 한정되어 있기 때문이다.", "교차하면 만족도가 다른 두 조합이 같은 만족도를 갖게 되어 모순이 생기기 때문이다.", "두 재화의 가격이 서로 다르기 때문이다.", "한계 효용이 항상 0보다 크기 때문이다."], "a": 1, "e": "Nếu hai đường cắt nhau, giao điểm vừa có mức thỏa mãn của đường này vừa của đường kia → hai giỏ hàng có mức thỏa mãn khác nhau lại thành bằng nhau. Đó là <b>mâu thuẫn</b>.", "star": true, "img": null}, {"n": 19, "p": "예산선에 대한 설명으로 옳지 않은 것은?", "o": ["소득을 전부 사용했을 때 살 수 있는 상품 묶음을 나타낸다.", "예산선 위의 모든 점은 드는 돈이 같다.", "예산선 안쪽의 점에서는 소득이 남는다.", "예산선 바깥쪽의 점은 지금 소득으로 살 수 있다."], "a": 3, "e": "④ sai: điểm nằm <b>ngoài</b> đường ngân sách cần nhiều tiền hơn thu nhập nên hiện tại không mua được.", "star": false, "img": null}, {"n": 20, "p": "다음 빈칸 (가), (나)에 들어갈 말로 알맞은 것은? (다른 조건은 같음)<div class=\"quote\">“소득이 늘어나면 예산선은 (가)으로 이동하고, X재의 가격만 오르면 X재를 최대로 살 수 있는 양이 (나).”</div>", "o": ["(가) 바깥쪽 – (나) 줄어든다", "(가) 안쪽 – (나) 줄어든다", "(가) 바깥쪽 – (나) 늘어난다", "(가) 안쪽 – (나) 늘어난다"], "a": 0, "e": "Thu nhập tăng → đường ngân sách dịch song song <b>ra ngoài</b> (바깥쪽). Giá X tăng → lượng X mua tối đa (I/Pₓ) <b>giảm</b>.", "star": true, "img": null}, {"n": 21, "p": "더운 날 운동을 한 후 물을 마셨다. 첫 번째 컵은 아주 시원하고 좋았지만, 다섯 번째 컵은 별로 마시고 싶지 않았다. 이 상황과 가장 관계가 깊은 것은?", "o": ["공급 법칙", "예산 제약", "완전보완재", "한계 효용 체감의 법칙"], "a": 3, "e": "Uống càng nhiều, cốc sau mang lại thỏa mãn tăng thêm ít hơn cốc trước → <b>quy luật hữu dụng biên giảm dần</b>.", "star": false, "img": null}, {"n": 22, "p": "민수는 매운 떡볶이를 아주 좋아하지만, 지영은 매운 음식을 싫어한다. 두 사람이 같은 떡볶이 1인분을 먹었을 때에 대한 설명으로 옳은 것은?", "o": ["두 사람이 얻는 효용은 다를 수 있다.", "두 사람이 얻는 효용은 반드시 같다.", "지영이 얻는 효용이 더 크다.", "떡볶이 가격이 같으므로 효용도 같다."], "a": 0, "e": "Hữu dụng mang tính <b>chủ quan</b>: cùng một suất tteokbokki nhưng người thích cay và người ghét cay nhận được mức thỏa mãn khác nhau.", "star": false, "img": null}, {"n": 23, "p": "무료 피자 행사에서 한 학생이 피자를 먹을 때 얻는 총효용은 다음과 같다. 총효용이 가장 클 때는 몇 조각을 먹었을 때인가?<div class=\"tw\"><table class=\"dt\"><tr><th>피자(조각)</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr><tr><th>총효용</th><td>12</td><td>22</td><td>30</td><td>35</td><td>37</td><td>36</td></tr></table></div>", "o": ["3조각", "4조각", "5조각", "6조각"], "a": 2, "e": "Tổng hữu dụng lớn nhất là <b>37 khi ăn 5 miếng</b>. Miếng thứ 6 có MU = 36 − 37 = −1 nên TU giảm.", "star": false, "img": null}, {"n": 24, "p": "지훈은 커피를 3잔까지는 즐겁게 마시지만, 4번째 잔을 마시면 머리가 아프고 기분이 나빠진다. 4번째 잔의 한계 효용으로 알맞은 것은?", "o": ["0보다 크다.", "0보다 작다.", "0이다.", "총효용과 같다."], "a": 1, "e": "Uống ly thứ 4 làm mức thỏa mãn giảm đi (đau đầu, khó chịu) → <b>MU &lt; 0</b>.", "star": false, "img": null}, {"n": 25, "p": "하린에게 A 회사 생수(X재)와 B 회사 생수(Y재)는 맛과 크기가 완전히 같아서, 어느 것을 마셔도 상관없다. 하린의 무차별 곡선으로 알맞은 것은?", "o": ["IMG:i25a", "IMG:i25b", "IMG:i25c", "IMG:i25d"], "a": 2, "e": "Hai loại nước giống hệt nhau, dùng loại nào cũng được → <b>hàng thay thế hoàn hảo</b> → đường bàng quan là đường thẳng dốc xuống (hình ③).", "star": false, "img": null}, {"n": 26, "p": "텀블러의 몸체(X재)와 뚜껑(Y재)은 항상 1개씩 함께 있어야 사용할 수 있다. 이때의 무차별 곡선으로 알맞은 것은?", "o": ["IMG:i25a", "IMG:i25b", "IMG:i25c", "IMG:i25d"], "a": 0, "e": "Thân và nắp bình luôn phải đi kèm theo tỉ lệ 1:1 → <b>hàng bổ sung hoàn hảo</b> → đường bàng quan hình chữ L (hình ①).", "star": false, "img": null}, {"n": 27, "p": "[그림]에서 점 A(빵 2개, 우유 8개)와 점 B(빵 6개, 우유 3개)는 같은 무차별 곡선 위에 있다. 이 소비자에 대한 설명으로 옳은 것은?", "o": ["A를 B보다 더 좋아한다.", "A와 B를 똑같이 좋아한다.", "B를 A보다 더 좋아한다.", "A와 B는 비교할 수 없다."], "a": 1, "e": "A và B nằm trên <b>cùng một đường bàng quan</b> nên người tiêu dùng thích chúng như nhau.", "star": false, "img": "c27"}, {"n": 28, "p": "[그림]은 한 소비자의 예산선이다. 옳은 것을 〈보기〉에서 모두 고른 것은?<div class=\"box\"><div class=\"box-t\">〈보기〉</div><p>ㄱ. A는 소득이 남는 조합이다.</p><p>ㄴ. B는 소득을 모두 사용하는 조합이다.</p><p>ㄷ. C는 지금 소득으로 살 수 있다.</p><p>ㄹ. 소득이 충분히 늘어나면 C도 살 수 있다.</p></div>", "o": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄹ"], "a": 3, "e": "A nằm trong đường ngân sách → còn dư tiền (ㄱ đúng). B nằm trên đường → tiêu hết thu nhập (ㄴ đúng). C nằm ngoài → hiện chưa mua được (ㄷ sai), nhưng nếu thu nhập tăng đủ thì mua được (ㄹ đúng).", "star": false, "img": "c28"}, {"n": 29, "p": "한 학생이 아르바이트 월급으로 커피와 빵을 산다. 월급이 올랐을 때(커피와 빵의 가격은 그대로) 예산선의 변화로 알맞은 것은?<div class=\"note\">실선: 처음 예산선, 점선: 변화 후 예산선</div>", "o": ["IMG:i29a", "IMG:i29b", "IMG:i29c", "IMG:i29d"], "a": 0, "e": "Lương tăng, giá không đổi → đường ngân sách <b>dịch song song ra ngoài</b> (hình ①).", "star": false, "img": null}, {"n": 30, "p": "한 학생이 용돈으로 커피와 빵을 산다. 빵 가격과 용돈은 그대로이고 커피 가격만 올랐을 때, 예산선의 변화로 알맞은 것은?<div class=\"note\">실선: 처음 예산선, 점선: 변화 후 예산선</div>", "o": ["IMG:i29a", "IMG:i29b", "IMG:i29c", "IMG:i29d"], "a": 2, "e": "Chỉ giá cà phê tăng → lượng cà phê mua tối đa giảm (điểm chặn trên trục cà phê dịch vào trong), còn lượng bánh mì tối đa không đổi → đường ngân sách <b>xoay vào trong</b> quanh điểm trên trục bánh mì (hình ③).", "star": true, "img": null}, {"n": 31, "p": "한 학생이 용돈으로 커피와 빵을 산다. 부모님이 주시는 용돈이 줄었을 때(커피와 빵의 가격은 그대로) 예산선의 변화로 알맞은 것은?<div class=\"note\">실선: 처음 예산선, 점선: 변화 후 예산선</div>", "o": ["IMG:i29a", "IMG:i29b", "IMG:i29c", "IMG:i29d"], "a": 1, "e": "Tiền tiêu vặt giảm, giá không đổi → đường ngân sách <b>dịch song song vào trong</b> (hình ②).", "star": false, "img": null}, {"n": 32, "p": "[그림]에서 이 소비자가 선택할 가장 좋은 점(최적 선택)은?", "o": ["A", "B", "C", "E"], "a": 3, "e": "A nằm trên U₁ thấp hơn; B còn dư tiền; C nằm ngoài đường ngân sách nên không mua được. <b>E là điểm tiếp xúc</b> giữa đường ngân sách và U₂ → lựa chọn tối ưu.", "star": false, "img": "c32"}, {"n": 33, "p": "뷔페 식당에서는 돈을 미리 냈기 때문에 더 먹어도 돈이 들지 않는다. 총효용을 가장 크게 하려면 언제 그만 먹어야 하는가?", "o": ["총효용이 0이 될 때", "한계 효용이 0이 될 때", "한계 효용이 가장 클 때", "첫 번째 접시를 다 먹었을 때"], "a": 1, "e": "Khi MU &gt; 0 thì TU còn tăng; khi <b>MU = 0 thì TU đạt cực đại</b>. Ăn thêm nữa MU &lt; 0 và TU giảm → nên dừng khi MU = 0.", "star": true, "img": null}, {"n": 34, "p": "다음 속담과 가장 관계가 깊은 것은?<div class=\"quote\">“같은 값이면 다홍치마” (같은 가격이면 더 좋은 것을 고른다는 뜻)</div>", "o": ["효용 극대화의 원칙", "한계 효용 체감의 법칙", "완전보완재", "공급 법칙"], "a": 0, "e": "“같은 값이면 다홍치마”: cùng giá thì chọn thứ tốt hơn → chọn phương án mang lại thỏa mãn lớn nhất trong cùng ngân sách = <b>nguyên tắc tối đa hóa hữu dụng</b>.", "star": false, "img": null}, {"n": 35, "p": "다음 상황과 관련 개념을 연결한 것으로 옳지 않은 것은?", "o": ["배가 고플 때 먹는 첫 번째 빵이 가장 맛있다. → 한계 효용 체감의 법칙", "왼쪽 신발만 하나 더 생겨도 만족도가 늘지 않는다. → 완전보완재", "용돈이 줄어서 예전보다 적게 산다. → 예산선이 안쪽으로 이동", "같은 무차별 곡선 위의 두 조합 중 하나를 더 좋아한다. → 무차별 곡선의 특징"], "a": 3, "e": "④ sai: các giỏ hàng trên cùng một đường bàng quan có mức thỏa mãn <b>như nhau</b>, nên không thể thích giỏ này hơn giỏ kia.", "star": true, "img": null}, {"n": 36, "p": "다음은 사과를 먹을 때의 총효용이다. 세 번째 사과의 한계 효용은?<div class=\"tw\"><table class=\"dt\"><tr><th>수량(개)</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><th>총효용</th><td>0</td><td>15</td><td>27</td><td>36</td><td>42</td></tr></table></div>", "o": ["6", "9", "12", "36"], "a": 1, "e": "MU₃ = TU₃ − TU₂ = 36 − 27 = <b>9</b>.", "star": false, "img": null}, {"n": 37, "p": "어떤 소비자가 귤을 먹을 때 한계 효용이 차례대로 20, 16, 12, 8이었다. 귤 4개를 먹었을 때의 총효용은?", "o": ["8", "48", "56", "64"], "a": 2, "e": "TU = tổng các MU = 20 + 16 + 12 + 8 = <b>56</b>.", "star": false, "img": null}, {"n": 38, "p": "다음 표의 빈칸 (가), (나)에 들어갈 숫자로 알맞은 것은?<div class=\"tw\"><table class=\"dt\"><tr><th>수량(개)</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>총효용(TU)</th><td>14</td><td>26</td><td>(가)</td><td>42</td><td>46</td></tr><tr><th>한계 효용(MU)</th><td>14</td><td>12</td><td>9</td><td>(나)</td><td>4</td></tr></table></div>", "o": ["(가) 35 – (나) 7", "(가) 35 – (나) 9", "(가) 33 – (나) 9", "(가) 38 – (나) 4"], "a": 0, "e": "(가) = TU₂ + MU₃ = 26 + 9 = <b>35</b>; (나) = TU₄ − TU₃ = 42 − 35 = <b>7</b>.", "star": false, "img": null}, {"n": 39, "p": "빵을 먹을 때 한계 효용이 다음과 같다. 빵 5개를 먹었을 때의 총효용은?<div class=\"tw\"><table class=\"dt\"><tr><th>수량(개)</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>한계 효용</th><td>9</td><td>6</td><td>3</td><td>0</td><td>−3</td></tr></table></div>", "o": ["12", "15", "18", "21"], "a": 1, "e": "TU = 9 + 6 + 3 + 0 + (−3) = <b>15</b>. Chú ý: quên cộng −3 sẽ ra 18, cộng nhầm thành +3 sẽ ra 21.", "star": false, "img": null}, {"n": 40, "p": "소득이 60,000원이고 떡의 가격은 3,000원, 음료의 가격은 2,000원이다. 소득을 모두 떡을 사는 데 쓴다면 떡을 최대 몇 개 살 수 있는가?", "o": ["20개", "30개", "40개", "60개"], "a": 0, "e": "60.000 ÷ 3.000 = <b>20</b> cái. (30 là số đồ uống mua được nếu chỉ mua đồ uống.)", "star": false, "img": null}, {"n": 41, "p": "소득이 50,000원이고, 공책(X)의 가격은 2,500원, 볼펜(Y)의 가격은 1,000원이다. 예산선 식으로 알맞은 것은?", "o": ["1,000X + 2,500Y = 50,000", "2,500X − 1,000Y = 50,000", "50,000X + 2,500Y = 1,000", "2,500X + 1,000Y = 50,000"], "a": 3, "e": "Dạng PₓX + PᵧY = I → <b>2.500X + 1.000Y = 50.000</b>.", "star": false, "img": null}, {"n": 42, "p": "소득이 30,000원이고, 빵의 가격은 3,000원, 우유의 가격은 1,500원이다. 빵을 4개 사고 남은 돈으로 우유를 최대 몇 개 살 수 있는가?", "o": ["8개", "10개", "12개", "16개"], "a": 2, "e": "Mua 4 bánh mì hết 3.000 × 4 = 12.000 원, còn 18.000 원 → 18.000 ÷ 1.500 = <b>12</b> hộp sữa.", "star": false, "img": null}, {"n": 43, "p": "[그림]은 소득이 90,000원인 소비자의 예산선이다. X재와 Y재의 가격은?", "o": ["X재 6,000원, Y재 3,000원", "X재 3,000원, Y재 6,000원", "X재 3,000원, Y재 3,000원", "X재 2,000원, Y재 6,000원"], "a": 1, "e": "Pₓ = 90.000 ÷ 30 = <b>3.000 원</b>; Pᵧ = 90.000 ÷ 15 = <b>6.000 원</b>.", "star": false, "img": "c43"}, {"n": 44, "p": "소득이 48,000원이고, 도넛(X)의 가격은 2,000원, 주스(Y)의 가격은 3,000원이다. 소득을 남김없이 모두 사용하는 조합 (X, Y)는?", "o": ["(10, 10)", "(15, 5)", "(6, 10)", "(12, 8)"], "a": 3, "e": "2.000 × 12 + 3.000 × 8 = 24.000 + 24.000 = <b>48.000 원</b>. ① tốn 50.000 (vượt), ② 45.000 và ③ 42.000 (còn dư tiền).", "star": false, "img": null}, {"n": 45, "p": "소득이 36,000원이고, X재의 가격은 3,000원, Y재의 가격은 2,000원이다. X재의 가격만 4,000원으로 오르면 어떻게 되는가?", "o": ["X재의 최대 구입량은 3개 줄고, Y재의 최대 구입량은 변하지 않는다.", "X재의 최대 구입량은 3개 줄고, Y재의 최대 구입량도 3개 준다.", "X재의 최대 구입량은 변하지 않고, Y재의 최대 구입량만 준다.", "X재의 최대 구입량은 4개 줄고, Y재의 최대 구입량은 변하지 않는다."], "a": 0, "e": "X tối đa: 36.000 ÷ 3.000 = 12 → 36.000 ÷ 4.000 = 9 (<b>giảm 3</b>). Y tối đa: 36.000 ÷ 2.000 = 18, <b>không đổi</b>.", "star": true, "img": null}, {"n": 46, "p": "수진은 커피 1잔에 항상 설탕 2봉지를 넣어서 마신다(완전보완재). 수진에게 커피 4잔과 설탕 6봉지가 있다면, 만족을 얻으며 마실 수 있는 커피는 최대 몇 잔인가?", "o": ["2잔", "3잔", "4잔", "6잔"], "a": 1, "e": "Mỗi ly cần 2 gói đường: 6 gói chỉ đủ cho <b>3 ly</b>. Ly cà phê thứ 4 không có đường nên không làm tăng thỏa mãn.", "star": true, "img": null}, {"n": 47, "p": "어떤 사람에게 5,000원 지폐 2장과 10,000원 지폐 1장은 만족도가 같다(완전대체재). 이 사람이 5,000원 지폐 6장과 10,000원 지폐 2장을 가지고 있을 때와 같은 만족도를 10,000원 지폐만으로 얻으려면 몇 장이 필요한가?", "o": ["2장", "3장", "4장", "5장"], "a": 3, "e": "6 tờ 5.000 원 = 3 tờ 10.000 원 → tổng cộng 3 + 2 = <b>5 tờ</b> 10.000 원.", "star": false, "img": null}, {"n": 48, "p": "소득이 12,000원이고, 김밥의 가격은 3,000원, 음료의 가격은 1,500원이다. 각 조합의 효용이 다음과 같을 때, 이 소비자의 최적 선택은?<div class=\"tw\"><table class=\"dt\"><tr><th>조합</th><th>가</th><th>나</th><th>다</th><th>라</th></tr><tr><th>김밥(줄)</th><td>2</td><td>4</td><td>3</td><td>1</td></tr><tr><th>음료(개)</th><td>4</td><td>2</td><td>2</td><td>4</td></tr><tr><th>효용</th><td>50</td><td>65</td><td>58</td><td>40</td></tr></table></div>", "o": ["가", "나", "다", "라"], "a": 2, "e": "Chi phí: 가 12.000, 나 15.000 (vượt ngân sách → không mua được), 다 12.000, 라 9.000. Trong các tổ hợp mua được, <b>다 có hữu dụng cao nhất (58)</b>.", "star": true, "img": null}, {"n": 49, "p": "[그림]은 아이스크림을 먹을 때의 한계 효용이다. 4개를 먹었을 때의 총효용은?", "o": ["14", "16", "18", "20"], "a": 3, "e": "TU = tổng MU = 8 + 6 + 4 + 2 = <b>20</b>.", "star": false, "img": "c49"}, {"n": 50, "p": "[그림]은 과자를 먹을 때의 총효용이다. 한계 효용이 0이 되는 것은 몇 번째 과자인가?", "o": ["3번째", "4번째", "5번째", "6번째"], "a": 2, "e": "MU lần lượt là 12, 9, 6, 3, 0, −2. Ở <b>bánh thứ 5</b>, TU từ 30 → 30 không đổi → MU = 0.", "star": false, "img": "c50"}]}];

const CIRC=['①','②','③','④'];
LESSONS.forEach((L,li)=>L.qs.forEach(q=>{q.L=li;q.id=li+'-'+q.n;}));
const TABS=[{key:'b1',full:LESSONS[0].tab,short:'Bài 1'},{key:'b2',full:LESSONS[1].tab,short:'Bài 2'},{key:'mix',full:'Ôn tập tổng hợp (종합 연습)',short:'Tổng hợp'}];
const CFG={b1:{n:20,sec:600},b2:{n:20,sec:600},mix:{n:40,sec:2700}};
const app=document.getElementById('app'), hdr=document.getElementById('hdr'), tabsEl=document.getElementById('tabs');
let tab='b1', view='home';
const practice={b1:{i:0,ans:{}},b2:{i:0,ans:{}}};
let test=null, timerId=null, reviewFilter='all';
const lastSet={b1:[],b2:[],mix:[]};

function LI(){return tab==='b2'?1:0;}
function PR(){return practice[tab];}
function QS(){return LESSONS[LI()].qs;}
function testActive(){return view==='test'&&test&&!test.done;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function top0(){window.scrollTo({top:0,behavior:'instant'});}

function renderTabs(){
  tabsEl.innerHTML=TABS.map(t=>`<button class="tabbtn ${t.key===tab?'on':''}" data-act="tab" data-t="${t.key}" aria-current="${t.key===tab?'page':'false'}"><span class="full">${t.full}</span><span class="short">${t.short}</span></button>`).join('');
}
function qBlock(q,label,extra=''){
  return `<div class="qhead"><span class="qnum">${label}</span>${extra}${q.star?'<span class="star">★ Nâng cao</span>':''}</div>
  <div class="prompt">${q.p}</div>
  ${q.img?`<figure class="fig"><img src="${IMG[q.img]}" alt="그림"></figure>`:''}`;
}
function optsBlock(q,clsFn,disabled,tagFn=()=>''){
  const isImg=q.o[0].startsWith('IMG:');
  return `<div class="opts ${isImg?'g4':''}">`+q.o.map((o,i)=>{
    const body=o.startsWith('IMG:')?`<img src="${IMG[o.slice(4)]}" alt="그래프 ${CIRC[i]}">`:`<span>${o}${tagFn(i)}</span>`;
    return `<button class="opt ${isImg?'imgopt':''} ${clsFn(i)}" data-act="pick" data-i="${i}" ${disabled?'disabled':''}><span class="mark">${CIRC[i]}</span>${body}${isImg?tagFn(i):''}</button>`;
  }).join('')+'</div>';
}
function lessonBadge(q){return `<span class="lb">Bài ${q.L+1}</span>`;}

      <ul><li>Biết đúng/sai ngay khi chọn</li><li>Lời giải tiếng Việt dưới mỗi câu</li><li>Quay lại câu bất kỳ để xem lại</li></ul>
      <div class="go">${done?`Tiếp tục (${done}/${N}) →`:'Bắt đầu luyện tập →'}</div>

      <div class="ic">⏱</div>

      <ul><li>Mỗi lần làm là một bộ ${c.n} câu mới</li><li>Làm đủ ${c.n} câu mới nộp được bài</li><li>Hết giờ tự động nộp bài</li></ul>

/* ---------------- PRACTICE ---------------- */
function practiceStats(){let ok=0,no=0;const P=PR();for(const q of QS()){const a=P.ans[q.n];if(a===undefined)continue;a===q.a?ok++:no++;}return{ok,no};}
function renderPractice(scroll=true){
  view='practice'; stopTimer(); renderTabs();
  const P=PR(), qs=QS(), N=qs.length, q=qs[P.i], a=P.ans[q.n], done=a!==undefined;
  const st=practiceStats();
  hdr.innerHTML=`<span class="pill"><span class="ok">✓ ${st.ok}</span> · <span class="no">✗ ${st.no}</span></span>`;
  const cls=i=>!done?'':(i===q.a?'correct':(i===a?'wrong':'dim'));
  const fb=done?`<div class="fb ${a===q.a?'ok':'no'}"><div class="fb-h">${a===q.a?'Chính xác!':'Chưa đúng'} · Đáp án đúng: ${CIRC[q.a]}</div><div class="fb-b">${q.e}</div></div>`:'';
  const grid=qs.map((x,k)=>{const v=P.ans[x.n];const c=v===undefined?'':(v===x.a?'ok':'no');return `<button class="cell ${c} ${k===P.i?'cur':''}" data-act="goto" data-k="${k}">${x.n}</button>`;}).join('');
  app.innerHTML=`
  <div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted">Luyện tập · Câu ${q.n}/${N}</span><span class="muted">${Object.keys(P.ans).length} câu đã làm</span></div>
  <div class="prog"><i style="width:${(P.i+1)/N*100}%"></i></div>
  <article class="card">
    ${qBlock(q,'Câu '+q.n)}
    ${optsBlock(q,cls,done)}
    ${fb}
  </article>
  <div class="nav">
    <button class="btn" data-act="prev" ${P.i===0?'disabled':''}>← Câu trước</button>
    ${P.i<N-1?`<button class="btn primary grow" data-act="next">${done?'Câu tiếp theo →':'Bỏ qua →'}</button>`:`<button class="btn primary grow" data-act="psummary">Xem kết quả luyện tập</button>`}
  </div>
  <details class="navi" ${window.innerWidth>700?'open':''}><summary>Danh sách ${N} câu</summary>
    <div class="grid">${grid}</div>
    <div class="legend"><span><i style="background:var(--ok-soft);border:1px solid #9fd0b2"></i>Đúng</span><span><i style="background:var(--no-soft);border:1px solid #e9aaa3"></i>Sai</span><span><i style="background:#fff;border:1px solid var(--line-2)"></i>Chưa làm</span></div>
    <div style="margin-top:10px"><button class="btn ghost" data-act="preset">↺ Làm lại từ đầu</button></div>
  </details>
  <div class="kbd">Phím tắt: <span>1</span>–<span>4</span> chọn đáp án · <span>←</span> <span>→</span> chuyển câu</div>`;
  if(scroll) top0();
}
function renderPracticeSummary(){
  view='psummary'; hdr.innerHTML='';
  const P=PR(), qs=QS(), N=qs.length, st=practiceStats();
  const wrong=qs.filter(q=>P.ans[q.n]!==undefined&&P.ans[q.n]!==q.a).map(q=>q.n);
  const skipped=qs.filter(q=>P.ans[q.n]===undefined).map(q=>q.n);
  app.innerHTML=`<article class="card" style="margin-top:16px">
    <div class="score"><div class="ring" style="--p:${st.ok/N*100}"><div><div><b>${st.ok}</b><small>/ ${N} câu</small></div></div></div>
    <div><h2 style="margin:0 0 4px">Kết quả luyện tập</h2>
    <div class="stats"><span class="stat ok">Đúng ${st.ok}</span><span class="stat no">Sai ${st.no}</span><span class="stat t">Chưa làm ${skipped.length}</span></div>
    ${wrong.length?`<div class="muted">Câu sai: ${wrong.map(n=>`<a href="#" data-act="goto" data-k="${n-1}">${n}</a>`).join(', ')}</div>`:''}
    ${skipped.length?`<div class="muted">Câu chưa làm: ${skipped.map(n=>`<a href="#" data-act="goto" data-k="${n-1}">${n}</a>`).join(', ')}</div>`:''}
    </div></div>
    <div class="nav"><button class="btn" data-act="preset">↺ Làm lại từ đầu</button><button class="btn warm grow" data-act="test">Thử chế độ kiểm tra →</button></div>
  </article>`; top0();
}

/* ---------------- TEST ---------------- */
function pickFrom(list,n,avoid){let pool=list.filter(q=>!avoid.includes(q.id));if(pool.length<n)pool=list.slice();return shuffle(pool.slice()).slice(0,n);}
function startTest(){
  const c=CFG[tab]; let items;
  if(tab==='mix'){const h=c.n/2;items=shuffle([...pickFrom(LESSONS[0].qs,h,lastSet.mix),...pickFrom(LESSONS[1].qs,h,lastSet.mix)]);}
  else items=pickFrom(QS(),c.n,lastSet[tab]);
  lastSet[tab]=items.map(q=>q.id);
  test={scope:tab,n:c.n,sec:c.sec,items,i:0,ans:{},start:Date.now(),deadline:Date.now()+c.sec*1000,done:false,timeout:false};
  reviewFilter='all'; startTimer(); renderTest();
}
function startTimer(){stopTimer();timerId=setInterval(tick,250);}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function tick(){
  if(!test||test.done) return stopTimer();
  const left=(test.deadline-Date.now())/1000;
  const el=document.getElementById('timer');
  if(el){el.textContent='⏱ '+fmt(left);el.classList.toggle('low',left<=60);}
  if(left<=0){test.timeout=true;finishTest();}
}
function answeredCount(){return Object.keys(test.ans).length;}
function renderTest(scroll=true){
  view='test'; renderTabs();
  const T=test, q=T.items[T.i], a=T.ans[T.i], mix=T.scope==='mix';
  const left=(T.deadline-Date.now())/1000;
  hdr.innerHTML=`<span class="pill timer ${left<=60?'low':''}" id="timer">⏱ ${fmt(left)}</span>`;
  const n=answeredCount(), all=n===T.n;
  const grid=T.items.map((_,j)=>`<button class="cell ${T.ans[j]!==undefined?'done':''} ${j===T.i?'cur':''}" data-act="tgoto" data-k="${j}">${j+1}</button>`).join('');
  app.innerHTML=`
  <div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted">${mix?'Kiểm tra tổng hợp':'Kiểm tra'} · Câu ${T.i+1}/${T.n}</span><span class="muted">Đã trả lời ${n}/${T.n}</span></div>
  <div class="prog warm"><i style="width:${n/T.n*100}%"></i></div>
  <article class="card">
    ${qBlock(q,'Câu '+(T.i+1),mix?lessonBadge(q):'')}
    ${optsBlock(q,i=>i===a?'sel':'',false)}
  </article>
  <div class="nav">
    <button class="btn" data-act="tprev" ${T.i===0?'disabled':''}>← Câu trước</button>
    <button class="btn primary grow" data-act="tnext" ${T.i===T.n-1?'disabled':''}>Câu tiếp theo →</button>
  </div>
  <div class="navi"><div class="grid">${grid}</div>
    <div class="legend"><span><i style="background:var(--accent-soft);border:1px solid #a9c6dc"></i>Đã trả lời</span><span><i style="background:#fff;border:1px solid var(--line-2)"></i>Chưa trả lời</span></div>
  </div>
  <div class="submit">
    <span class="muted">${all?`Bạn đã trả lời đủ ${T.n} câu. Có thể đổi đáp án trước khi nộp.`:`Còn ${T.n-n} câu chưa trả lời. Làm đủ ${T.n} câu mới nộp được bài.`}</span>
    <button class="btn warm" data-act="submit" ${all?'':'disabled'}>Nộp bài</button>
  </div>
  <div class="kbd">Phím tắt: <span>1</span>–<span>4</span> chọn đáp án · <span>←</span> <span>→</span> chuyển câu</div>`;
  if(scroll) top0();
}
function finishTest(){
  if(!test||test.done) return;
  test.done=true; test.used=Math.min(test.sec,(Date.now()-test.start)/1000); stopTimer(); renderResult();
}
function renderResult(){
  view='result'; hdr.innerHTML=''; renderTabs();
  const T=test, mix=T.scope==='mix';
  const items=T.items.map((q,j)=>({j,q,a:T.ans[j]}));
  const ok=items.filter(x=>x.a===x.q.a).length, no=T.n-ok;
  const unanswered=items.filter(x=>x.a===undefined).length;
  const list=items.filter(x=>reviewFilter==='all'||x.a!==x.q.a);
  const r=ok/T.n, msg=r>=0.9?'Xuất sắc!':r>=0.75?'Rất tốt!':r>=0.5?'Khá ổn, cố thêm chút nữa!':'Hãy ôn lại và thử lại nhé!';
  let split='';
  if(mix){split=[0,1].map(li=>{const s=items.filter(x=>x.q.L===li);return `<span class="stat t">Bài ${li+1}: ${s.filter(x=>x.a===x.q.a).length}/${s.length}</span>`;}).join('');}
  app.innerHTML=`
  <article class="card" style="margin-top:16px">
    ${T.timeout?`<div class="timeout">Hết giờ — bài đã được nộp tự động${unanswered?` (${unanswered} câu chưa trả lời tính là sai)`:''}</div>`:''}
    <div class="score">
      <div class="ring" style="--p:${r*100}"><div><div><b>${ok}</b><small>/ ${T.n} câu</small></div></div></div>
      <div><h2 style="margin:0 0 2px">${msg}</h2>
        <div class="stats"><span class="stat ok">Đúng ${ok}</span><span class="stat no">Sai ${no}</span><span class="stat t">Thời gian ${fmt(T.used)}</span>${split}</div>
        <div class="row"><button class="btn warm" data-act="test">Làm đề mới (${T.n} câu khác)</button><button class="btn" data-act="home">Trang chủ</button></div>
      </div>
    </div>
  </article>
  <div class="tabs"><button class="tab ${reviewFilter==='all'?'on':''}" data-act="filter" data-f="all">Tất cả (${T.n})</button><button class="tab ${reviewFilter==='wrong'?'on':''}" data-act="filter" data-f="wrong">Câu sai (${no})</button></div>
  <div class="review">${list.length?list.map(({j,q,a})=>{
    const right=a===q.a;
    const cls=i=>i===q.a?'correct':(i===a?'wrong':'dim');
    const tag=i=>i===q.a?'<span class="tag ok">Đáp án đúng</span>':(i===a?'<span class="tag no">Bạn chọn</span>':'');
    return `<article class="card">${qBlock(q,'Câu '+(j+1),`${mix?lessonBadge(q):''}<span class="orig">(câu ${q.n} trong đề gốc Bài ${q.L+1})</span>`)}
      ${optsBlock(q,cls,true,tag)}
      <div class="fb ${right?'ok':(a===undefined?'neutral':'no')}"><div class="fb-h">${right?'Đúng':(a===undefined?'Chưa trả lời':'Sai')} · Đáp án đúng: ${CIRC[q.a]}${!right&&a!==undefined?` · Bạn chọn: ${CIRC[a]}`:''}</div><div class="fb-b">${q.e}</div></div>
    </article>`;}).join(''):'<p class="muted">Không có câu sai. Tuyệt vời!</p>'}</div>`;
  top0();
}

/* ---------------- events ---------------- */
function leaveTestOk(msg){
  if(!testActive()) return true;
  if(!confirm(msg)) return false;
  test=null; stopTimer(); return true;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const act=t.dataset.act;
  if(t.tagName==='A') e.preventDefault();
  if(act==='tab'){
    if(!leaveTestOk('Bài kiểm tra chưa nộp sẽ bị hủy. Chuyển sang tab khác?')) return;
    tab=t.dataset.t; return renderHome();
  }
  if(act==='home'){
    if(!leaveTestOk('Bài kiểm tra chưa nộp sẽ bị hủy. Về trang chủ?')) return;
    return renderHome();
  }
  if(act==='practice'&&tab!=='mix') return renderPractice();
  if(act==='test'){ if(testActive()) return; return startTest(); }
  if((view==='practice'||view==='psummary')&&tab!=='mix'){
    const P=PR(), N=QS().length;
    if(act==='pick'){const q=QS()[P.i];if(P.ans[q.n]===undefined){P.ans[q.n]=+t.dataset.i;renderPractice(false);} return;}
    if(act==='prev'&&P.i>0){P.i--;return renderPractice();}
    if(act==='next'&&P.i<N-1){P.i++;return renderPractice();}
    if(act==='goto'){P.i=+t.dataset.k;return renderPractice();}
    if(act==='psummary') return renderPracticeSummary();
    if(act==='preset'){if(confirm('Xóa toàn bộ câu trả lời và làm lại từ câu 1?')){practice[tab]={i:0,ans:{}};renderPractice();}return;}
  }
  if(testActive()){
    if(act==='pick'){test.ans[test.i]=+t.dataset.i;return renderTest(false);}
    if(act==='tprev'&&test.i>0){test.i--;return renderTest();}
    if(act==='tnext'&&test.i<test.n-1){test.i++;return renderTest();}
    if(act==='tgoto'){test.i=+t.dataset.k;return renderTest();}
    if(act==='submit'&&answeredCount()===test.n) return finishTest();
  }
  if(view==='result'&&act==='filter'){reviewFilter=t.dataset.f;return renderResult();}
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea')||e.metaKey||e.ctrlKey||e.altKey) return;
  const n=['1','2','3','4'].indexOf(e.key);
  if(view==='practice'){
    const P=PR(), qs=QS(), q=qs[P.i];
    if(n>=0&&P.ans[q.n]===undefined){P.ans[q.n]=n;renderPractice(false);}
    else if(e.key==='ArrowRight'&&P.i<qs.length-1){P.i++;renderPractice();}
    else if(e.key==='ArrowLeft'&&P.i>0){P.i--;renderPractice();}
  } else if(testActive()){
    if(n>=0){test.ans[test.i]=n;renderTest(false);}
    else if(e.key==='ArrowRight'&&test.i<test.n-1){test.i++;renderTest();}
    else if(e.key==='ArrowLeft'&&test.i>0){test.i--;renderTest();}
  }
});
window.addEventListener('beforeunload',e=>{if(testActive()){e.preventDefault();e.returnValue='';}});
renderHome();

</script>
</body>
</html>
